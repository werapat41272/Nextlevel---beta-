/* =====================================================================
   2. STORAGE — localStorage wrapper (ไม่ throw, มี fallback ในหน่วยความจำ)
   ===================================================================== */
var Storage = {
  KEY: "tl:v0:progress",
  available: true,
  _mem: null,
  probe: function () {
    try {
      var k = "__tl_probe__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      this.available = true;
    } catch (e) {
      this.available = false;
    }
    return this.available;
  },
  /** คืน object ที่ parse แล้ว หรือ null (ไม่มีข้อมูล / ข้อมูลเสีย) */
  load: function () {
    if (!this.available) return this._mem;
    var raw;
    try { raw = window.localStorage.getItem(this.KEY); }
    catch (e) { this.available = false; return this._mem; }
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  },
  /** คืน true ถ้าบันทึกลง localStorage สำเร็จ */
  save: function (progress) {
    this._mem = progress;
    if (!this.available) return false;
    try { window.localStorage.setItem(this.KEY, JSON.stringify(progress)); return true; }
    catch (e) { this.available = false; return false; }
  },
  clear: function () {
    this._mem = null;
    try { window.localStorage.removeItem(this.KEY); } catch (e) { /* ignore */ }
  }
};

/* =====================================================================
   3. PROGRESS ENGINE — pure functions (รับ progress คืน progress ใหม่)
   แหล่งความจริงเดียวของ "ผ่านแล้ว" = completedLessons
   สถานะ Locked / Available / Completed คำนวณจากรายการนี้ ไม่เก็บซ้ำ
   ===================================================================== */
var Engine = {
  VERSION: 1,

  createDefault: function () { return { version: 1, modules: {} }; },

  _clone: function (o) { return JSON.parse(JSON.stringify(o)); },

  findModule: function (moduleId) {
    for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === moduleId) return MODULES[i];
    return null;
  },

  /** หา lesson จาก id ในทุก module → { module, lesson } หรือ null */
  findLesson: function (lessonId) {
    for (var i = 0; i < MODULES.length; i++) {
      var ls = MODULES[i].lessons;
      for (var j = 0; j < ls.length; j++) if (ls[j].id === lessonId) return { module: MODULES[i], lesson: ls[j] };
    }
    return null;
  },

  _emptyModuleState: function () {
    return { completedLessons: [], assessment: { bestScore: null, attemptCount: 0, attemptHistory: [] }, lessonProgress: {} };
  },

  /** state ของ module (เติมค่า default ให้ครบเสมอ) */
  getModuleState: function (progress, moduleId) {
    var base = this._emptyModuleState();
    var s = progress && progress.modules && progress.modules[moduleId];
    if (!s) return base;
    return {
      completedLessons: Array.isArray(s.completedLessons) ? s.completedLessons : base.completedLessons,
      assessment: Object.assign({}, base.assessment, s.assessment || {}),
      lessonProgress: s.lessonProgress && typeof s.lessonProgress === "object" ? s.lessonProgress : {}
    };
  },

  /** ทำความสะอาดข้อมูลที่โหลดมา: ข้อมูลเสีย/เวอร์ชันไม่ตรง → default, ตัด id แปลกปลอม, ตัดบทที่ข้ามลำดับ */
  normalize: function (raw) {
    var out = this.createDefault();
    if (!raw || typeof raw !== "object" || raw.version !== this.VERSION || !raw.modules || typeof raw.modules !== "object") return out;
    var self = this;
    MODULES.forEach(function (m) {
      var src = raw.modules[m.id];
      if (!src || typeof src !== "object") return;
      var done = Array.isArray(src.completedLessons) ? src.completedLessons : [];
      // เก็บเฉพาะบทที่ต่อเนื่องจากบทแรก (กันข้อมูลที่ข้ามลำดับ)
      var kept = [];
      for (var i = 0; i < m.lessons.length; i++) {
        if (done.indexOf(m.lessons[i].id) === -1) break;
        kept.push(m.lessons[i].id);
      }
      var a = src.assessment && typeof src.assessment === "object" ? src.assessment : {};
      var history = (Array.isArray(a.attemptHistory) ? a.attemptHistory : []).filter(function (h) {
        return h && typeof h === "object" && isFinite(h.pct) && isFinite(h.correct) && isFinite(h.total);
      });
      var best = history.length ? Math.max.apply(null, history.map(function (h) { return h.pct; })) : null;
      var lessonProgress = {};
      if (src.lessonProgress && typeof src.lessonProgress === "object") {
        Object.keys(src.lessonProgress).forEach(function (lessonId) {
          var f = self.findLesson(lessonId);
          var lp = src.lessonProgress[lessonId];
          if (f && f.module.id === m.id && lp && isFinite(lp.currentExercise) && lp.currentExercise >= 0) {
            lessonProgress[lessonId] = { currentExercise: Math.floor(lp.currentExercise) };
          }
        });
      }
      out.modules[m.id] = {
        completedLessons: kept,
        assessment: { bestScore: best, attemptCount: history.length, attemptHistory: history },
        lessonProgress: lessonProgress
      };
    });
    return out;
  },

  moduleStatus: function (module, progress) {
    var idx = MODULES.indexOf(module);
    if (idx <= 0) return this.isModuleComplete(module, progress) ? "completed" : "available";
    var prev = MODULES[idx - 1];
    if (!this.isModuleComplete(prev, progress)) return "locked";
    return this.isModuleComplete(module, progress) ? "completed" : "available";
  },

  /** "completed" | "available" | "locked" */
  lessonStatus: function (module, progress, lessonId) {
    if (this.moduleStatus(module, progress) === "locked") return "locked";
    var done = this.getModuleState(progress, module.id).completedLessons;
    if (done.indexOf(lessonId) !== -1) return "completed";
    var lesson = null;
    for (var i = 0; i < module.lessons.length; i++) if (module.lessons[i].id === lessonId) lesson = module.lessons[i];
    if (!lesson) return "locked";
    var allPrevDone = module.lessons.every(function (l) { return l.order >= lesson.order || done.indexOf(l.id) !== -1; });
    return allPrevDone ? "available" : "locked";
  },

  canOpen: function (module, progress, lessonId) {
    return this.lessonStatus(module, progress, lessonId) !== "locked";
  },

  /** ทำเครื่องหมายว่าผ่านบท — ทำได้เฉพาะบทที่ available (คืน progress เดิมถ้าไม่มีการเปลี่ยนแปลง) */
  completeLesson: function (module, progress, lessonId) {
    if (this.lessonStatus(module, progress, lessonId) !== "available") return progress;
    var next = this._clone(progress);
    var ms = next.modules[module.id] || (next.modules[module.id] = this._emptyModuleState());
    ms.completedLessons.push(lessonId);
    return next;
  },

  /** บทที่ควรเรียนต่อ = บทแรกที่ยังไม่ผ่าน (null ถ้าจบ module แล้ว) */
  getCurrentLesson: function (module, progress) {
    var done = this.getModuleState(progress, module.id).completedLessons;
    for (var i = 0; i < module.lessons.length; i++) if (done.indexOf(module.lessons[i].id) === -1) return module.lessons[i];
    return null;
  },

  getLessonByOrder: function (module, order) {
    for (var i = 0; i < module.lessons.length; i++) if (module.lessons[i].order === order) return module.lessons[i];
    return null;
  },

  getOverall: function (module, progress) {
    var total = module.lessons.length;
    var completed = this.getModuleState(progress, module.id).completedLessons.length;
    return { completed: completed, total: total, percent: Math.round((completed / total) * 100) };
  },

  isModuleComplete: function (module, progress) {
    return this.getCurrentLesson(module, progress) === null;
  }
};

/* =====================================================================
   4. QUIZ ENGINE — ตรวจคำตอบ choice / match / number
   ===================================================================== */
var Quiz = {
  normalizeNumber: function (value) {
    var raw = String(value == null ? "" : value).trim().replace(/,/g, "");
    if (!raw) return null;
    if (!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(raw)) return null;
    var n = Number(raw);
    return isFinite(n) ? n : null;
  },

  getExercises: function (lesson) {
    return Array.isArray(lesson.exercises) ? lesson.exercises : [];
  },

  getExercise: function (lesson, index) {
    var list = this.getExercises(lesson);
    return list[index] || null;
  },

  getLessonIndex: function (module, lessonId, progress) {
    var f = Engine.findLesson(lessonId);
    if (!f) return 0;
    var ms = Engine.getModuleState(progress, module.id);
    var lp = ms.lessonProgress && ms.lessonProgress[lessonId];
    var n = lp ? Number(lp.currentExercise) : 0;
    if (!isFinite(n) || n < 0) n = 0;
    var max = Math.max(0, this.getExercises(f.lesson).length - 1);
    return Math.min(Math.floor(n), max);
  },

  saveIndex: function (module, progress, lessonId, index) {
    var next = Engine._clone(progress);
    var ms = next.modules[module.id] || (next.modules[module.id] = Engine._emptyModuleState());
    if (!ms.lessonProgress) ms.lessonProgress = {};
    ms.lessonProgress[lessonId] = { currentExercise: Math.max(0, Math.floor(index)) };
    return next;
  },

  check: function (exercise, answer) {
    if (!exercise) return { correct: false, reason: "missing" };

    if (exercise.type === "choice") {
      return { correct: answer === exercise.answer, type: "choice" };
    }

    if (exercise.type === "number") {
      var actual = this.normalizeNumber(answer);
      var expected = Number(exercise.answer);
      var tolerance = Number(exercise.tolerance || 0);
      return {
        correct: actual !== null && isFinite(expected) && Math.abs(actual - expected) <= tolerance,
        type: "number",
        actual: actual
      };
    }

    if (exercise.type === "match") {
      if (!answer || typeof answer !== "object") return { correct: false, type: "match" };
      var pairs = Array.isArray(exercise.pairs) ? exercise.pairs : [];
      var correct = pairs.length > 0 && pairs.every(function (pair) {
        return answer[pair.id] === pair.answer;
      });
      return { correct: correct, type: "match" };
    }

    return { correct: false, reason: "unsupported" };
  }
};

/* =====================================================================
   5. STATE — state เดียวของแอป
   ===================================================================== */
var state = {
  progress: Engine.createDefault(),
  route: { name: "home" },
  menuOpen: false,
  modal: null,          // null | "reset"
  storageOk: true,
  restoreFocus: null,   // id ขององค์ประกอบที่ต้องคืน focus หลัง render
  quiz: { feedback: null, submitted: false },
  assessment: null
};

function commitProgress(next) {
  if (next === state.progress) return;
  state.progress = next;
  state.storageOk = Storage.save(next);
  render();
}

/* =====================================================================
   6. RENDER — state → HTML (ข้อมูลทั้งหมดผ่าน esc())
   ===================================================================== */
function esc(v) {
  return String(v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function pad(n) { return String(n).padStart(2, "0"); }

var ICONS = {
  check: '<path d="M3.5 8.5l3 3 6-6.5"/>',
  lock: '<rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/>',
  arrow: '<path d="M3 8h10M9 4l4 4-4 4"/>',
  back: '<path d="M13 8H3M7 4L3 8l4 4"/>',
  menu: '<path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>',
  close: '<path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/>'
};
function icon(name, size) {
  var s = size || 16;
  return '<svg class="icon" viewBox="0 0 16 16" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + "</svg>";
}

var STATUS_TEXT = { completed: "ผ่านแล้ว", available: "พร้อมเรียน", locked: "ล็อก" };

function lessonTitleFull(l) {
  return (l.type === "assessment" ? "Assessment" : "บทที่ " + pad(l.order)) + " · " + l.title;
}
function lessonHref(id) { return "#/lesson/" + encodeURIComponent(id); }

function renderTopbar() {
  return '<header class="topbar"><div class="topbar-inner">' +
    '<button type="button" class="btn btn-secondary btn-small menu-btn" id="menu-btn" data-action="toggle-menu" aria-label="เปิดรายการบทเรียน" aria-expanded="' + state.menuOpen + '" aria-controls="sidebar">' + icon("menu") + " บทเรียน</button>" +
    '<a class="brand" href="#/"><span class="brand-dot" aria-hidden="true"></span><span class="brand-text">Next Level Trading Learning Programs</span></a>' +
    '<button type="button" class="btn btn-secondary btn-small" id="reset-btn" data-action="reset-open">Reset Progress</button>' +
    "</div></header>";
}

function renderModuleSwitcher(activeModule) {
  return '<nav class="module-switcher" aria-label="Modules">' + MODULES.map(function (mod, i) {
    var st = Engine.moduleStatus(mod, state.progress);
    var label = 'Module ' + (i + 1) + ' · ' + mod.title;
    if (st === "locked") return '<span class="btn btn-secondary" aria-disabled="true">' + icon("lock") + ' ' + esc(label) + '</span>';
    return '<a class="btn ' + (mod.id === activeModule.id ? 'btn-primary' : 'btn-secondary') + '" href="' + lessonHref(mod.lessons[0].id) + '">' + esc(label) + '</a>';
  }).join('') + '</nav>';
}

function renderProgressPanel(m) {
  var o = Engine.getOverall(m, state.progress);
  var cur = Engine.getCurrentLesson(m, state.progress);
  var best = Engine.getModuleState(state.progress, m.id).assessment.bestScore;
  var passed = best !== null && best >= m.passingScore;
  var curText = cur ? lessonTitleFull(cur) : "เรียนจบ Module แล้ว";
  var scoreText = best === null ? "ยังไม่ได้ทำ" : best + "%" + (passed ? " · ผ่าน" : "");
  return renderModuleSwitcher(m) + '<section class="panel progress-panel" aria-label="ความคืบหน้าของ ' + esc(m.title) + '">' +
    '<div class="pp-head"><h2 class="pp-title">' + esc(m.title) + "</h2>" +
    '<span class="pp-count"><strong>' + o.percent + "%</strong> · " + o.completed + " / " + o.total + " Lessons</span></div>" +
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + o.percent + '" aria-label="ความคืบหน้า ' + esc(m.title) + '"><div class="progress-fill" style="width:' + o.percent + '%"></div></div>' +
    '<div class="pp-stats">' +
    '<div class="pp-stat"><span class="k">Lessons completed</span><span class="v">' + o.completed + " / " + o.total + "</span></div>" +
    '<div class="pp-stat"><span class="k">Current lesson</span><span class="v">' + esc(curText) + "</span></div>" +
    '<div class="pp-stat"><span class="k">Assessment score</span><span class="v">' + esc(scoreText) + "</span></div>" +
    "</div></section>";
}

function renderSidebar(m) {
  var activeId = state.route.name === "lesson" ? state.route.lessonId : null;
  var items = m.lessons.map(function (l) {
    var st = Engine.lessonStatus(m, state.progress, l.id);
    var stIcon = st === "completed" ? icon("check") : st === "available" ? icon("arrow") : icon("lock");
    var inner = '<span class="num" aria-hidden="true">' + pad(l.order) + "</span>" +
      '<span class="name">' + esc(l.title) + '<span class="visually-hidden"> — ' + STATUS_TEXT[st] + "</span></span>" +
      '<span class="state" aria-hidden="true">' + stIcon + "</span>";
    var cls = "lesson-item is-" + st;
    if (st === "locked") return '<li><span class="' + cls + '" aria-disabled="true">' + inner + "</span></li>";
    var cur = l.id === activeId ? ' aria-current="page"' : "";
    return '<li><a class="' + cls + '" href="' + lessonHref(l.id) + '"' + cur + ">" + inner + "</a></li>";
  }).join("");
  return '<div class="overlay' + (state.menuOpen ? " open" : "") + '" data-action="close-menu"></div>' +
    '<aside class="sidebar' + (state.menuOpen ? " open" : "") + '" id="sidebar" aria-label="รายการบทเรียน">' +
    '<div class="sidebar-head"><span class="sidebar-title">บทเรียน</span>' +
    '<button type="button" class="btn btn-secondary btn-small sidebar-close" data-action="close-menu" aria-label="ปิดรายการบทเรียน">' + icon("close") + "</button></div>" +
    '<nav aria-label="บทเรียน"><ol class="lesson-list" style="list-style:none;margin:0;padding:0">' + items + "</ol></nav></aside>";
}

function isCourseComplete() {
  return MODULES.every(function (mod) { return Engine.isModuleComplete(mod, state.progress); });
}

function renderCourseCompleted() {
  return '<section class="panel hero course-complete" aria-labelledby="main-heading">' +
    '<span class="eyebrow">Beginner Learning Path · Completed</span>' +
    '<h1 id="main-heading" tabindex="-1">คุณเรียนจบ Beginner Learning Path แล้ว</h1>' +
    '<p class="lead">ตอนนี้คุณมีเส้นทางคิดตั้งแต่การอ่านตลาด → สร้างแผน → จัดการความเสี่ยง → สร้างระบบ → Backtest → Forward Test และทบทวนจากข้อมูล</p>' +
    '<ol class="flow" aria-label="กระบวนการหลังเรียนจบ"><li data-n="1">สร้างกฎ</li><li data-n="2">Backtest</li><li data-n="3">Forward Test</li><li data-n="4">Review & Improve</li></ol>' +
    '<div class="next-step panel" style="background:var(--bg)"><div><div class="label">ขั้นต่อไป</div><div class="what">นำระบบของคุณไปเก็บข้อมูลต่ออย่างเป็นขั้นตอน และกลับมาทบทวน Module ที่ต้องการได้ทุกเมื่อ</div></div>' +
    '<a class="btn btn-primary" href="' + lessonHref(MODULES[8].lessons[0].id) + '">ทบทวนการสร้างระบบ ' + icon("arrow") + '</a></div>' +
    '</section>';
}

function renderHome(m) {
  if (isCourseComplete()) return renderCourseCompleted();
  var o = Engine.getOverall(m, state.progress);
  var cur = Engine.getCurrentLesson(m, state.progress);
  var started = o.completed > 0;
  var cta, nextBlock;
  if (!cur) {
    cta = '<a class="btn btn-primary" href="' + lessonHref(m.lessons[0].id) + '">ทบทวนจากบทแรก ' + icon("arrow") + "</a>";
    nextBlock = '<div><div class="label">สถานะ</div><div class="what">เรียนจบ ' + esc(m.title) + " แล้ว — เปิดบทใดก็ได้เพื่อทบทวน</div></div>";
  } else {
    cta = '<a class="btn btn-primary" href="' + lessonHref(cur.id) + '">' + (started ? "เรียนต่อ" : "เริ่มเรียน") + " " + icon("arrow") + "</a>";
    nextBlock = '<div><div class="label">ขั้นต่อไป</div><div class="what">' + esc(lessonTitleFull(cur)) + "</div></div>";
  }
  return '<section class="panel hero" aria-labelledby="main-heading">' +
    '<span class="eyebrow">Next Level Trading Learning Programs · Learning Path</span>' +
    '<h1 id="main-heading" tabindex="-1">เปิดกราฟแล้วไม่รู้ว่าต้องเริ่มดูอะไร?</h1>' +
    '<p class="lead">เริ่มจากพื้นฐานของการเทรดทีละบท เรียนสั้น ๆ ตอบคำถาม รับ Feedback แล้วผ่านเพื่อปลดล็อกบทถัดไป</p>' +
    '<ol class="flow" aria-label="วิธีเรียน"><li data-n="1">เรียน</li><li data-n="2">ดูตัวอย่าง</li><li data-n="3">ตอบคำถาม</li><li data-n="4">ตอบถูกเพื่อไปต่อ</li></ol>' +
    '<div class="next-step panel" style="background:var(--bg)">' + nextBlock + cta + "</div>" +
    "</section>";
}

function renderLocked(m, l) {
  var cur = Engine.getCurrentLesson(m, state.progress);
  var need = cur ? lessonTitleFull(cur) : "";
  return '<section class="panel notice" aria-labelledby="main-heading">' +
    '<span class="icon-wrap">' + icon("lock", 22) + "</span>" +
    '<h1 id="main-heading" tabindex="-1">บทนี้ยังล็อกอยู่</h1>' +
    "<p>" + esc(lessonTitleFull(l)) + " จะเปิดเมื่อผ่านบทก่อนหน้า" + (need ? " — ต้องผ่าน " + esc(need) + " ก่อน" : "") + "</p>" +
    (cur ? '<a class="btn btn-primary" href="' + lessonHref(cur.id) + '">ไปที่ ' + esc(lessonTitleFull(cur)) + " " + icon("arrow") + "</a>" : "") +
    "</section>";
}

function getDraftAnswer(ex) {
  var key = "tl:draft:" + ex.id;
  try {
    var raw = window.sessionStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function setDraftAnswer(ex, value) {
  try { window.sessionStorage.setItem("tl:draft:" + ex.id, JSON.stringify(value)); } catch (e) {}
}

function clearDraftAnswer(ex) {
  try { window.sessionStorage.removeItem("tl:draft:" + ex.id); } catch (e) {}
}

function renderContent(lesson) {
  if (!Array.isArray(lesson.content)) return "";
  return '<div class="lesson-content">' + lesson.content.map(function (c) {
    if (c.type === "example") {
      return '<section class="panel example"><div class="example-label">' + esc(c.label || "ตัวอย่าง") + '</div><div class="example-value">' + esc(c.text) + '</div></section>';
    }
    return '<section class="panel lesson-copy"><p>' + esc(c.text || "") + '</p></section>';
  }).join("") + '</div>';
}

function renderChoiceExercise(ex, value) {
  var selected = value == null ? "" : String(value);
  return '<div class="choice-list">' + ex.options.map(function (o, i) {
    var id = "choice-" + ex.id + "-" + o.id;
    return '<div class="choice"><input type="radio" name="exercise-choice" id="' + esc(id) + '" value="' + esc(o.id) + '"' + (selected === String(o.id) ? " checked" : "") + '><label for="' + esc(id) + '"><span class="choice-key">' + String.fromCharCode(65 + i) + '</span>' + esc(o.text) + '</label></div>';
  }).join("") + '</div>';
}

function renderMatchExercise(ex, value) {
  var values = value && typeof value === "object" ? value : {};
  return '<div class="match-list">' + ex.pairs.map(function (p) {
    var current = values[p.id] || "";
    return '<div class="match-row"><span class="match-term">' + esc(p.term) + '</span><select data-match-id="' + esc(p.id) + '" aria-label="จับคู่ ' + esc(p.term) + '"><option value="">เลือกประเภท</option>' +
      ex.options.map(function (o) { return '<option value="' + esc(o) + '"' + (current === o ? " selected" : "") + '>' + esc(o) + '</option>'; }).join("") +
      '</select></div>';
  }).join("") + '</div>';
}

function renderNumberExercise(ex, value) {
  return '<div class="number-wrap"><label class="visually-hidden" for="exercise-number">คำตอบตัวเลข</label>' +
    '<input id="exercise-number" type="text" inputmode="decimal" autocomplete="off" value="' + esc(value == null ? "" : value) + '" placeholder="เช่น -10 หรือ 1,000">' +
    '<div class="input-help">รับเครื่องหมาย + / - และ comma ได้ เช่น -10 หรือ 1,000</div></div>';
}

function renderExercise(m, l) {
  var exercises = Quiz.getExercises(l);
  if (!exercises.length) {
    return '<section class="panel placeholder exercise">บทนี้ยังไม่มี Exercise</section>';
  }

  var index = Quiz.getLessonIndex(m, l.id, state.progress);
  var ex = exercises[index];
  var q = state.quiz || { feedback: null, submitted: false };
  var stored = getDraftAnswer(ex);
  var input = ex.type === "choice" ? renderChoiceExercise(ex, stored) :
              ex.type === "match" ? renderMatchExercise(ex, stored) :
              renderNumberExercise(ex, stored);

  var feedback = "";
  if (q.feedback && q.feedback.lessonId === l.id && q.feedback.exerciseId === ex.id) {
    var f = q.feedback;
    feedback = '<div class="feedback ' + (f.correct ? "correct" : "wrong") + '" role="status" aria-live="polite">' +
      '<div class="feedback-title">' + (f.correct ? "ถูกต้อง" : "ยังไม่ถูก") + '</div>' +
      '<p>' + esc(f.empty ? "กรุณาตอบคำถามให้ครบก่อนตรวจคำตอบ" : (f.correct ? ex.explanation : (ex.hint || "ลองดูแนวคิดในบทเรียนอีกครั้ง แล้วตอบใหม่"))) + '</p>' +
      (f.correct && ex.explanation ? "" : "") +
      '</div>';
  }

  var last = index >= exercises.length - 1;
  var action = q.feedback && q.feedback.lessonId === l.id && q.feedback.exerciseId === ex.id && q.feedback.correct
    ? (last ? "complete-lesson" : "next-exercise")
    : "submit-exercise";
  var actionText = action === "complete-lesson" ? "ผ่านบทนี้ →" :
                   action === "next-exercise" ? "ไปข้อถัดไป →" :
                   (q.feedback && q.feedback.lessonId === l.id && q.feedback.exerciseId === ex.id && !q.feedback.correct ? "ลองอีกครั้ง" : "ตรวจคำตอบ");

  return '<section class="panel exercise" aria-labelledby="exercise-question">' +
    '<div class="exercise-head"><span class="exercise-label">Exercise ' + (index + 1) + ' / ' + exercises.length + '</span><span class="progress-note">คิดจากหลักการ ไม่ใช่เดาคำตอบ</span></div>' +
    '<h2 class="exercise-question" id="exercise-question">' + esc(ex.question) + '</h2>' +
    input +
    '<div class="exercise-actions"><button type="button" class="btn btn-primary" data-action="' + action + '" data-lesson="' + esc(l.id) + '" data-exercise="' + esc(ex.id) + '">' + actionText + '</button></div>' +
    feedback +
    '</section>';
}

function shuffleArray(items) {
  var a = items.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function ensureAssessmentState(l) {
  if (state.assessment && state.assessment.lessonId === l.id) return state.assessment;
  var optionOrders = {};
  l.questions.forEach(function (q) {
    optionOrders[q.id] = shuffleArray(q.options.map(function (_, i) { return i; }));
  });
  state.assessment = {
    lessonId: l.id,
    order: l.questions.map(function (_, i) { return i; }),
    optionOrders: optionOrders,
    answers: {},
    submitted: false,
    result: null
  };
  return state.assessment;
}

function renderAssessment(m, l) {
  var a = ensureAssessmentState(l);
  var qs = a.order.map(function (i) { return l.questions[i]; });
  var ms = Engine.getModuleState(state.progress, m.id);
  var best = ms.assessment.bestScore;
  var intro = '<section class="panel lesson-copy"><p>ตอบทั้ง ' + l.questions.length + ' ข้อแล้วกด <strong>ส่งคำตอบ</strong> เมื่อพร้อม ระบบจะคำนวณคะแนนและแสดงเฉลยหลังส่งเท่านั้น</p>' +
    '<p>เกณฑ์ผ่าน: <strong>' + m.passingScore + '%</strong> ขึ้นไป · หากไม่ผ่านสามารถทำใหม่ได้ไม่จำกัด และตัวเลือกจะถูกสลับใหม่ทุกครั้ง</p>' +
    (best !== null ? '<p class="assessment-best">Best Score: <strong>' + esc(best) + '%</strong></p>' : '') +
    '</section>';

  if (a.submitted && a.result) {
    var r = a.result;
    var passed = r.pct >= m.passingScore;
    var moduleIndex = MODULES.indexOf(m);
    var nextModule = moduleIndex >= 0 && moduleIndex < MODULES.length - 1 ? MODULES[moduleIndex + 1] : null;
    var nextModuleCta = '';
    if (passed && nextModule) {
      nextModuleCta = '<a class="btn btn-primary" href="' + lessonHref(nextModule.lessons[0].id) + '">เริ่ม Module ' + (moduleIndex + 2) + ' · ' + esc(nextModule.title) + ' ' + icon("arrow") + '</a>';
    } else if (passed) {
      nextModuleCta = '<a class="btn btn-primary" href="#/">เรียนจบโปรแกรมแล้ว ' + icon("check") + '</a>';
    }
    var summary = '<section class="panel assessment-result ' + (passed ? 'result-pass' : 'result-fail') + '" role="status">' +
      '<div class="result-label">ผลการประเมิน</div><div class="result-score">' + r.pct + '%</div>' +
      '<p>' + (passed ? (nextModule ? 'ผ่าน ' + esc(m.title) + ' แล้ว — พร้อมไป Module ถัดไป' : 'ผ่าน Module สุดท้ายแล้ว — คุณเรียนจบ Beginner Learning Path') : 'ยังไม่ผ่าน — ต้องได้อย่างน้อย ' + m.passingScore + '% เพื่อผ่าน Assessment') + '</p>' +
      '<p>ตอบถูก ' + r.correct + ' / ' + r.total + ' ข้อ</p>' +
      '<div class="exercise-actions">' +
      (passed ? nextModuleCta + '<button type="button" class="btn btn-secondary" data-action="assessment-retry">ทำ Assessment อีกครั้ง</button>' : '<button type="button" class="btn btn-primary" data-action="assessment-retry">ลองทำ Assessment อีกครั้ง</button>') +
      '</div></section>';
    var details = '<section class="assessment-review">' + qs.map(function (q, i) {
      var selected = r.answers[q.id];
      var ok = selected === q.answer;
      var chosen = q.options.filter(function (o) { return o.id === selected; })[0];
      var correct = q.options.filter(function (o) { return o.id === q.answer; })[0];
      return '<article class="panel assessment-review-item ' + (ok ? 'is-correct' : 'is-wrong') + '">' +
        '<div class="review-head"><span>ข้อ ' + (i + 1) + '</span><strong>' + (ok ? 'ถูกต้อง' : 'ไม่ถูกต้อง') + '</strong></div>' +
        '<h3>' + esc(q.question) + '</h3>' +
        '<p>คำตอบของคุณ: <strong>' + esc(chosen ? chosen.text : 'ไม่ได้ตอบ') + '</strong></p>' +
        (!ok ? '<p>คำตอบที่ถูก: <strong>' + esc(correct.text) + '</strong></p>' : '') +
        '<p>' + esc(q.explanation) + '</p></article>';
    }).join('') + '</section>';
    return intro + summary + details;
  }

  var form = '<section class="panel assessment" aria-labelledby="assessment-heading">' +
    '<div class="exercise-head"><span class="exercise-label">Module Assessment · ' + l.questions.length + ' ข้อ</span><span class="progress-note">ยังไม่แสดงเฉลยจนกว่าจะส่งคำตอบ</span></div>' +
    '<h2 id="assessment-heading" class="visually-hidden">Module Assessment</h2>';
  form += qs.map(function (q, i) {
    var optionIndexes = a.optionOrders[q.id] || q.options.map(function (_, idx) { return idx; });
    var options = optionIndexes.map(function (idx) { return q.options[idx]; });
    return '<fieldset class="assessment-question"><legend><span class="assessment-number">ข้อ ' + (i + 1) + '</span>' + esc(q.question) + '</legend>' +
      '<div class="choice-list">' + options.map(function (o, oi) {
        var id = 'assessment-' + q.id + '-' + o.id;
        return '<div class="choice"><input type="radio" name="assessment-' + esc(q.id) + '" id="' + esc(id) + '" value="' + esc(o.id) + '"' + (a.answers[q.id] === o.id ? ' checked' : '') + '><label for="' + esc(id) + '"><span class="choice-key">' + String.fromCharCode(65 + oi) + '</span>' + esc(o.text) + '</label></div>';
      }).join('') + '</div></fieldset>';
  }).join('');
  form += '<div class="exercise-actions"><button type="button" class="btn btn-primary" data-action="assessment-submit">ส่งคำตอบ</button></div>' +
    '</section>';
  return intro + form;
}

function collectAssessmentAnswers(l) {
  var answers = {};
  l.questions.forEach(function (q) {
    var el = document.querySelector('input[name="assessment-' + q.id + '"]:checked');
    answers[q.id] = el ? el.value : null;
  });
  return answers;
}

function handleAssessmentSubmit() {
  var f = state.route.name === 'lesson' ? Engine.findLesson(state.route.lessonId) : null;
  if (!f || f.lesson.type !== 'assessment') return;
  var a = ensureAssessmentState(f.lesson);
  if (a.submitted) return;
  var answers = collectAssessmentAnswers(f.lesson);
  var correct = f.lesson.questions.reduce(function (n, q) { return n + (answers[q.id] === q.answer ? 1 : 0); }, 0);
  var total = f.lesson.questions.length;
  var pct = Math.round((correct / total) * 100);
  a.answers = answers;
  a.submitted = true;
  a.result = { correct: correct, total: total, pct: pct, answers: answers };

  var next = Engine._clone(state.progress);
  var ms = next.modules[f.module.id] || (next.modules[f.module.id] = Engine._emptyModuleState());
  if (!ms.assessment) ms.assessment = { bestScore: null, attemptCount: 0, attemptHistory: [] };
  var history = Array.isArray(ms.assessment.attemptHistory) ? ms.assessment.attemptHistory.slice() : [];
  history.push({ timestamp: new Date().toISOString(), pct: pct, correct: correct, total: total });
  ms.assessment.attemptHistory = history;
  ms.assessment.attemptCount = history.length;
  ms.assessment.bestScore = history.reduce(function (best, h) { return best === null || h.pct > best ? h.pct : best; }, null);

  if (pct >= f.module.passingScore && ms.completedLessons.indexOf(f.lesson.id) === -1) {
    ms.completedLessons.push(f.lesson.id);
  }
  commitProgress(next);
}

function handleAssessmentRetry() {
  state.assessment = null;
  render();
}

function renderLesson(m, l) {
  var st = Engine.lessonStatus(m, state.progress, l.id);
  if (st === "locked") return renderLocked(m, l);

  var prev = Engine.getLessonByOrder(m, l.order - 1);
  var next = Engine.getLessonByOrder(m, l.order + 1);
  var nextOpen = next && Engine.canOpen(m, state.progress, next.id);

  var badge = '<span class="badge badge-' + st + '">' + STATUS_TEXT[st] + "</span>";
  var review = st === "completed" ? '<span class="badge">โหมดทบทวน — สถานะการผ่านไม่เปลี่ยน</span>' : "";
  var objective = l.objective ? '<div class="section"><h2>Learning Objective</h2><p>' + esc(l.objective) + "</p></div>" : "";
  var topics = '<div class="section"><h2>หัวข้อในบทนี้</h2><ul class="topics">' + l.topics.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></div>";

  var learning = l.type === "assessment"
    ? renderAssessment(m, l)
    : renderContent(l) + renderExercise(m, l);

  var prevBtn = prev ? '<a class="btn btn-secondary" href="' + lessonHref(prev.id) + '">' + icon("back") + " " + esc(lessonTitleFull(prev)) + "</a>" : "<span></span>";
  var nextBtn = "";
  if (next) {
    nextBtn = nextOpen
      ? '<a class="btn btn-primary" href="' + lessonHref(next.id) + '">' + esc(lessonTitleFull(next)) + " " + icon("arrow") + "</a>"
      : '<span class="btn btn-secondary" aria-disabled="true">' + icon("lock") + " ผ่านบทนี้เพื่อปลดล็อกบทถัดไป</span>";
  }

  return '<article aria-labelledby="main-heading">' +
    '<div class="panel view-head"><span class="eyebrow">' + esc(m.title) + "</span>" +
    '<h1 id="main-heading" tabindex="-1">' + esc(lessonTitleFull(l)) + "</h1>" +
    '<div class="meta">' + badge + review + "</div>" + objective + topics + "</div>" +
    learning +
    '<nav class="pager" aria-label="เปลี่ยนบท">' + prevBtn + nextBtn + "</nav></article>";
}
function renderNotFound() {
  return '<section class="panel notice" aria-labelledby="main-heading"><h1 id="main-heading" tabindex="-1">ไม่พบหน้านี้</h1>' +
    '<p>ลิงก์อาจไม่ถูกต้อง</p><a class="btn btn-primary" href="#/">กลับหน้าแรก</a></section>';
}

function renderModal() {
  if (state.modal !== "reset") return "";
  return '<div class="modal-backdrop" data-action="reset-cancel">' +
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">' +
    '<h2 id="modal-title">ล้างความคืบหน้าทั้งหมด?</h2>' +
    '<p id="modal-desc">บทที่ผ่านแล้วและคะแนน Assessment ทั้งหมดจะถูกลบและกลับไปเริ่มที่บทแรก การกระทำนี้ย้อนกลับไม่ได้</p>' +
    '<div class="actions"><button type="button" class="btn btn-secondary" id="modal-cancel" data-action="reset-cancel">ยกเลิก</button>' +
    '<button type="button" class="btn btn-danger" data-action="reset-confirm">ล้างข้อมูล</button></div></div></div>';
}

function render() {
  var app = document.getElementById("app");
  var r = state.route;
  var found = r.name === "lesson" ? Engine.findLesson(r.lessonId) : null;
  var m = found ? found.module : MODULES.filter(function (mod) { return Engine.moduleStatus(mod, state.progress) === "available"; })[0] || MODULES[MODULES.length - 1];
  var view;
  if (r.name === "lesson") {
    view = found ? renderLesson(found.module, found.lesson) : renderNotFound();
  } else if (r.name === "notfound") {
    view = renderNotFound();
  } else {
    view = renderHome(m);
  }
  var banner = state.storageOk ? "" : '<div class="banner" role="status">เบราว์เซอร์นี้ไม่อนุญาตให้บันทึกข้อมูล — ความคืบหน้าจะหายเมื่อปิดหรือรีโหลดหน้านี้</div>';

  var y = window.scrollY;
  app.innerHTML = renderTopbar() +
    '<div class="page">' + renderProgressPanel(m) + banner +
    '<div class="layout">' + renderSidebar(m) + '<main class="main" id="main">' + view + "</main></div></div>" +
    '<footer class="footer"><strong>Next Level Trading Learning Programs</strong> · สื่อการเรียนรู้เท่านั้น ไม่ใช่คำแนะนำการลงทุน และไม่มีสัญญาณซื้อขาย</footer>' +
    renderModal();
  window.scrollTo(0, y);
  afterRender();
}

function afterRender() {
  var el = null;
  if (state.modal) el = document.getElementById("modal-cancel");
  else if (state.restoreFocus) el = document.getElementById(state.restoreFocus);
  state.restoreFocus = null;
  if (el) el.focus({ preventScroll: true });
}

/* =====================================================================
   7. NAVIGATION — hash router + lock guard
   #/                    → หน้าแรก
   #/lesson/<lessonId>   → บทเรียน (ถ้า locked แสดงหน้าแจ้งเตือน ไม่เปิดเนื้อหา)
   ===================================================================== */
function parseHash() {
  var h = window.location.hash.replace(/^#\/?/, "");
  if (!h) return { name: "home" };
  var parts = h.split("/");
  if (parts[0] === "lesson" && parts[1]) {
    var id;
    try { id = decodeURIComponent(parts[1]); } catch (e) { return { name: "notfound" }; }
    return { name: "lesson", lessonId: id };
  }
  return { name: "notfound" };
}

function onRoute(isInitial) {
  state.quiz = { feedback: null, submitted: false };
  state.assessment = null;
  state.route = parseHash();
  state.menuOpen = false;
  render();
  window.scrollTo(0, 0);
  if (!isInitial) {
    var h = document.getElementById("main-heading");
    if (h) h.focus({ preventScroll: true });
  }
}

function collectAnswer(ex) {
  if (ex.type === "choice") {
    var selected = document.querySelector('input[name="exercise-choice"]:checked');
    return selected ? selected.value : null;
  }
  if (ex.type === "number") {
    var input = document.getElementById("exercise-number");
    return input ? input.value : "";
  }
  if (ex.type === "match") {
    var answer = {};
    document.querySelectorAll("[data-match-id]").forEach(function (select) {
      answer[select.getAttribute("data-match-id")] = select.value;
    });
    return answer;
  }
  return null;
}

function isEmptyAnswer(ex, answer) {
  if (ex.type === "match") {
    return !answer || Object.keys(answer).length !== ex.pairs.length || ex.pairs.some(function (p) { return !answer[p.id]; });
  }
  return answer === null || String(answer).trim() === "";
}

function handleSubmitExercise(lessonId) {
  var f = Engine.findLesson(lessonId);
  if (!f || f.lesson.type === "assessment") return;
  var index = Quiz.getLessonIndex(f.module, f.lesson.id, state.progress);
  var ex = Quiz.getExercise(f.lesson, index);
  if (!ex) return;

  var answer = collectAnswer(ex);
  if (isEmptyAnswer(ex, answer)) {
    state.quiz = { feedback: { lessonId: lessonId, exerciseId: ex.id, correct: false, empty: true }, submitted: true };
    render();
    return;
  }

  setDraftAnswer(ex, answer);
  var result = Quiz.check(ex, answer);
  state.quiz = { feedback: { lessonId: lessonId, exerciseId: ex.id, correct: result.correct }, submitted: true };
  render();
}

function handleNextExercise(lessonId) {
  var f = Engine.findLesson(lessonId);
  if (!f || f.lesson.type === "assessment") return;
  var index = Quiz.getLessonIndex(f.module, f.lesson.id, state.progress);
  var exercises = Quiz.getExercises(f.lesson);
  if (!exercises.length || index >= exercises.length - 1) return;

  // ล้าง draft ของข้อเดิมและบันทึก index ของข้อถัดไปเพียงครั้งเดียว
  clearDraftAnswer(exercises[index]);
  state.quiz = { feedback: null, submitted: false };
  var nextProgress = Quiz.saveIndex(f.module, state.progress, f.lesson.id, index + 1);
  commitProgress(nextProgress);
}

function handleCompleteLesson(lessonId) {
  var f = Engine.findLesson(lessonId);
  if (!f) return;
  var index = Quiz.getLessonIndex(f.module, f.lesson.id, state.progress);
  var ex = Quiz.getExercise(f.lesson, index);
  var feedback = state.quiz && state.quiz.feedback;
  if (!ex || !feedback || !feedback.correct) return;

  clearDraftAnswer(ex);
  var next = Engine.completeLesson(f.module, state.progress, f.lesson.id);
  var ms = next.modules[f.module.id] || (next.modules[f.module.id] = Engine._emptyModuleState());
  if (ms.lessonProgress && ms.lessonProgress[f.lesson.id]) delete ms.lessonProgress[f.lesson.id];
  state.quiz = { feedback: null, submitted: false };
  commitProgress(next);
}

function onClick(e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  // คลิกในกล่อง modal ไม่ถือเป็นการคลิก backdrop
  if (el.classList.contains("modal-backdrop") && e.target !== el) return;

  if (action === "assessment-submit") { handleAssessmentSubmit(); }
  else if (action === "assessment-retry") { handleAssessmentRetry(); }
  else if (action === "toggle-menu") { state.menuOpen = !state.menuOpen; state.restoreFocus = "menu-btn"; render(); }
  else if (action === "close-menu") { state.menuOpen = false; state.restoreFocus = "menu-btn"; render(); }
  else if (action === "reset-open") { state.modal = "reset"; render(); }
  else if (action === "reset-cancel") { state.modal = null; state.restoreFocus = "reset-btn"; render(); }
  else if (action === "reset-confirm") {
    state.modal = null;
    Storage.clear();
    state.progress = Engine.createDefault();
    state.storageOk = Storage.available;
    if (window.location.hash && window.location.hash !== "#/") window.location.hash = "#/"; // → onRoute
    else render();
  }
  else if (action === "submit-exercise") {
    handleSubmitExercise(el.getAttribute("data-lesson"));
  }
  else if (action === "next-exercise") {
    handleNextExercise(el.getAttribute("data-lesson"));
  }
  else if (action === "complete-lesson") {
    handleCompleteLesson(el.getAttribute("data-lesson"));
  }
}

function onKeydown(e) {
  if (e.key === "Escape") {
    if (state.modal) { state.modal = null; state.restoreFocus = "reset-btn"; render(); }
    else if (state.menuOpen) { state.menuOpen = false; state.restoreFocus = "menu-btn"; render(); }
    return;
  }
  // focus trap ใน modal
  if (e.key === "Tab" && state.modal) {
    var btns = document.querySelectorAll(".modal button");
    if (!btns.length) return;
    var first = btns[0], last = btns[btns.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}

/* =====================================================================
   8. INIT
   ===================================================================== */
function init() {
  Storage.probe();
  state.storageOk = Storage.available;
  state.progress = Engine.normalize(Storage.load());
  state.route = parseHash();
  render();
  window.addEventListener("hashchange", function () { onRoute(false); });
  document.addEventListener("click", onClick);
  document.addEventListener("keydown", onKeydown);
}

// เปิดให้ทดสอบ/ดีบักจาก Console ได้ (อ่านอย่างเดียวโดยเจตนา: ไม่ใช่ API ทางการ)
window.NextLevelTradingLearning = { MODULES: MODULES, Storage: Storage, Engine: Engine, getState: function () { return state; } };

init();
})();
</script>
