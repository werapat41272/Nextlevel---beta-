<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Level Trading Learning Programs — Trading Basics V0</title>
<style>
/* =====================================================================
   STYLE — tokens → base → layout → components → responsive
   ===================================================================== */
:root {
  --bg: #0a0f1c;
  --surface: #111827;
  --raised: #1a2335;
  --line: #243044;
  --line-strong: #34425a;
  --text: #e5e9f0;
  --strong: #ffffff;
  --muted: #9aa7bd;
  --faint: #8391a8;
  --accent: #34d399;
  --accent-strong: #6ee7b7;
  --accent-ink: #04130d;
  --info: #60a5fa;
  --danger: #fb7185;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", "Leelawadee UI", "Thonburi", "Noto Sans Thai", "Sarabun", Tahoma, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { flex: none; }
[tabindex="-1"]:focus { outline: none; }

/* ---------- layout ---------- */
.topbar { position: sticky; top: 0; z-index: 30; background: rgba(10, 15, 28, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1120px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--strong); margin-right: auto; min-width: 0; }
.brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.brand-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-btn { display: none; }
.page { max-width: 1120px; margin: 0 auto; padding: 20px 20px 48px; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 20px; }
.main { min-width: 0; }
.footer { max-width: 1120px; margin: 0 auto; padding: 20px; border-top: 1px solid var(--line); color: var(--faint); font-size: 13px; text-align: center; }

/* ---------- components ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: 15px; border: 1px solid transparent; min-height: 44px; transition: background .15s, border-color .15s; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-secondary { background: transparent; border-color: var(--line-strong); color: var(--text); }
.btn-secondary:hover { background: var(--raised); }
.btn-small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn-danger { background: var(--danger); color: #1f0610; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 500; background: var(--raised); color: var(--muted); }
.badge-completed { background: rgba(52, 211, 153, .12); color: var(--accent-strong); }
.badge-available { background: rgba(96, 165, 250, .12); color: var(--info); }
.eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.progress { height: 8px; border-radius: 999px; background: var(--raised); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }

/* progress panel */
.pp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pp-title { font-size: 18px; color: var(--strong); }
.pp-count { color: var(--muted); font-size: 15px; }
.pp-count strong { color: var(--strong); }
.progress-panel .progress { margin-top: 12px; }
.pp-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.pp-stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.pp-stat .k { display: block; font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.pp-stat .v { display: block; color: var(--strong); font-weight: 600; overflow-wrap: anywhere; }

/* sidebar */
.sidebar { position: sticky; top: 76px; }
.sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sidebar-title { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.sidebar-close { display: none; }
.lesson-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.lesson-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; color: var(--text); min-height: 48px; }
a.lesson-item:hover { background: var(--raised); }
.lesson-item[aria-current="page"] { background: var(--raised); border-color: var(--line-strong); }
.lesson-item .num { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: var(--raised); color: var(--muted); flex: none; }
.lesson-item .name { flex: 1; min-width: 0; line-height: 1.35; }
.lesson-item .state { flex: none; color: var(--faint); display: inline-flex; }
.lesson-item.is-completed .num { background: var(--accent); color: var(--accent-ink); }
.lesson-item.is-completed .state { color: var(--accent); }
.lesson-item.is-available .num { border: 1px solid var(--info); color: var(--info); background: transparent; }
.lesson-item.is-available .state { color: var(--info); }
.lesson-item.is-locked { color: var(--faint); cursor: not-allowed; }
.overlay { display: none; }

/* views */
.hero h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.25; color: var(--strong); margin-top: 8px; }
.hero .lead { color: var(--muted); font-size: 18px; margin-top: 12px; max-width: 60ch; }
.hero .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.flow { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.flow li { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 14px; color: var(--muted); }
.flow li::before { content: attr(data-n); color: var(--accent); font-weight: 600; margin-right: 8px; }
.next-step { margin-top: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.next-step .label { font-size: 13px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.next-step .what { color: var(--strong); font-weight: 600; }
.view-head h1 { font-size: clamp(22px, 3.2vw, 30px); line-height: 1.3; color: var(--strong); margin-top: 6px; }
.view-head .meta { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.section { margin-top: 16px; }
.section h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.topics { margin: 0; padding-left: 20px; color: var(--text); }
.placeholder { border-style: dashed; border-color: var(--line-strong); color: var(--muted); }
.dev-box { margin-top: 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 14px; font-size: 14px; color: var(--muted); }
.pager { margin-top: 20px; display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.notice { text-align: center; padding: 32px 20px; }
.notice .icon-wrap { display: inline-flex; width: 48px; height: 48px; border-radius: 50%; background: var(--raised); align-items: center; justify-content: center; color: var(--muted); margin-bottom: 12px; }
.notice h1 { font-size: 22px; color: var(--strong); }
.notice p { margin-top: 8px; color: var(--muted); }
.notice .btn { margin-top: 16px; }
.banner { margin-top: 16px; border: 1px solid #b45309; background: rgba(180, 83, 9, .15); color: #fcd9a8; border-radius: 10px; padding: 10px 14px; font-size: 14px; }

/* modal */
.modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(2, 6, 23, .72); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; padding: 24px; width: min(440px, 100%); }
.modal h2 { font-size: 20px; color: var(--strong); }
.modal p { margin-top: 8px; color: var(--muted); }
.modal .actions { margin-top: 20px; display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }


/* ---------- lesson / exercise engine ---------- */
.lesson-content { margin-top: 16px; }
.lesson-content .panel + .panel { margin-top: 12px; }
.lesson-copy { color: var(--text); }
.lesson-copy p + p { margin-top: 10px; }
.example { border-left: 3px solid var(--info); background: rgba(96,165,250,.07); }
.example-label { color: var(--info); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.example-value { margin-top: 6px; color: var(--strong); font-weight: 600; }
.exercise { margin-top: 16px; }
.exercise-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.exercise-label { color: var(--faint); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.exercise-question { margin-top: 6px; color: var(--strong); font-size: 18px; line-height: 1.5; font-weight: 600; }
.choice-list { display: grid; gap: 10px; margin-top: 16px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice label { display: block; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.choice label:hover { background: var(--raised); }
.choice input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice input:checked + label { border-color: var(--info); background: rgba(96,165,250,.08); }
.choice-key { display: inline-flex; width: 26px; height: 26px; border: 1px solid var(--line-strong); border-radius: 7px; align-items: center; justify-content: center; margin-right: 8px; color: var(--muted); font-size: 13px; font-weight: 700; }
.match-list { display: grid; gap: 10px; margin-top: 16px; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(160px, 220px); gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.match-term { color: var(--strong); font-weight: 600; }
select, input[type="text"], input[type="number"] { width: 100%; min-height: 44px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--text); padding: 9px 12px; font: inherit; }
select:focus, input[type="text"]:focus, input[type="number"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.number-wrap { margin-top: 16px; max-width: 280px; }
.input-help { margin-top: 6px; color: var(--faint); font-size: 13px; }
.exercise-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.feedback { margin-top: 16px; border-radius: 10px; padding: 14px; border: 1px solid var(--line-strong); }
.feedback.correct { border-color: rgba(52,211,153,.45); background: rgba(52,211,153,.08); }
.feedback.wrong { border-color: rgba(251,113,133,.45); background: rgba(251,113,133,.08); }
.feedback-title { font-weight: 700; color: var(--strong); }
.feedback p { margin-top: 6px; color: var(--muted); }
.feedback .hint { color: var(--text); }
.progress-note { color: var(--muted); font-size: 14px; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .menu-btn { display: inline-flex; }
  .page { padding: 16px 16px 40px; }
  .topbar-inner { padding: 8px 16px; }
  .layout { grid-template-columns: minmax(0, 1fr); margin-top: 16px; }
  .sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 320px); z-index: 60; background: var(--surface); border-right: 1px solid var(--line-strong); padding: 16px; overflow-y: auto; transform: translateX(-104%); transition: transform .2s; visibility: hidden; }
  .sidebar.open { transform: none; visibility: visible; }
  .sidebar-close { display: inline-flex; }
  .overlay.open { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(2, 6, 23, .6); }
  .pp-stats { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .pp-stat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .pp-stat .v { text-align: right; }
  .hero .lead { font-size: 16px; }
}
@media (max-width: 560px) {
  .topbar-inner { gap: 8px; }
  .brand { font-size: 14px; }
  .brand-dot { width: 8px; height: 8px; }
  #reset-btn { padding-left: 10px; padding-right: 10px; font-size: 12px; }
  .panel { padding: 16px; }
  .flow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .flow li { text-align: center; padding: 6px 8px; }
  .next-step { align-items: stretch; }
  .next-step > * { width: 100%; }
  .next-step .btn { width: 100%; }
  .pager { display: grid; grid-template-columns: minmax(0, 1fr); }
  .pager .btn, .pager > span.btn { width: 100%; }
  .assessment-question { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
  .assessment-question { margin: 0 0 24px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
  .assessment-question legend { width: 100%; padding: 0; margin: 0 0 16px; font-weight: 650; line-height: 1.55; }
  .assessment-number { display: block; margin-bottom: 7px; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .assessment-best { margin-top: 10px; }
  .assessment-result { margin-top: 16px; text-align: center; }
  .result-label { color: var(--muted); font-size: 13px; }
  .result-score { font-size: clamp(42px, 8vw, 72px); line-height: 1; font-weight: 750; margin: 8px 0 12px; }
  .result-pass { border-color: rgba(94, 210, 145, .45); }
  .result-fail { border-color: rgba(235, 115, 115, .45); }
  .assessment-review { display: grid; gap: 12px; margin-top: 16px; }
  .assessment-review-item { border-left: 3px solid var(--line); }
  .assessment-review-item.is-correct { border-left-color: #65d18f; }
  .assessment-review-item.is-wrong { border-left-color: #eb7373; }
  .review-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .assessment-review-item h3 { margin: 0 0 10px; font-size: 16px; line-height: 1.5; }
  .assessment-review-item p { margin: 7px 0 0; color: var(--muted); line-height: 1.55; }
  .assessment-review-item p strong { color: var(--text); }
.module-switcher{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.module-switcher .btn{font-size:12px}
</style>

<style id="private-beta-style">
#betaGate{position:fixed;inset:0;z-index:99999;background:#0b0e13;color:#f4f6f8;display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit}
#betaGate.beta-hidden{display:none}
.beta-card{width:min(440px,100%);background:#11161e;border:1px solid #252d38;border-radius:20px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.beta-mark{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8e9bad;margin-bottom:12px}.beta-card h1{font-size:28px;margin:0 0 10px}.beta-card p{color:#aeb8c5;line-height:1.65;margin:0 0 22px}
.beta-card label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.beta-card input{box-sizing:border-box;width:100%;padding:13px 14px;border-radius:10px;border:1px solid #303946;background:#0b0e13;color:#fff;font-size:16px;outline:none}.beta-card input:focus{border-color:#8fa8ff}
.beta-enter{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#f4f6f8;color:#0b0e13;font-weight:800;cursor:pointer}.beta-error{min-height:20px;color:#ff8f8f!important;font-size:13px;margin:10px 0 0!important}.beta-note{font-size:12px!important;margin-top:18px!important;color:#727f90!important}
</style>
</head>
<body>
<div id="betaGate" aria-modal="true" role="dialog" aria-labelledby="betaTitle">
  <form class="beta-card" id="betaForm">
    <div class="beta-mark">NEXT LEVEL · PRIVATE BETA</div>
    <h1 id="betaTitle">โปรแกรมสำหรับผู้ทดสอบ</h1>
    <p>เวอร์ชันนี้อยู่ระหว่างการทดสอบ กรุณาใส่รหัสผ่านที่ได้รับเพื่อเข้าสู่ Learning Program</p>
    <label for="betaPassword">รหัสผ่าน</label>
    <input id="betaPassword" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required>
    <button class="beta-enter" type="submit">เข้าสู่โปรแกรม</button>
    <p class="beta-error" id="betaError" role="alert"></p>
    <p class="beta-note">Private Beta · Progress การเรียนจะถูกเก็บไว้ใน Browser ของอุปกรณ์นี้</p>
  </form>
</div>
<script id="private-beta-script">
(function(){
  var KEY='nextlevel:beta:access';
  var PASS='Nextupbeta01';
  var gate=document.getElementById('betaGate');
  var form=document.getElementById('betaForm');
  var input=document.getElementById('betaPassword');
  var error=document.getElementById('betaError');
  function unlock(){ gate.classList.add('beta-hidden'); document.body.style.overflow=''; }
  try { if(sessionStorage.getItem(KEY)==='granted') { unlock(); return; } } catch(e) {}
  document.body.style.overflow='hidden';
  setTimeout(function(){ input.focus(); },0);
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(input.value===PASS){
      try { sessionStorage.setItem(KEY,'granted'); } catch(err) {}
      error.textContent=''; unlock();
    } else {
      error.textContent='รหัสผ่านไม่ถูกต้อง'; input.value=''; input.focus();
    }
  });
})();
</script>

      { id:"how-markets-move-01", order:1, type:"lesson", title:"Why Price Moves", objective:"เข้าใจว่าราคาเปลี่ยนแปลงจากการจับคู่คำสั่ง การเร่งเข้าหาสภาพคล่อง และความไม่สมดุลของแรงซื้อขายเชิงรุก โดยไม่ใช้ความเข้าใจผิดว่าในทุกธุรกรรมมีผู้ซื้อจำนวนมากกว่าผู้ขาย", topics:["Orders","Liquidity","Price movement"], content:[

      { id:"how-markets-move-02", order:2, type:"lesson", title:"Candles & OHLC", objective:"อ่านข้อมูลพื้นฐานที่แท่งราคาแสดงได้ โดยไม่ตีความแท่งเดียวเป็นสัญญาณซื้อขาย", topics:["Open","High","Low","Close","Candle"], content:[
        {type:"text",text:"Candle สรุปการเคลื่อนไหวของราคาในช่วงเวลาหนึ่งผ่าน Open, High, Low และ Close (OHLC) โดย Open คือราคาเริ่มต้นของช่วง, High/Low คือราคาสูงสุด/ต่ำสุด และ Close คือราคาสุดท้ายของช่วงนั้น"},

      { id:"how-markets-move-04", order:4, type:"lesson", title:"Directional vs Sideways Movement", objective:"แยกการเคลื่อนไหวที่มีทิศทางออกจากการแกว่งตัวในกรอบได้ในระดับพื้นฐาน", topics:["Directional movement","Sideways","Range"], content:[
        {type:"text",text:"ราคาไม่ได้เคลื่อนที่เป็นเส้นตรงตลอดเวลา บางช่วงเคลื่อนที่ไปทางหนึ่งอย่างชัดเจน (Directional Movement) ขณะที่บางช่วงสลับขึ้นลงอยู่ในพื้นที่เดิมโดยไม่มีการขยายไปด้านใดชัดเจน (Sideways/Range)"},

      ], exercises:[
        {id:"hmm04-q1",type:"choice",question:"ลำดับราคา 100 → 103 → 106 → 109 ใกล้เคียงพฤติกรรมใดมากกว่า?",options:[{id:"a",text:"Directional movement ขึ้น"},{id:"b",text:"Sideways ในพื้นที่เดิม"},{id:"c",text:"ไม่มีการเคลื่อนไหว"},{id:"d",text:"บอกไม่ได้ว่าราคาเปลี่ยนหรือไม่"}],answer:"a",explanation:"ถูกต้อง — ลำดับนี้ขยายระดับราคาไปด้านบนต่อเนื่องในตัวอย่างแบบง่าย",hint:"ดูว่าราคาเดินออกจากพื้นที่เดิมไปทางใดทางหนึ่งหรือไม่"},
        {id:"hmm04-q2",type:"choice",question:"ราคาแกว่ง 100 → 103 → 99 → 102 → 100 โดยยังอยู่บริเวณเดิม พฤติกรรมนี้ใกล้เคียงอะไร?",options:[{id:"a",text:"Directional movement ชัดเจน"},{id:"b",text:"Sideways / Range"},{id:"c",text:"ราคาขึ้นอย่างเดียว"},{id:"d",text:"ราคาลงอย่างเดียว"}],answer:"b",explanation:"ถูกต้อง — ราคาแกว่งกลับไปกลับมาในพื้นที่ใกล้เดิม จึงใกล้เคียง Sideways/Range มากกว่า directional move",hint:"ถามว่าราคากำลังขยายออกจากพื้นที่เดิมหรือวนกลับมา"}
      ]},
      { id:"how-markets-move-05", order:5, type:"lesson", title:"Impulse & Pullback", objective:"เข้าใจรูปแบบพื้นฐานที่ราคาสามารถเคลื่อนแรงในทิศหนึ่งและย้อนกลับบางส่วน โดยยังไม่ใช้เป็น Entry Signal", topics:["Impulse","Pullback","Price leg"], content:[
        {type:"text",text:"การเคลื่อนไหวของราคามักสลับระหว่างช่วงที่ขยายไปทางหนึ่งอย่างเด่นชัด (Impulse) กับช่วงที่ย้อนกลับบางส่วนหรือชะลอ (Pullback) คำเหล่านี้ใช้บรรยายพฤติกรรม ไม่ได้หมายความว่า Pullback ทุกครั้งจะกลับไปต่อทางเดิม"},
        {type:"example",label:"ตัวอย่าง",text:"ราคา 100 → 112 อย่างรวดเร็ว แล้วถอยมาที่ 107 สามารถอธิบายแบบง่ายว่าเกิด Impulse ขึ้นก่อน แล้วตามด้วย Pullback ลงบางส่วน"}
      ], exercises:[
        {id:"hmm05-q1",type:"choice",question:"ราคา 100 → 112 แล้วถอยมา 107 ข้อใดอธิบายลำดับนี้ได้เหมาะสมที่สุดในบทนี้?",options:[{id:"a",text:"Impulse ขึ้น ตามด้วย Pullback"},{id:"b",text:"Sideways ตลอดทั้งช่วง"},{id:"c",text:"ไม่มีการเปลี่ยนราคา"},{id:"d",text:"เป็นสัญญาณ Buy แน่นอน"}],answer:"a",explanation:"ถูกต้อง — เรากำลังบรรยายสิ่งที่ราคาเพิ่งทำ ไม่ได้ใช้ลำดับนี้เป็นคำรับประกันว่าจะขึ้นต่อ",hint:"แยกคำบรรยาย price movement ออกจาก trading signal"},
        {id:"hmm05-q2",type:"choice",question:"ข้อใดสำคัญที่สุดเกี่ยวกับ Pullback?",options:[{id:"a",text:"Pullback รับประกันว่าราคาจะกลับไปทิศเดิม"},{id:"b",text:"Pullback คือการย้อนหรือชะลอจาก move ก่อนหน้า แต่อนาคตยังไม่ถูกยืนยันจากคำนี้เพียงอย่างเดียว"},{id:"c",text:"Pullback เกิดได้เฉพาะขาขึ้น"},{id:"d",text:"Pullback คือ Stop Loss"}],answer:"b",explanation:"ถูกต้อง — Pullback เป็นคำอธิบายการเคลื่อนไหว ไม่ใช่การรับประกัน continuation",hint:"คำว่า Pullback บอกสิ่งที่เกิดแล้ว ไม่ใช่สิ่งที่จะต้องเกิดถัดไป"}
      ]},
      { id:"how-markets-move-06", order:6, type:"lesson", title:"Volatility & Pace", objective:"สังเกตความแตกต่างระหว่างตลาดที่เคลื่อนไหวมาก/เร็วกับตลาดที่เคลื่อนไหวน้อย/ช้าได้", topics:["Volatility","Range expansion","Pace"], content:[
        {type:"text",text:"Volatility ใช้อธิบายขนาดและความแปรปรวนของการเคลื่อนไหวราคา ส่วน Pace คือวิธีสังเกตว่าการเปลี่ยนแปลงกำลังเกิดเร็วหรือช้า ช่วงที่ volatility สูงมักเห็นช่วงราคาและการแกว่งที่กว้างขึ้น แต่ไม่ได้บอกทิศทางด้วยตัวมันเอง"},
        {type:"example",label:"เปรียบเทียบ",text:"ช่วง A แกว่งประมาณ 1–2 หน่วยต่อช่วง ขณะที่ช่วง B แกว่ง 8–10 หน่วยต่อช่วง เราสามารถบอกว่าช่วง B มีการเคลื่อนไหวกว้างกว่า โดยยังไม่สรุปว่าต้องเป็นขาขึ้นหรือขาลง"}
      ], exercises:[
        {id:"hmm06-q1",type:"choice",question:"ถ้า Range ของราคาในแต่ละช่วงขยายจากประมาณ 2 หน่วยเป็นประมาณ 10 หน่วย สิ่งใดสังเกตได้โดยตรง?",options:[{id:"a",text:"การเคลื่อนไหวมีขนาดกว้างขึ้น / volatility สูงขึ้นในตัวอย่าง"},{id:"b",text:"ราคาต้องขึ้นต่อ"},{id:"c",text:"ราคาต้องลงต่อ"},{id:"d",text:"ไม่มีความแตกต่าง"}],answer:"a",explanation:"ถูกต้อง — Volatility บอกขนาด/ความแปรปรวนของการเคลื่อนไหว ไม่ได้กำหนด direction",hint:"แยก ‘เคลื่อนไหวมากแค่ไหน’ ออกจาก ‘เคลื่อนไหวไปทางไหน’"},
        {id:"hmm06-q2",type:"choice",question:"ข้อใดถูกต้องเกี่ยวกับ Volatility?",options:[{id:"a",text:"Volatility สูง = Bullish เสมอ"},{id:"b",text:"Volatility สูง = Bearish เสมอ"},{id:"c",text:"Volatility บอกความมากน้อยของการเคลื่อนไหว แต่ไม่ได้บอกทิศทางเพียงอย่างเดียว"},{id:"d",text:"Volatility คือ Position Size"}],answer:"c",explanation:"ถูกต้อง — ตลาดสามารถผันผวนสูงได้ทั้งขณะขึ้น ลง หรือแกว่งแรง",hint:"Magnitude ไม่เท่ากับ Direction"}
      ]},
      { id:"how-markets-move-07", order:7, type:"lesson", title:"Reading Price Movement", objective:"รวมสิ่งที่เรียนมาเพื่อบรรยายสิ่งที่ราคาเพิ่งทำอย่างเป็นลำดับ ก่อนเข้าสู่ Market Context ใน Module ถัดไป", topics:["Observe","Describe","Sequence","No prediction"], content:[
        {type:"text",text:"ก่อนวิเคราะห์ขั้นสูง ให้ฝึกอ่านสิ่งที่เห็นโดยไม่รีบพยากรณ์: ดู Timeframe → อ่าน OHLC/เส้นทางราคา → สังเกตว่า Directional หรือ Sideways → ดู Impulse/Pullback → สังเกต Volatility และ Pace"},
        {type:"example",label:"ตัวอย่างการบรรยาย",text:"‘บน M5 ราคาเคลื่อนขึ้นจาก 100 ไป 112 ค่อนข้างเร็ว จากนั้นถอยกลับมาที่ 107 และการแกว่งเริ่มแคบลง’ เป็นการบรรยาย Observation โดยยังไม่สรุปว่าจะ Buy หรือ Sell"}
      ], exercises:[
        {id:"hmm07-q1",type:"choice",question:"ข้อใดเป็น Observation ที่เหมาะสมที่สุดก่อนเริ่มตีความตลาด?",options:[{id:"a",text:"M5 ขึ้นจาก 100 → 112 แล้วถอย 107 และช่วงล่าสุดแกว่งแคบลง"},{id:"b",text:"ต้อง Buy ตอนนี้แน่นอน"},{id:"c",text:"ตลาดจะขึ้นอีก 100%"},{id:"d",text:"ราคาไม่มีทางลง"}],answer:"a",explanation:"ถูกต้อง — Observation บรรยายข้อมูลที่เห็นก่อน โดยยังไม่เปลี่ยนเป็น prediction หรือ trade decision",hint:"เลือกข้อความที่บอกว่า ‘เกิดอะไรขึ้น’ ไม่ใช่ ‘จะเกิดอะไรขึ้น’"},
        {id:"hmm07-q2",type:"choice",question:"ลำดับการสังเกตใดสอดคล้องกับบทนี้มากที่สุด?",options:[{id:"a",text:"ทำนายก่อน → ค่อยดูกราฟ"},{id:"b",text:"Timeframe → Price movement → Directional/Sideways → Impulse/Pullback → Volatility/Pace"},{id:"c",text:"เลือก Buy/Sell ก่อน → หาเหตุผลทีหลัง"},{id:"d",text:"ดู Candle เดียวแล้วจบ"}],answer:"b",explanation:"ถูกต้อง — เป้าหมายคือสร้างนิสัย Observe และ Describe ก่อนเข้าสู่การตีความ Context/Structure ใน Module ถัดไป",hint:"เริ่มจากข้อมูลพื้นฐาน แล้วค่อยประกอบภาพ"}
      ]},
      { id:"how-markets-move-08", order:8, type:"assessment", title:"Module Assessment", objective:"ตรวจความเข้าใจเรื่องการเคลื่อนไหวของราคา ก่อนเข้าสู่ Market Context", topics:["10 ข้อ","ผ่านเมื่อได้ตั้งแต่ 70%"], questions:[
        {id:"hmm-a01",question:"ข้อใดอธิบาย Price Movement ได้เหมาะสมที่สุด?",options:[{id:"a",text:"ราคาขึ้นเพราะมีผู้ซื้อมากกว่าผู้ขายในทุก transaction"},{id:"b",text:"ราคาอาจขยับเมื่อคำสั่งเชิงรุกใช้ liquidity ที่ระดับหนึ่งและการซื้อขายเกิดที่ระดับใหม่"},{id:"c",text:"ราคาไม่เกี่ยวกับ orders"},{id:"d",text:"ราคาขึ้นได้เมื่อไม่มี seller เท่านั้น"}],answer:"b",explanation:"ทุก transaction มี buyer และ seller แต่ order aggressiveness และ liquidity มีผลต่อระดับที่การซื้อขายเกิดขึ้น"},
        {id:"hmm-a02",question:"OHLC ตัว H หมายถึงอะไร?",options:[{id:"a",text:"ราคาเริ่มต้น"},{id:"b",text:"ราคาสูงสุดของช่วง"},{id:"c",text:"ราคาต่ำสุดของช่วง"},{id:"d",text:"ราคาปิด"}],answer:"b",explanation:"H = High หรือราคาสูงสุดที่เกิดขึ้นในช่วงของ Candle"},
        {id:"hmm-a03",question:"Close สูงกว่า Open บอกอะไรโดยตรง?",options:[{id:"a",text:"ช่วงนั้นจบที่ราคาสูงกว่าจุดเริ่มต้น"},{id:"b",text:"แท่งถัดไปต้องขึ้น"},{id:"c",text:"ต้อง Buy"},{id:"d",text:"ไม่มี seller"}],answer:"a",explanation:"OHLC บอกข้อมูลของช่วงที่เกิดขึ้นแล้ว ไม่รับประกันอนาคต"},
        {id:"hmm-a04",question:"เปลี่ยนจาก M1 ไป H1 คืออะไร?",options:[{id:"a",text:"เปลี่ยนสินทรัพย์"},{id:"b",text:"เปลี่ยนระดับการรวมข้อมูลตามเวลา"},{id:"c",text:"เปลี่ยนราคาจริง"},{id:"d",text:"ลบ volatility"}],answer:"b",explanation:"Timeframe คือระดับการรวมข้อมูลตามช่วงเวลา"},
        {id:"hmm-a05",question:"100 → 103 → 106 → 109 ใกล้เคียงพฤติกรรมใด?",options:[{id:"a",text:"Directional movement ขึ้น"},{id:"b",text:"Sideways"},{id:"c",text:"ไม่มี movement"},{id:"d",text:"OHLC ผิด"}],answer:"a",explanation:"ราคาในตัวอย่างขยายระดับขึ้นต่อเนื่อง"},
        {id:"hmm-a06",question:"100 → 103 → 99 → 102 → 100 และยังวนบริเวณเดิม ใกล้เคียงอะไร?",options:[{id:"a",text:"Directional ขึ้นชัดเจน"},{id:"b",text:"Sideways / Range"},{id:"c",text:"Directional ลงชัดเจน"},{id:"d",text:"Leverage"}],answer:"b",explanation:"ราคาแกว่งกลับไปกลับมาในพื้นที่เดิมมากกว่าขยายไปด้านใดด้านหนึ่ง"},
        {id:"hmm-a07",question:"100 → 112 แล้วถอยมา 107 อธิบายแบบพื้นฐานได้อย่างไร?",options:[{id:"a",text:"Impulse ขึ้น ตามด้วย Pullback"},{id:"b",text:"Sideways ตลอด"},{id:"c",text:"ไม่มี movement"},{id:"d",text:"Buy signal แน่นอน"}],answer:"a",explanation:"เป็นคำบรรยาย movement ไม่ใช่การรับประกัน continuation"},
        {id:"hmm-a08",question:"ข้อใดถูกต้องเกี่ยวกับ Pullback?",options:[{id:"a",text:"รับประกัน continuation"},{id:"b",text:"เป็นการย้อน/ชะลอจาก move ก่อนหน้า แต่ไม่ได้ยืนยันอนาคตด้วยตัวมันเอง"},{id:"c",text:"เกิดได้เฉพาะขาขึ้น"},{id:"d",text:"คือ Take Profit"}],answer:"b",explanation:"Pullback เป็นคำบรรยายพฤติกรรมที่เกิดขึ้น ไม่ใช่ prediction"},
        {id:"hmm-a09",question:"Volatility สูงบอกอะไรได้เหมาะสมที่สุด?",options:[{id:"a",text:"ต้อง Bullish"},{id:"b",text:"ต้อง Bearish"},{id:"c",text:"การเคลื่อนไหวมีขนาด/ความแปรปรวนมากขึ้น แต่ direction ต้องดูแยก"},{id:"d",text:"ไม่มี price movement"}],answer:"c",explanation:"Volatility บอก magnitude/variation ไม่ได้กำหนด direction เพียงอย่างเดียว"},
        {id:"hmm-a10",question:"ข้อใดเป็นวิธีเริ่มอ่าน Price Movement ที่เหมาะสมที่สุด?",options:[{id:"a",text:"เลือก Buy/Sell ก่อนแล้วหาเหตุผล"},{id:"b",text:"Observe และ Describe สิ่งที่เห็นก่อน แล้วค่อยเข้าสู่ Context/Structure"},{id:"c",text:"ทำนายจาก Candle เดียว"},{id:"d",text:"ไม่ต้องสนใจ Timeframe"}],answer:"b",explanation:"Module นี้สร้างนิสัยสังเกตและบรรยายสิ่งที่ราคาเพิ่งทำ ก่อนเข้าสู่การตีความขั้นต่อไป"}
      ]}
    ]
  }

  {

    lessons: [
      { id:"market-context-01", order:1, type:"lesson", title:"What Is Market Context?", objective:"เข้าใจว่า Context คือภาพรวมของสภาพตลาด ณ ตอนที่กำลังสังเกต ไม่ใช่คำทำนายว่าราคาจะไปไหนต่อ", topics:["Context","Current condition","Observation before decision"], content:[
        {type:"text",text:"Market Context คือการสรุปว่า ณ ตอนนี้ตลาดกำลังอยู่ในสภาพแบบใดจากข้อมูลที่เห็น เช่น เคลื่อนที่มีทิศทาง, แกว่งในกรอบ, หรือกำลังเปลี่ยนสภาพ จุดประสงค์คือให้เรารู้ว่าเรากำลังมองตลาดแบบไหนก่อนลงรายละเอียด"},
        {type:"example",label:"หลักคิด",text:"แทนที่จะเริ่มด้วยคำถามว่า ‘จะ Buy หรือ Sell?’ ให้เริ่มด้วย ‘ตอนนี้ตลาดกำลังทำอะไร?’ Context จึงเป็นคำอธิบายสภาพปัจจุบัน ไม่ใช่ prediction"}
      ], exercises:[
        {id:"mc01-q1",type:"choice",question:"คำถามใดเหมาะสมที่สุดสำหรับเริ่มอ่าน Market Context?",options:[{id:"a",text:"ตอนนี้ตลาดกำลังทำอะไร?"},{id:"b",text:"ราคาจะขึ้นอีกกี่จุดแน่นอน?"},{id:"c",text:"ควร All-in ฝั่งไหน?"},{id:"d",text:"แท่งถัดไปจะสีอะไร?"}],answer:"a",explanation:"ถูกต้อง — Context เริ่มจากการระบุสภาพตลาดที่กำลังเกิดขึ้นก่อน",hint:"Context = current condition ไม่ใช่ prediction"},
        {id:"mc01-q2",type:"choice",question:"ข้อใดเป็น Market Context มากกว่าการคาดการณ์?",options:[{id:"a",text:"ราคาจะขึ้นแน่นอน"},{id:"b",text:"ช่วงล่าสุดราคาแกว่งอยู่ในกรอบและยังไม่ขยายออกจากพื้นที่เดิม"},{id:"c",text:"ต้อง Buy ตอนนี้"},{id:"d",text:"พรุ่งนี้ต้องทำ New High"}],answer:"b",explanation:"ถูกต้อง — ข้อความนี้อธิบายสิ่งที่ตลาดกำลังแสดงอยู่โดยไม่รับประกันอนาคต",hint:"เลือกข้อความที่อธิบายสิ่งที่เห็นตอนนี้"}
      ]},
      { id:"market-context-02", order:2, type:"lesson", title:"Directional Context", objective:"ระบุ Context ที่ตลาดกำลังขยายราคาไปด้านหนึ่งได้ โดยยังไม่ใช้โครงสร้าง HH/HL หรือ LL/LH แบบเต็ม", topics:["Directional context","Expansion","Up / Down"], content:[
        {type:"text",text:"Directional Context คือช่วงที่การเคลื่อนไหวโดยรวมขยายไปด้านหนึ่งอย่างเห็นได้ชัด อาจเป็นขึ้นหรือลง เราดูภาพรวมของเส้นทางราคา ไม่ตัดสินจาก Candle เดียว"},
        {type:"example",label:"ตัวอย่าง",text:"ราคาเคลื่อน 100 → 106 → 103 → 111 → 107 → 116 แม้มีการถอยระหว่างทาง แต่ภาพรวมยังขยายขึ้นจากพื้นที่เดิม"}
      ], exercises:[
        {id:"mc02-q1",type:"choice",question:"ราคา 100 → 106 → 103 → 111 → 107 → 116 ให้ Context แบบง่ายใกล้เคียงข้อใด?",options:[{id:"a",text:"Directional ขึ้น"},{id:"b",text:"Range แคบอยู่ที่ 100"},{id:"c",text:"ไม่มี movement"},{id:"d",text:"Directional ลง"}],answer:"a",explanation:"ถูกต้อง — แม้มีการถอย แต่ภาพรวมขยายระดับราคาไปด้านบน",hint:"ดูภาพรวมหลายช่วง ไม่ใช่การถอยครั้งเดียว"},
        {id:"mc02-q2",type:"choice",question:"เหตุใดไม่ควรใช้ Candle เดียวตัดสิน Directional Context?",options:[{id:"a",text:"เพราะ Context ต้องดูพฤติกรรมโดยรวมมากกว่าช่วงเดียว"},{id:"b",text:"เพราะ Candle ไม่มีราคา"},{id:"c",text:"เพราะ Direction มีเฉพาะ H1"},{id:"d",text:"เพราะ Candle ใช้ได้เฉพาะ Forex"}],answer:"a",explanation:"ถูกต้อง — Context คือภาพรวมของพฤติกรรมในช่วงที่เรากำลังวิเคราะห์",hint:"Context = ภาพรวม"}
      ]},
      { id:"market-context-03", order:3, type:"lesson", title:"Range Context", objective:"ระบุสภาพตลาดที่ราคาแกว่งกลับไปกลับมาในพื้นที่เดิมได้ และเข้าใจว่ากรอบยังคงเป็น Context จนพฤติกรรมเปลี่ยน", topics:["Range","Boundaries","Rotation"], content:[
        {type:"text",text:"Range Context คือช่วงที่ราคาหมุนกลับไปกลับมาภายในพื้นที่โดยรวม ยังไม่มีการขยายไปด้านใดอย่างต่อเนื่อง เราสามารถมองขอบบนและขอบล่างเป็นพื้นที่อ้างอิงของกรอบได้"},
        {type:"example",label:"ตัวอย่าง",text:"ราคาเคลื่อนระหว่างประมาณ 98–104 หลายครั้ง เช่น 100 → 104 → 99 → 103 → 98 → 102 ภาพรวมยังอยู่ในพื้นที่เดิม"}
      ], exercises:[
        {id:"mc03-q1",type:"choice",question:"ราคาแกว่งระหว่าง 98–104 ซ้ำหลายรอบโดยยังไม่ขยายออกจากพื้นที่นี้ Context ใกล้เคียงอะไร?",options:[{id:"a",text:"Range"},{id:"b",text:"Directional ขึ้นชัดเจน"},{id:"c",text:"Directional ลงชัดเจน"},{id:"d",text:"ไม่มีราคา"}],answer:"a",explanation:"ถูกต้อง — ราคาเกิด rotation ภายในพื้นที่เดิมมากกว่าการขยายต่อเนื่องไปด้านหนึ่ง",hint:"ดูว่าราคาวนกลับเข้าพื้นที่เดิมหรือไม่"},
        {id:"mc03-q2",type:"choice",question:"สิ่งใดสำคัญในการอ่าน Range Context?",options:[{id:"a",text:"สังเกตพื้นที่ที่ราคาหมุนกลับไปกลับมาและขอบเขตโดยรวม"},{id:"b",text:"ทำนาย breakout จากแท่งเดียว"},{id:"c",text:"ถือว่าทุก Range ต้องขึ้น"},{id:"d",text:"ถือว่าทุก Range ต้องลง"}],answer:"a",explanation:"ถูกต้อง — ในขั้นนี้เราระบุพื้นที่และพฤติกรรมของกรอบก่อน ไม่รีบทำนายทางออก",hint:"Describe the range before predicting the break"}
      ]},
      { id:"market-context-04", order:4, type:"lesson", title:"Transition Context", objective:"สังเกตช่วงที่ Context เดิมเริ่มไม่ชัดและตลาดอาจกำลังเปลี่ยนจากสภาพหนึ่งไปอีกสภาพหนึ่ง โดยไม่รีบประกาศ Context ใหม่ก่อนมีข้อมูลพอ", topics:["Transition","Loss of clarity","Wait for evidence"], content:[
        {type:"text",text:"ตลาดไม่ได้สลับจาก Trend เป็น Range หรือจาก Range เป็น Trend แบบชัดเจนในทันทีเสมอ ช่วง Transition คือช่วงที่พฤติกรรมเดิมเริ่มเสียความชัด แต่ข้อมูลใหม่ยังไม่พอให้สรุป Context ใหม่"},
        {type:"example",label:"ตัวอย่าง",text:"ตลาดเคยขยายขึ้นต่อเนื่อง แต่ช่วงล่าสุดเริ่มเดินหน้าได้น้อยลง ถอยลึกขึ้น และหมุนกลับในพื้นที่เดิมมากขึ้น เราสามารถบอกว่า Context เดิมกำลังเสียความชัด โดยยังไม่ต้องรีบเรียกว่าเป็นขาลง"}
      ], exercises:[
        {id:"mc04-q1",type:"choice",question:"ตลาดเคย Directional ขึ้น แต่ล่าสุดเดินหน้าได้น้อยลงและเริ่มแกว่งทับพื้นที่เดิมมากขึ้น วิธีอธิบายที่ระมัดระวังที่สุดคืออะไร?",options:[{id:"a",text:"Context เดิมเริ่มเสียความชัด อาจอยู่ในช่วง Transition"},{id:"b",text:"ต้องเป็นขาลงแน่นอน"},{id:"c",text:"ต้อง Buy เพิ่ม"},{id:"d",text:"ไม่มีข้อมูลใดเปลี่ยน"}],answer:"a",explanation:"ถูกต้อง — Transition ช่วยให้เราไม่บังคับตลาดให้เป็น Trend หรือ Range ก่อนมีหลักฐานเพียงพอ",hint:"ความไม่ชัดเจนก็เป็นข้อมูลชนิดหนึ่ง"},
        {id:"mc04-q2",type:"choice",question:"ในช่วง Transition สิ่งใดเหมาะสมที่สุด?",options:[{id:"a",text:"รอข้อมูลเพิ่มและอัปเดต Context ตามพฤติกรรมใหม่"},{id:"b",text:"ยึด Context เดิมตลอดไป"},{id:"c",text:"ทำนาย Context ใหม่ทันทีจากแท่งเดียว"},{id:"d",text:"เพิ่ม Leverage เพื่อชดเชยความไม่ชัด"}],answer:"a",explanation:"ถูกต้อง — Context เป็นสิ่งที่ต้องอัปเดตเมื่อพฤติกรรมตลาดเปลี่ยน",hint:"React to evidence"}
      ]},
      { id:"market-context-05", order:5, type:"lesson", title:"Context Across Timeframes", objective:"เข้าใจว่า Context สามารถแตกต่างกันตาม Timeframe และไม่จำเป็นต้องบังคับให้ทุก Timeframe ให้คำตอบเดียวกัน", topics:["Multi-timeframe observation","Zoom","Context conflict"], content:[
        {type:"text",text:"ข้อมูลราคาเดียวกันสามารถดูต่างกันเมื่อเปลี่ยน Timeframe เช่น H1 อาจยังเห็นการขยายขึ้นโดยรวม ขณะที่ M5 กำลัง Pullback ลง การเห็น Context ต่างกันไม่ใช่ความผิดพลาด แต่เป็นผลจากระดับการมองที่ต่างกัน"},
        {type:"example",label:"ตัวอย่าง",text:"H1: ภาพรวมยังขยายขึ้น / M5: ช่วงล่าสุดกำลังเคลื่อนลงภายใน Pullback ทั้งสองคำอธิบายสามารถถูกต้องพร้อมกันได้ เพราะกำลังพูดถึงคนละระดับของการเคลื่อนไหว"}
      ], exercises:[
        {id:"mc05-q1",type:"choice",question:"H1 ดู Directional ขึ้น แต่ M5 ช่วงล่าสุดกำลังลง ข้อใดถูกต้องที่สุด?",options:[{id:"a",text:"ทั้งสอง Context สามารถเกิดพร้อมกันได้เพราะ Timeframe มองคนละระดับ"},{id:"b",text:"กราฟต้องมีข้อมูลผิด"},{id:"c",text:"H1 ถูกเสมอและ M5 ไม่มีความหมาย"},{id:"d",text:"M5 ถูกเสมอและ H1 ไม่มีความหมาย"}],answer:"a",explanation:"ถูกต้อง — Timeframe ต่างกันสามารถแสดง context คนละระดับของ movement เดียวกัน",hint:"คิดแบบ zoom in / zoom out"},
        {id:"mc05-q2",type:"choice",question:"เมื่อ Context หลาย Timeframe ไม่เหมือนกัน สิ่งใดควรหลีกเลี่ยง?",options:[{id:"a",text:"บังคับให้ทุก Timeframe ต้องมีคำตอบเดียวกัน"},{id:"b",text:"ระบุ Timeframe ที่กำลังพูดถึง"},{id:"c",text:"อธิบายสิ่งที่เห็นในแต่ละระดับ"},{id:"d",text:"แยกภาพใหญ่กับ movement ระยะสั้น"}],answer:"a",explanation:"ถูกต้อง — การระบุ Timeframe ทำให้คำว่า Context มีความหมายชัดเจนขึ้น",hint:"Different scale, different observation"}
      ]},
      { id:"market-context-06", order:6, type:"lesson", title:"Context Is Dynamic", objective:"เข้าใจว่า Context ไม่ใช่ label ถาวร และต้องอัปเดตเมื่อข้อมูลใหม่ทำให้คำอธิบายเดิมไม่เหมาะสม", topics:["Dynamic context","Update","Evidence"], content:[
        {type:"text",text:"Context คือ working description ของตลาด ณ ตอนนั้น ไม่ใช่ป้ายที่ติดถาวร หากราคาเริ่มแสดงพฤติกรรมที่ไม่สอดคล้องกับคำอธิบายเดิม เราต้องยอมอัปเดตมุมมอง"},
        {type:"example",label:"หลักคิด",text:"เราไม่พูดว่า ‘วันนี้เป็นขาขึ้นแล้วต้องขึ้นทั้งวัน’ แต่พูดว่า ‘ตอนนี้ Context ยังเป็น directional up ตราบใดที่พฤติกรรมที่เห็นยังสนับสนุนคำอธิบายนี้’"}
      ], exercises:[
        {id:"mc06-q1",type:"choice",question:"ข้อใดสอดคล้องกับแนวคิด Context Is Dynamic?",options:[{id:"a",text:"เมื่อข้อมูลใหม่ขัดกับ Context เดิม เราควรประเมินและอัปเดตคำอธิบาย"},{id:"b",text:"Context แรกของวันห้ามเปลี่ยน"},{id:"c",text:"เลือก Bias แล้วห้ามดูข้อมูลใหม่"},{id:"d",text:"Context คือ prediction ที่ต้องถูกเสมอ"}],answer:"a",explanation:"ถูกต้อง — Context ต้องตามพฤติกรรมตลาด ไม่ใช่ให้ตลาดตามความคิดของเรา",hint:"Current behavior first"},
        {id:"mc06-q2",type:"choice",question:"ประโยคใดเหมาะสมกว่า?",options:[{id:"a",text:"ตลาดเป็นขาขึ้นแล้ว จึงไม่มีทางลง"},{id:"b",text:"ตอนนี้ภาพรวมยังขยายขึ้น แต่จะประเมินใหม่หากพฤติกรรมเปลี่ยน"},{id:"c",text:"Context ไม่ต้องอัปเดต"},{id:"d",text:"Candle แรกกำหนดทั้งวัน"}],answer:"b",explanation:"ถูกต้อง — เป็นคำอธิบายปัจจุบันที่เปิดรับข้อมูลใหม่",hint:"Avoid absolute predictions"}
      ]},
      { id:"market-context-07", order:7, type:"lesson", title:"Context Reading Process", objective:"ใช้กระบวนการสั้น ๆ เพื่อระบุ Market Context จากสิ่งที่เห็น ก่อนเข้าสู่ Market Structure ใน Module ถัดไป", topics:["Observe","Classify","Evidence","Update"], content:[
        {type:"text",text:"กระบวนการอ่าน Context แบบพื้นฐาน: 1) ระบุ Timeframe 2) Observe เส้นทางราคา 3) ถามว่ากำลังขยายไปด้านหนึ่งหรือหมุนในพื้นที่เดิม 4) ถ้าพฤติกรรมไม่ชัด ให้ยอมรับว่าอาจเป็น Transition 5) สรุป Context จากหลักฐานที่เห็น 6) พร้อมอัปเดตเมื่อข้อมูลเปลี่ยน"},
        {type:"example",label:"ตัวอย่างการสรุป",text:"‘บน M15 ราคาเคยขยายขึ้น แต่ช่วงล่าสุดเริ่มหมุนทับพื้นที่เดิมและเดินหน้าช้าลง ดังนั้น directional-up context กำลังเสียความชัด และผมจะรอข้อมูลเพิ่มก่อนจัดเป็น context ใหม่’"}
      ], exercises:[
        {id:"mc07-q1",type:"choice",question:"ลำดับใดเหมาะสมที่สุดในการอ่าน Context?",options:[{id:"a",text:"Timeframe → Observe → Directional/Range/Transition → Evidence → Update"},{id:"b",text:"Buy/Sell → หาเหตุผล → เลือก Timeframe"},{id:"c",text:"Prediction → Ignore new data"},{id:"d",text:"ดู Candle เดียว → สรุปถาวร"}],answer:"a",explanation:"ถูกต้อง — Context เริ่มจากการสังเกตและจัดสภาพตลาดจากหลักฐานปัจจุบัน",hint:"Observe before classify"},
        {id:"mc07-q2",type:"choice",question:"ถ้ายังแยกไม่ได้ชัดว่าเป็น Directional หรือ Range ควรทำอย่างไร?",options:[{id:"a",text:"ยอมรับว่า Context ยังไม่ชัด/อาจเป็น Transition และรอข้อมูลเพิ่ม"},{id:"b",text:"สุ่มเลือกหนึ่งคำตอบ"},{id:"c",text:"เพิ่ม Position Size"},{id:"d",text:"บังคับให้เป็น Trend เสมอ"}],answer:"a",explanation:"ถูกต้อง — การยอมรับ uncertainty ดีกว่าการสร้างความมั่นใจที่ข้อมูลยังไม่รองรับ",hint:"No clear context is itself useful information"}
      ]},
      { id:"market-context-08", order:8, type:"assessment", title:"Module Assessment", objective:"ตรวจว่าผู้เรียนสามารถระบุและอัปเดต Market Context จากพฤติกรรมราคาได้ ก่อนเข้าสู่ Market Structure", topics:["10 ข้อ","ผ่านเมื่อได้ตั้งแต่ 70%"], questions:[
        {id:"mc-a01",question:"Market Context มีหน้าที่หลักอะไร?",options:[{id:"a",text:"อธิบายสภาพตลาดปัจจุบันจากข้อมูลที่เห็น"},{id:"b",text:"รับประกันราคาถัดไป"},{id:"c",text:"เลือก Lot Size"},{id:"d",text:"กำหนดกำไรแน่นอน"}],answer:"a",explanation:"Context คือคำอธิบาย current condition ไม่ใช่ prediction"},
        {id:"mc-a02",question:"100 → 106 → 103 → 111 → 107 → 116 ใกล้เคียง Context ใด?",options:[{id:"a",text:"Directional ขึ้น"},{id:"b",text:"Range แคบ"},{id:"c",text:"Directional ลง"},{id:"d",text:"ไม่มี movement"}],answer:"a",explanation:"ภาพรวมขยายระดับราคาไปด้านบนแม้มีการถอยระหว่างทาง"},
        {id:"mc-a03",question:"ราคาแกว่งซ้ำระหว่าง 98–104 โดยยังไม่ขยายออกจากพื้นที่เดิม ใกล้เคียงอะไร?",options:[{id:"a",text:"Range"},{id:"b",text:"Directional ขึ้นชัดเจน"},{id:"c",text:"Directional ลงชัดเจน"},{id:"d",text:"ไม่มี Context"}],answer:"a",explanation:"ราคาเกิด rotation ในพื้นที่เดิม"},
        {id:"mc-a04",question:"Trend เดิมเริ่มเดินหน้าได้น้อยลงและราคาเริ่มทับพื้นที่เดิมมากขึ้น คำอธิบายใดระมัดระวังที่สุด?",options:[{id:"a",text:"อาจอยู่ใน Transition และ Context เดิมกำลังเสียความชัด"},{id:"b",text:"กลับทิศแน่นอน"},{id:"c",text:"ต้องเข้าเทรดทันที"},{id:"d",text:"ไม่มีอะไรเปลี่ยน"}],answer:"a",explanation:"Transition ใช้อธิบายช่วงที่สภาพเดิมเริ่มไม่ชัดแต่สภาพใหม่ยังไม่ยืนยัน"},
        {id:"mc-a05",question:"H1 ขยายขึ้น แต่ M5 กำลัง Pullback ลง ข้อใดถูกต้อง?",options:[{id:"a",text:"ทั้งสองคำอธิบายสามารถถูกต้องพร้อมกันได้ในคนละ Timeframe"},{id:"b",text:"ข้อมูลต้องผิด"},{id:"c",text:"M5 ไม่มีราคา"},{id:"d",text:"H1 ไม่มีราคา"}],answer:"a",explanation:"Timeframe ต่างกันมองคนละระดับของ movement เดียวกัน"},
        {id:"mc-a06",question:"Context ควรเปลี่ยนเมื่อใด?",options:[{id:"a",text:"เมื่อข้อมูลใหม่ทำให้คำอธิบายเดิมไม่เหมาะสม"},{id:"b",text:"ห้ามเปลี่ยนหลังเลือกครั้งแรก"},{id:"c",text:"ทุก Candle โดยไม่ดูภาพรวม"},{id:"d",text:"เมื่อรู้สึกอยากเปลี่ยนโดยไม่ต้องมีข้อมูล"}],answer:"a",explanation:"Context เป็น working description ที่ต้องอัปเดตตาม evidence"},
        {id:"mc-a07",question:"ข้อใดเป็น Context statement ที่ดีกว่า?",options:[{id:"a",text:"ตอนนี้ M15 ยังขยายขึ้น แต่จะประเมินใหม่หากพฤติกรรมเปลี่ยน"},{id:"b",text:"ราคาต้องขึ้นตลอดวัน"},{id:"c",text:"Buy แน่นอน"},{id:"d",text:"ตลาดไม่มีทางเปลี่ยน"}],answer:"a",explanation:"เป็นคำอธิบายปัจจุบันที่ไม่เปลี่ยน observation เป็น prediction"},
        {id:"mc-a08",question:"ถ้ายังไม่ชัดว่าเป็น Directional หรือ Range ควรทำอย่างไร?",options:[{id:"a",text:"ยอมรับความไม่ชัด/Transition และรอข้อมูลเพิ่ม"},{id:"b",text:"สุ่มเลือก Trend"},{id:"c",text:"เพิ่ม Leverage"},{id:"d",text:"เลือกจาก Candle ล่าสุดเท่านั้น"}],answer:"a",explanation:"Uncertainty เป็นข้อมูล และไม่จำเป็นต้องบังคับ classification"},
        {id:"mc-a09",question:"สิ่งใดควรทำก่อนสรุป Context?",options:[{id:"a",text:"ระบุ Timeframe และ Observe เส้นทางราคา"},{id:"b",text:"เลือก Entry ก่อน"},{id:"c",text:"เลือก Stop Loss ก่อนดูกราฟ"},{id:"d",text:"ทำนายแท่งถัดไป"}],answer:"a",explanation:"Context ต้องมีกรอบเวลาและ evidence ที่กำลังสังเกต"},
        {id:"mc-a10",question:"ลำดับใดสอดคล้องกับ Module นี้มากที่สุด?",options:[{id:"a",text:"Observe → Classify Context → Check Evidence → Update when behavior changes"},{id:"b",text:"Predict → Commit → Ignore evidence"},{id:"c",text:"Buy/Sell → Find reasons"},{id:"d",text:"One candle → Permanent bias"}],answer:"a",explanation:"เป้าหมายคืออ่าน current context แบบ dynamic ก่อนเข้าสู่ Market Structure"}
      ]}
    ]

      { id:"market-structure-01", order:1, type:"lesson", title:"Swing High & Swing Low", objective:"เข้าใจ Swing High / Swing Low ในฐานะจุดหมุนของราคา และเริ่มแยกจุดที่มีความหมายออกจากการแกว่งทุกแท่ง", topics:["Swing High","Swing Low","Price turns"], content:[
        {type:"text",text:"Market Structure เริ่มจากการมองจุดที่ราคาหมุนตัว ไม่ใช่การติดป้ายทุก Candle เป็น High หรือ Low. Swing High คือบริเวณยอดที่ราคาขึ้นไปแล้วเกิดการหมุนลง ส่วน Swing Low คือบริเวณฐานที่ราคาลงไปแล้วเกิดการหมุนขึ้น"},
        {type:"example",label:"ตัวอย่าง",text:"เส้นทาง 100 → 108 → 103: บริเวณ 108 เป็น Swing High ที่มองเห็นได้ เพราะราคาขึ้นไปถึงจุดนั้นแล้วหมุนลง. เส้นทาง 108 → 101 → 106: บริเวณ 101 เป็น Swing Low"}
      ], exercises:[
        {id:"ms01-q1",type:"choice",question:"ราคา 100 → 108 → 103 จุด 108 อธิบายได้เหมาะสมที่สุดว่าอะไร?",options:[{id:"a",text:"Swing High"},{id:"b",text:"Swing Low"},{id:"c",text:"Spread"},{id:"d",text:"Margin"}],answer:"a",explanation:"ถูกต้อง — ราคาเดินขึ้นถึง 108 แล้วหมุนลง จึงเป็นยอดหรือ Swing High ในตัวอย่าง",hint:"มองหาจุดที่ราคาเปลี่ยนจากขึ้นเป็นลง"},
        {id:"ms01-q2",type:"choice",question:"ข้อใดสำคัญกว่าในการเริ่มอ่าน Structure?",options:[{id:"a",text:"ติดป้ายทุก Candle เป็น swing"},{id:"b",text:"มองจุดหมุนที่ช่วยอธิบายเส้นทางราคาชัดเจน"},{id:"c",text:"ทำนายแท่งถัดไป"},{id:"d",text:"เลือก Entry ก่อน"}],answer:"b",explanation:"ถูกต้อง — เป้าหมายคืออ่านโครงสร้างจากจุดหมุนที่มีความหมาย ไม่ใช่เพิ่ม noise ด้วยการติดป้ายทุกการแกว่ง",hint:"Structure ต้องช่วยลด noise"}
      ]},
      { id:"market-structure-02", order:2, type:"lesson", title:"HH / HL", objective:"เข้าใจโครงสร้างขาขึ้นพื้นฐานจาก Higher High และ Higher Low โดยอ่านจากลำดับ swing ที่เกิดขึ้นแล้ว", topics:["Higher High","Higher Low","Bullish structure"], content:[
        {type:"text",text:"Higher High (HH) คือ Swing High ใหม่ที่สูงกว่า Swing High ก่อนหน้า. Higher Low (HL) คือ Swing Low ใหม่ที่สูงกว่า Swing Low ก่อนหน้า. เมื่อลำดับ swing สำคัญยังยกตัวขึ้น เราสามารถอธิบาย Structure ว่าเป็นโครงสร้างขาขึ้น ณ ข้อมูลที่เห็น"},
        {type:"example",label:"ตัวอย่าง",text:"Low 100 → High 110 → Low 105 → High 116. Low 105 สูงกว่า 100 = HL และ High 116 สูงกว่า 110 = HH. นี่คือคำอธิบาย structure ไม่ใช่คำรับประกันว่า swing ถัดไปต้องสูงขึ้น"}
      ], exercises:[
        {id:"ms02-q1",type:"choice",question:"Low 100 → High 110 → Low 105 → High 116 ลำดับนี้ใกล้เคียง Structure ใด?",options:[{id:"a",text:"HH / HL — โครงสร้างขาขึ้น"},{id:"b",text:"LL / LH — โครงสร้างขาลง"},{id:"c",text:"ไม่มี Swing"},{id:"d",text:"Spread ขยาย"}],answer:"a",explanation:"ถูกต้อง — Low ยกสูงขึ้นและ High ใหม่สูงกว่า High ก่อนหน้า",hint:"เปรียบเทียบ High กับ High และ Low กับ Low"},
        {id:"ms02-q2",type:"choice",question:"HH / HL บอกอะไรได้เหมาะสมที่สุด?",options:[{id:"a",text:"ลำดับ swing ที่เกิดขึ้นกำลังยกตัวขึ้น"},{id:"b",text:"ราคาจะขึ้นตลอดไป"},{id:"c",text:"ต้อง Buy ทันที"},{id:"d",text:"ไม่มีโอกาสเกิด Pullback"}],answer:"a",explanation:"ถูกต้อง — Structure เป็นการอ่านสิ่งที่ตลาดสร้างแล้ว ไม่ใช่ prediction หรือ Entry signal ด้วยตัวมันเอง",hint:"Describe first, predict less"}
      ]},
      { id:"market-structure-03", order:3, type:"lesson", title:"LL / LH", objective:"เข้าใจโครงสร้างขาลงพื้นฐานจาก Lower Low และ Lower High", topics:["Lower Low","Lower High","Bearish structure"], content:[
        {type:"text",text:"Lower Low (LL) คือ Swing Low ใหม่ที่ต่ำกว่า Swing Low ก่อนหน้า. Lower High (LH) คือ Swing High ใหม่ที่ต่ำกว่า Swing High ก่อนหน้า. เมื่อลำดับ swing สำคัญลดระดับลง เราสามารถอธิบาย Structure ว่าเป็นโครงสร้างขาลง ณ ตอนนั้น"},
        {type:"example",label:"ตัวอย่าง",text:"High 120 → Low 110 → High 116 → Low 104. High 116 ต่ำกว่า 120 = LH และ Low 104 ต่ำกว่า 110 = LL"}
      ], exercises:[
        {id:"ms03-q1",type:"choice",question:"High 120 → Low 110 → High 116 → Low 104 ลำดับนี้ใกล้เคียงอะไร?",options:[{id:"a",text:"LL / LH — โครงสร้างขาลง"},{id:"b",text:"HH / HL — โครงสร้างขาขึ้น"},{id:"c",text:"ไม่มีราคาเคลื่อน"},{id:"d",text:"Leverage"}],answer:"a",explanation:"ถูกต้อง — High ใหม่ต่ำลงและ Low ใหม่ต่ำลง",hint:"ดูว่าจุดยอดและจุดฐานกำลังลดระดับหรือไม่"},
        {id:"ms03-q2",type:"choice",question:"Lower High หมายถึงอะไร?",options:[{id:"a",text:"Swing High ใหม่ต่ำกว่า Swing High ก่อนหน้า"},{id:"b",text:"Swing Low ใหม่สูงกว่าเดิม"},{id:"c",text:"ราคาปิดต่ำกว่า Open ทุกแท่ง"},{id:"d",text:"ต้อง Sell"}],answer:"a",explanation:"ถูกต้อง — LH เป็นการเปรียบเทียบ swing high สองจุด ไม่ใช่คำสั่ง Sell",hint:"High เทียบกับ High"}
      ]},
      { id:"market-structure-04", order:4, type:"lesson", title:"Internal vs Important Swing", objective:"เริ่มแยกการแกว่งย่อยภายใน movement ออกจาก Swing สำคัญที่กำหนดภาพ Structure เพื่อลด noise", topics:["Internal swing","Important swing","Noise filtering"], content:[
        {type:"text",text:"กราฟมีการแกว่งหลายระดับ. Internal Swing คือการหมุนย่อยที่เกิดอยู่ภายใน movement ใหญ่กว่า ส่วน Important Swing คือจุดหมุนที่มีบทบาทชัดในการอธิบายโครงสร้างที่เรากำลังติดตาม. คำว่า important ขึ้นกับ Timeframe และระดับของ structure ที่กำลังอ่าน"},
        {type:"example",label:"หลักคิด",text:"ถ้าราคาขึ้นจาก 100 ไป 120 แต่ระหว่างทางมี 103→102, 108→106, 114→112 การแกว่งย่อยเหล่านี้ไม่จำเป็นต้องเปลี่ยนภาพ Structure หลักทุกครั้ง. ให้ถามว่า swing ใดเป็นจุดอ้างอิงของ move ที่เรากำลังอ่าน"}
      ], exercises:[
        {id:"ms04-q1",type:"choice",question:"ทำไมไม่ควรใช้ทุกการแกว่งเล็กเป็น Swing สำคัญเท่ากันทั้งหมด?",options:[{id:"a",text:"เพราะจะเพิ่ม noise และทำให้ Structure เปลี่ยนตามการแกว่งย่อยมากเกินไป"},{id:"b",text:"เพราะราคาไม่มี swing ย่อย"},{id:"c",text:"เพราะ Candle เล็กไม่มีราคา"},{id:"d",text:"เพราะ Important Swing มีเพียงวันละหนึ่งจุดเสมอ"}],answer:"a",explanation:"ถูกต้อง — การแยกระดับ swing ช่วยให้ Structure สะท้อน movement ที่เรากำลังวิเคราะห์แทนที่จะตอบสนองต่อ noise ทุกจุด",hint:"เป้าหมายคือกรอง noise"},
        {id:"ms04-q2",type:"choice",question:"Important Swing ควรถูกมองอย่างไร?",options:[{id:"a",text:"สัมพันธ์กับ Timeframe และระดับ Structure ที่กำลังติดตาม"},{id:"b",text:"เป็นจุดเดียวกันทุก Timeframe เสมอ"},{id:"c",text:"เลือกจากสี Candle"},{id:"d",text:"คือ Entry point เสมอ"}],answer:"a",explanation:"ถูกต้อง — เมื่อ zoom ต่างกัน ระดับของ swing ที่มีความหมายต่อ structure ก็อาจต่างกัน",hint:"Structure has scale"}
      ]},
      { id:"market-structure-05", order:5, type:"lesson", title:"Structure Continuation", objective:"เข้าใจการต่อเนื่องของ Structure เมื่อราคาสร้าง swing ใหม่ไปในทิศทางเดิม โดยไม่เปลี่ยน continuation เป็นคำรับประกันอนาคต", topics:["Continuation","New structural extreme","Follow-through"], content:[
        {type:"text",text:"Structure Continuation คือการที่ลำดับ swing สำคัญยังสร้างความคืบหน้าไปในทิศทางเดิม เช่น bullish structure สร้าง HH ใหม่หลังจาก HL หรือ bearish structure สร้าง LL ใหม่หลังจาก LH. เรากำลังยืนยันสิ่งที่เกิดขึ้นแล้ว ไม่ได้บอกว่า continuation ครั้งต่อไปจะต้องเกิด"},
        {type:"example",label:"ตัวอย่าง",text:"100 Low → 110 High → 105 HL → 116 HH. การสร้าง 116 เหนือ 110 แสดง follow-through ของ bullish structure ในข้อมูลชุดนี้"}
      ], exercises:[
        {id:"ms05-q1",type:"choice",question:"ใน bullish structure หลังเกิด HL แล้วราคาสร้าง High ใหม่เหนือ High ก่อนหน้า สิ่งนี้อธิบายได้อย่างไร?",options:[{id:"a",text:"Structure แสดง continuation / follow-through ขึ้น"},{id:"b",text:"ยืนยันว่าราคาจะขึ้นตลอดไป"},{id:"c",text:"Structure กลายเป็น bearish ทันที"},{id:"d",text:"ไม่มีข้อมูลใหม่"}],answer:"a",explanation:"ถูกต้อง — การสร้าง structural high ใหม่เป็น evidence ของ continuation ที่เกิดขึ้นแล้ว",hint:"มองสิ่งที่ swing ใหม่ยืนยัน"},
        {id:"ms05-q2",type:"choice",question:"ข้อใดถูกต้องเกี่ยวกับ Structure Continuation?",options:[{id:"a",text:"เป็น evidence ของทิศทางเดิม ณ ตอนนั้น แต่ไม่รับประกัน swing ถัดไป"},{id:"b",text:"เป็นคำสั่งเข้าเทรดทุกครั้ง"},{id:"c",text:"รับประกัน trend ตลอดวัน"},{id:"d",text:"เกิดจาก Candle เดียวเสมอ"}],answer:"a",explanation:"ถูกต้อง — เราใช้ Structure เพื่ออ่าน behavior ไม่ใช่เปลี่ยนมันเป็น certainty",hint:"Evidence, not guarantee"}
      ]},
      { id:"market-structure-06", order:6, type:"lesson", title:"Structure Shift", objective:"เข้าใจว่า Structure เดิมสามารถเสียความต่อเนื่องและเริ่มเปลี่ยนได้ โดยต้องดู swing ที่มีความหมายและ follow-through มากกว่าตัดสินจากการแกว่งย่อยจุดเดียว", topics:["Structure shift","Loss of continuation","Confirmation"], content:[
        {type:"text",text:"Structure Shift เริ่มน่าสนใจเมื่อพฤติกรรมไม่สามารถรักษาลำดับเดิมและเกิดการเคลื่อนผ่าน swing สำคัญที่เคยรองรับ structure นั้น. อย่างไรก็ตาม การหลุด internal swing เล็ก ๆ ไม่ควรถูกตีความเป็นการกลับโครงสร้างหลักโดยอัตโนมัติ"},
        {type:"example",label:"ตัวอย่างแนวคิด",text:"ถ้า bullish structure เคยสร้าง HH/HL ต่อเนื่อง แต่ภายหลังไม่สามารถสร้าง HH ใหม่และราคาลงผ่าน Important HL จากนั้นมี follow-through ลง เรามีหลักฐานมากขึ้นว่า structure เดิมกำลังเปลี่ยน. ใน Module นี้ใช้คำว่า Structure Shift; คำศัพท์เฉพาะอย่าง BOS/CHoCH จะค่อยเชื่อมในขั้นที่เหมาะสม"}
      ], exercises:[
        {id:"ms06-q1",type:"choice",question:"อะไรเป็นหลักฐานของ Structure Shift ที่มีน้ำหนักมากกว่ากัน?",options:[{id:"a",text:"ราคาผ่าน Important Swing ของ structure เดิมและมี follow-through"},{id:"b",text:"มี Candle เล็กสีตรงข้ามหนึ่งแท่ง"},{id:"c",text:"Internal wiggle เล็ก ๆ ทุกครั้ง"},{id:"d",text:"ความรู้สึกว่าราคาน่าจะกลับ"}],answer:"a",explanation:"ถูกต้อง — จุดอ้างอิงต้องสัมพันธ์กับ structure ที่กำลังติดตาม และ follow-through ช่วยเพิ่มบริบทว่าการเปลี่ยนไม่ได้เป็นเพียง noise",hint:"Important swing + behavior after it"},
        {id:"ms06-q2",type:"choice",question:"ถ้า bullish structure มีการหลุด Swing ย่อยเล็ก ๆ ภายใน Pullback ควรสรุปทันทีหรือไม่ว่า Structure หลักกลับเป็น bearish?",options:[{id:"a",text:"ไม่ควร ต้องดูระดับของ swing และ behavior ต่อจากนั้น"},{id:"b",text:"ควร ทุก swing ย่อยเปลี่ยน structure หลักทันที"},{id:"c",text:"ควร เพราะ Pullback = reversal"},{id:"d",text:"ไม่มี swing ใน Pullback"}],answer:"a",explanation:"ถูกต้อง — การแยก Internal กับ Important Swing ป้องกันการตีความ noise เป็น structural shift",hint:"กลับไปคิดเรื่องระดับของ swing"}
      ]},
      { id:"market-structure-07", order:7, type:"lesson", title:"Structure Reading Process", objective:"รวม Context และ Structure เป็นกระบวนการอ่านกราฟที่เป็นระบบ ก่อนเข้าสู่ Location ใน Module ถัดไป", topics:["Context → Structure","Map swings","Continuation / Shift","Update"], content:[
        {type:"text",text:"กระบวนการพื้นฐาน: 1) ระบุ Timeframe และ Context 2) ทำเครื่องหมาย Swing High/Low ที่มีความหมาย 3) เปรียบเทียบ High กับ High และ Low กับ Low 4) แยก Internal กับ Important Swing 5) ถามว่า Structure กำลัง Continue, เสียความชัด หรือ Shift 6) อัปเดตเมื่อมี swing ใหม่ยืนยันข้อมูล"},
        {type:"example",label:"ตัวอย่างการอ่าน",text:"‘M5 Context ก่อนหน้าเป็น directional up. Swing สำคัญแสดง HL และ HH. Pullback ล่าสุดมี internal lows หลายจุดแต่ยังไม่ทำลาย Important HL ดังนั้น structure หลักยังไม่ถูกยืนยันว่า shift; จะอ่านข้อมูลใหม่เมื่อเกิดการเปลี่ยนที่ swing สำคัญ’"}
      ], exercises:[
        {id:"ms07-q1",type:"choice",question:"ลำดับใดเหมาะสมที่สุดในการอ่าน Market Structure?",options:[{id:"a",text:"Context/Timeframe → Map important swings → Compare highs/lows → Continuation or Shift → Update"},{id:"b",text:"Entry → Prediction → หา swing สนับสนุน"},{id:"c",text:"Candle ล่าสุด → สรุปถาวร"},{id:"d",text:"เลือก HH/HL โดยไม่ดู Timeframe"}],answer:"a",explanation:"ถูกต้อง — Structure เป็นส่วนต่อจาก Context และต้องมีระดับการมองที่ชัด",hint:"Context → Structure"},
        {id:"ms07-q2",type:"choice",question:"หลังอ่าน Structure แล้ว ขั้นถัดไปของ Framework เราควรถามอะไร?",options:[{id:"a",text:"ราคาอยู่ที่ไหน — Location"},{id:"b",text:"จะ All-in ฝั่งไหน"},{id:"c",text:"กำไรแน่นอนเท่าไร"},{id:"d",text:"ข้ามไป Entry ทันที"}],answer:"a",explanation:"ถูกต้อง — Framework ของโปรแกรมเดินจาก Context → Structure → Location เพื่อค่อย ๆ เพิ่มข้อมูลก่อนสร้างแผน",hint:"จำ Framework หลักของโปรแกรม"}
      ]},
      { id:"market-structure-08", order:8, type:"assessment", title:"Module Assessment", objective:"ตรวจว่าผู้เรียนสามารถอ่าน swing และลำดับ Market Structure ได้ ก่อนเข้าสู่ Location", topics:["10 ข้อ","ผ่านเมื่อได้ตั้งแต่ 70%"], questions:[
        {id:"ms-a01",question:"ราคา 100 → 108 → 103 จุด 108 คืออะไรในตัวอย่าง?",options:[{id:"a",text:"Swing High"},{id:"b",text:"Swing Low"},{id:"c",text:"Margin"},{id:"d",text:"Spread"}],answer:"a",explanation:"ราคาเดินขึ้นถึง 108 แล้วหมุนลง จึงเป็น Swing High"},
        {id:"ms-a02",question:"Higher High หมายถึงอะไร?",options:[{id:"a",text:"Swing High ใหม่สูงกว่า Swing High ก่อนหน้า"},{id:"b",text:"Swing Low ใหม่ต่ำกว่าเดิม"},{id:"c",text:"Close สูงกว่า Open"},{id:"d",text:"ต้อง Buy"}],answer:"a",explanation:"HH เปรียบเทียบ swing high ใหม่กับ swing high ก่อนหน้า"},
        {id:"ms-a03",question:"Low 100 → High 110 → Low 105 → High 116 ใกล้เคียง Structure ใด?",options:[{id:"a",text:"HH / HL"},{id:"b",text:"LL / LH"},{id:"c",text:"ไม่มี Swing"},{id:"d",text:"Range เท่านั้น"}],answer:"a",explanation:"Low ใหม่สูงขึ้นและ High ใหม่สูงขึ้น"},
        {id:"ms-a04",question:"High 120 → Low 110 → High 116 → Low 104 ใกล้เคียง Structure ใด?",options:[{id:"a",text:"LL / LH"},{id:"b",text:"HH / HL"},{id:"c",text:"ไม่มี movement"},{id:"d",text:"Leverage"}],answer:"a",explanation:"High ใหม่ต่ำลงและ Low ใหม่ต่ำลง"},
        {id:"ms-a05",question:"ทำไมต้องแยก Internal Swing กับ Important Swing?",options:[{id:"a",text:"เพื่อลด noise และรู้ว่าสwing ใดมีบทบาทต่อ Structure ที่กำลังอ่าน"},{id:"b",text:"เพื่อให้ทุก Candle เป็น signal"},{id:"c",text:"เพราะ internal swing ไม่มีราคา"},{id:"d",text:"เพื่อทำนายอนาคตแน่นอน"}],answer:"a",explanation:"การแยกระดับ swing ช่วยไม่ให้ structure หลักเปลี่ยนตาม noise ทุกจุด"},
        {id:"ms-a06",question:"ใน bullish structure หลัง HL แล้วราคาสร้าง HH ใหม่ สิ่งนี้เป็น evidence ของอะไร?",options:[{id:"a",text:"Structure Continuation"},{id:"b",text:"Bearish shift แน่นอน"},{id:"c",text:"ไม่มีข้อมูลใหม่"},{id:"d",text:"Stop Loss"}],answer:"a",explanation:"การสร้าง structural high ใหม่แสดง follow-through ในทิศทางเดิม"},
        {id:"ms-a07",question:"ข้อใดมีน้ำหนักมากกว่าในการพิจารณา Structure Shift?",options:[{id:"a",text:"การผ่าน Important Swing ของ structure เดิมพร้อม follow-through"},{id:"b",text:"Candle ตรงข้ามหนึ่งแท่ง"},{id:"c",text:"Internal wiggle ทุกจุด"},{id:"d",text:"ความรู้สึก"}],answer:"a",explanation:"Structural reference ที่มีความหมายและ behavior หลังการผ่านจุดนั้นสำคัญกว่า noise"},
        {id:"ms-a08",question:"การหลุด Internal Swing เล็ก ๆ หมายความว่า Structure หลักกลับทิศทันทีหรือไม่?",options:[{id:"a",text:"ไม่ จำเป็นต้องดูระดับ swing และข้อมูลต่อเนื่อง"},{id:"b",text:"ใช่ ทุกครั้ง"},{id:"c",text:"ใช่ เพราะ pullback คือ reversal"},{id:"d",text:"ไม่มี internal swing"}],answer:"a",explanation:"Internal movement ไม่ควรถูกยกระดับเป็น structural shift โดยอัตโนมัติ"},
        {id:"ms-a09",question:"ข้อใดเป็นคำอธิบาย Structure ที่เหมาะสมกว่า?",options:[{id:"a",text:"Swing สำคัญยังสร้าง HH/HL แต่จะอัปเดตเมื่อ behavior เปลี่ยน"},{id:"b",text:"HH/HL หมายถึงราคาจะขึ้นตลอดไป"},{id:"c",text:"เห็น HH แล้วต้อง Buy"},{id:"d",text:"Structure ไม่เปลี่ยน"}],answer:"a",explanation:"Structure คือ current reading ที่ต้องอัปเดตตามข้อมูลใหม่"},
        {id:"ms-a10",question:"Framework หลัง Context → Structure ขั้นถัดไปคืออะไร?",options:[{id:"a",text:"Location"},{id:"b",text:"Entry ทันที"},{id:"c",text:"Profit guarantee"},{id:"d",text:"เพิ่ม Leverage"}],answer:"a",explanation:"โปรแกรมค่อย ๆ สร้างกระบวนการ Context → Structure → Location → Behavior → Plan → Risk"}
      ]}
    ]
  }

        {type:"example",label:"ตัวอย่าง",text:"การ Reject กลางพื้นที่ที่ไม่มีจุดอ้างอิง อาจมีน้ำหนักต่างจากการ Reject บริเวณ Swing สำคัญหรือขอบของ Range. Location ไม่ได้บอกให้เข้าเทรด แต่บอกว่าบริเวณไหนควรสังเกตให้ละเอียดขึ้น"}
      ], exercises:[
        {id:"loc01-q1",type:"choice",question:"คำถามหลักของ Location คือข้อใด?",options:[{id:"a",text:"ตอนนี้ราคาอยู่ตรงไหนเมื่อเทียบกับพื้นที่สำคัญ?"},{id:"b",text:"แท่งถัดไปจะขึ้นหรือลงแน่นอน?"},{id:"c",text:"ควรใช้ Leverage สูงสุดเท่าไร?"},{id:"d",text:"จะเข้าเทรดทันทีหรือไม่?"}],answer:"a",explanation:"ถูกต้อง — Location ทำหน้าที่ระบุตำแหน่งของราคาในบริบทของพื้นที่ที่มีความหมาย",hint:"Context → Structure → ?"},
        {id:"loc01-q2",type:"choice",question:"เมื่อราคาเข้าสู่ Location ที่น่าสนใจ สิ่งใดเหมาะสมที่สุด?",options:[{id:"a",text:"เฝ้าดู Behavior เพิ่มเติม ไม่ถือว่าเป็น Entry อัตโนมัติ"},{id:"b",text:"เข้าเทรดทันทีทุกครั้ง"},{id:"c",text:"เพิ่ม Position Size"},{id:"d",text:"ถือว่าราคาต้องกลับตัว"}],answer:"a",explanation:"ถูกต้อง — Location คือพื้นที่สำหรับสังเกต ไม่ใช่คำสั่ง Buy/Sell",hint:"Location ≠ Entry"}
      ]},
      { id:"location-02", order:2, type:"lesson", title:"Key Levels", objective:"เข้าใจ Key Level ในฐานะบริเวณอ้างอิงที่ตลาดเคยแสดงพฤติกรรมสำคัญ โดยไม่ตีความเส้นทุกเส้นเป็นระดับสำคัญ", topics:["Key level","Prior swing","Range boundary","Reference area"], content:[
        {type:"text",text:"Key Level คือระดับหรือบริเวณที่มีเหตุผลให้กลับมาสังเกต เช่น Prior Swing High/Low หรือขอบของ Range ที่ราคาเคยตอบสนองชัดเจน. เป้าหมายไม่ใช่วาดเส้นให้เต็มกราฟ แต่เลือก reference ที่สัมพันธ์กับ Context และ Structure ที่กำลังอ่าน"},
        {type:"example",label:"ตัวอย่าง",text:"ถ้าตลาดกำลัง Range ระหว่าง 100–110 ขอบ 100 และ 110 มีความหมายต่อ Context มากกว่าระดับสุ่ม 106.37 ที่ยังไม่มีเหตุผลรองรับ"}
      ], exercises:[
        {id:"loc02-q1",type:"choice",question:"ข้อใดมีเหตุผลเป็น Key Level มากกว่าใน Range 100–110?",options:[{id:"a",text:"ขอบ Range บริเวณ 100 หรือ 110"},{id:"b",text:"ตัวเลขสุ่มที่ราคาไม่เคยแสดงพฤติกรรม"},{id:"c",text:"ทุกระดับราคาเท่ากันหมด"},{id:"d",text:"ราคาที่เราอยากให้กลับตัว"}],answer:"a",explanation:"ถูกต้อง — ขอบ Range เป็น reference ที่สัมพันธ์กับ Context ที่เห็น",hint:"เลือกจุดที่มีบทบาทต่อเส้นทางราคา"},
        {id:"loc02-q2",type:"choice",question:"การหา Key Level ที่ดีควรทำอย่างไร?",options:[{id:"a",text:"เลือกบริเวณที่สัมพันธ์กับ Context/Structure และมีเหตุผลอ้างอิง"},{id:"b",text:"วาดเส้นทุก Swing ย่อย"},{id:"c",text:"เลือกเฉพาะเลขกลมเสมอ"},{id:"d",text:"หาเส้นที่รับประกัน reversal"}],answer:"a",explanation:"ถูกต้อง — Key Level ควรช่วยลดข้อมูล ไม่ใช่เพิ่มเส้นจนอ่านกราฟไม่ได้",hint:"Useful reference, not more noise"}
      ]},
      { id:"location-03", order:3, type:"lesson", title:"Supply & Demand Areas", objective:"เข้าใจ Supply/Demand แบบพื้นฐานในฐานะพื้นที่ที่ราคาเคยออกตัวอย่างมีนัยสำคัญ และใช้เป็น Area of Interest ไม่ใช่จุดกลับตัวที่รับประกัน", topics:["Supply","Demand","Departure","Area not exact line"], content:[
        {type:"text",text:"ในโปรแกรมนี้ Demand ใช้เรียกพื้นที่ที่ราคาเคยออกตัวขึ้นอย่างมีนัยสำคัญ ส่วน Supply คือพื้นที่ที่ราคาเคยออกตัวลงอย่างมีนัยสำคัญ. เรามองเป็น ‘area’ มากกว่าเส้นราคาจุดเดียว และคุณค่าของพื้นที่ต้องอ่านร่วมกับ Context, Structure และสิ่งที่ราคาแสดงเมื่อกลับมา"},
        {type:"example",label:"ตัวอย่าง",text:"ราคาพักตัวในพื้นที่หนึ่งก่อนเกิด movement ขึ้นชัดเจน พื้นที่ต้นทางนั้นอาจถูกทำเครื่องหมายเป็น Demand Area เพื่อเฝ้าดูหากราคากลับมา แต่การกลับมาถึง Demand ไม่ได้แปลว่าต้อง Buy"}
      ], exercises:[
        {id:"loc03-q1",type:"choice",question:"Demand Area ในบทนี้หมายถึงอะไรโดยพื้นฐาน?",options:[{id:"a",text:"พื้นที่ที่ราคาเคยออกตัวขึ้นอย่างมีนัยสำคัญและใช้เป็น Area of Interest"},{id:"b",text:"พื้นที่ที่ต้อง Buy ทุกครั้ง"},{id:"c",text:"ราคาต่ำสุดของวันเท่านั้น"},{id:"d",text:"เส้นที่ไม่มีวันถูกทะลุ"}],answer:"a",explanation:"ถูกต้อง — Demand เป็นพื้นที่อ้างอิงสำหรับ observation ไม่ใช่ guarantee",hint:"Area of interest"},
        {id:"loc03-q2",type:"choice",question:"ราคากลับเข้า Supply Area แล้ว สิ่งใดสรุปได้เหมาะสมที่สุด?",options:[{id:"a",text:"เป็นบริเวณที่ควรสังเกต Behavior ต่อ ยังไม่ใช่ Sell signal ด้วยตัวมันเอง"},{id:"b",text:"ราคาต้องลงแน่นอน"},{id:"c",text:"ต้อง Sell ทันที"},{id:"d",text:"Structure ไม่มีความสำคัญแล้ว"}],answer:"a",explanation:"ถูกต้อง — Location ต้องทำงานร่วมกับ Behavior และข้อมูลส่วนอื่น",hint:"Zone is context, not execution"}
      ]},
      { id:"location-04", order:4, type:"lesson", title:"Liquidity Areas", objective:"เข้าใจ Liquidity แบบใช้งานพื้นฐานว่า order/stop อาจกระจุกตัวรอบจุดอ้างอิงที่เห็นได้ และการที่ราคาเข้าถึงหรือผ่านบริเวณนั้นยังต้องอ่าน Reaction ต่อ", topics:["Liquidity","Prior highs/lows","Stops","Sweep concept"], content:[
        {type:"text",text:"Liquidity ในระดับเริ่มต้นให้คิดว่าเป็นบริเวณที่อาจมีคำสั่งจำนวนมากรออยู่ เช่น รอบ Prior High/Prior Low หรือระดับที่ผู้เล่นจำนวนมากมองเห็น. Stop orders ก็สามารถเป็นส่วนหนึ่งของ liquidity ได้. ราคาอาจวิ่งเข้าไปหาและผ่านบริเวณเหล่านี้ แต่เราไม่ควรสรุป motive ของตลาดจากการแตะระดับเพียงอย่างเดียว"},
        {type:"example",label:"ตัวอย่าง",text:"เหนือ Prior High อาจมี Buy Stop และ Stop Loss ของผู้ที่ Short. หากราคาขึ้นผ่าน High นั้น เรารู้เพียงว่าราคาเข้าถึง liquidity area; ขั้นต่อไปคือดูว่าตลาด Accept เหนือระดับหรือ Reject กลับลงมา"}
      ], exercises:[
        {id:"loc04-q1",type:"choice",question:"บริเวณใดเป็นตัวอย่างของ Liquidity Area ที่ผู้เริ่มต้นสังเกตได้ง่าย?",options:[{id:"a",text:"รอบ Prior High / Prior Low ที่เห็นชัด"},{id:"b",text:"ทุก Pixel บนกราฟ"},{id:"c",text:"เฉพาะราคา Entry ของเรา"},{id:"d",text:"ไม่มีบริเวณใดเกี่ยวกับ order"}],answer:"a",explanation:"ถูกต้อง — จุดอ้างอิงที่ผู้เล่นมองเห็น เช่น prior highs/lows เป็นบริเวณที่ควรสังเกตเรื่อง liquidity",hint:"Visible reference points"},
        {id:"loc04-q2",type:"choice",question:"ราคากวาดเหนือ Prior High แล้ว ควรทำอะไรต่อ?",options:[{id:"a",text:"ดู Reaction/Acceptance/Follow-through ก่อนสรุปความหมาย"},{id:"b",text:"Sell ทันทีทุกครั้ง"},{id:"c",text:"Buy ทันทีทุกครั้ง"},{id:"d",text:"ถือว่า Structure ไม่มีผล"}],answer:"a",explanation:"ถูกต้อง — Event อย่างการผ่าน liquidity เป็นข้อมูลหนึ่งชิ้น ความหมายขึ้นกับ behavior หลังเหตุการณ์",hint:"Event → Reaction → Follow-through"}
      ]},
      { id:"location-05", order:5, type:"lesson", title:"Premium & Discount", objective:"เข้าใจ Premium/Discount แบบพื้นฐานในฐานะตำแหน่งสัมพัทธ์ภายใน Range ที่กำหนด ไม่ใช่สูตร Buy/Sell อัตโนมัติ", topics:["Defined range","Midpoint","Premium","Discount"], content:[
        {type:"text",text:"เมื่อเรากำหนด Range จาก Low ถึง High ที่มีเหตุผล เราสามารถใช้จุดกึ่งกลาง 50% เป็น reference อย่างง่าย: ครึ่งบนเรียก Premium และครึ่งล่างเรียก Discount. คำเหล่านี้บอก ‘ตำแหน่งสัมพัทธ์’ ภายใน Range เท่านั้น ไม่ได้บอกว่าราคาถูกหรือแพงในเชิงมูลค่าพื้นฐาน และไม่ใช่ Entry signal"},
        {type:"example",label:"ตัวอย่าง",text:"Defined Range 100–120 มี midpoint = 110. ราคา 116 อยู่ใน Premium half ของ Range และราคา 104 อยู่ใน Discount half. แต่เรายังต้องรู้ Context, Structure และ Behavior ก่อนสร้างแผน"}
      ], exercises:[
        {id:"loc05-q1",type:"choice",question:"Defined Range 100–120 มี midpoint เท่าไร?",options:[{id:"a",text:"110"},{id:"b",text:"100"},{id:"c",text:"120"},{id:"d",text:"220"}],answer:"a",explanation:"ถูกต้อง — midpoint ของ 100 และ 120 คือ 110",hint:"(High + Low) ÷ 2"},
        {id:"loc05-q2",type:"choice",question:"ราคาอยู่ Discount ของ Defined Range หมายความว่าอะไร?",options:[{id:"a",text:"ราคาอยู่ครึ่งล่างของ Range ที่กำหนด ไม่ได้แปลว่าต้อง Buy"},{id:"b",text:"ราคาจะขึ้นแน่นอน"},{id:"c",text:"สินทรัพย์มีมูลค่าถูกเสมอ"},{id:"d",text:"ต้องเพิ่ม Leverage"}],answer:"a",explanation:"ถูกต้อง — Premium/Discount เป็น location reference ไม่ใช่ valuation หรือ signal",hint:"Relative location only"}
      ]},
      { id:"location-06", order:6, type:"lesson", title:"Location Confluence", objective:"เข้าใจว่าพื้นที่หนึ่งอาจมี reference หลายอย่างซ้อนกัน แต่จำนวน confluence ไม่ได้แทนการอ่าน Behavior หรือรับประกันผล", topics:["Confluence","Overlapping references","Quality over quantity","No guarantee"], content:[
        {type:"text",text:"Location Confluence เกิดเมื่อพื้นที่เดียวมีเหตุผลหลายด้านซ้อนกัน เช่น Important Swing, Demand Area และ Discount ของ Defined Range. สิ่งนี้ช่วยให้พื้นที่มีเหตุผลสำหรับการเฝ้าดูมากขึ้น แต่ไม่ควรนับ confluence แบบสะสมคะแนนโดยไม่ดูคุณภาพหรือใช้เป็นข้ออ้างว่า trade ต้องชนะ"},
        {type:"example",label:"ตัวอย่าง",text:"บริเวณ 104 เป็น Important HL เดิม อยู่ใน Demand และอยู่ครึ่งล่างของ Defined Range. เราสามารถให้ความสนใจพื้นที่นี้มากกว่าระดับสุ่ม แต่ยังต้องรอว่าราคา ‘ทำอะไร’ เมื่อมาถึง"}
      ], exercises:[
        {id:"loc06-q1",type:"choice",question:"Important HL + Demand + Discount ซ้อนกันในพื้นที่เดียว สิ่งนี้บอกอะไรได้เหมาะสมที่สุด?",options:[{id:"a",text:"พื้นที่มีหลายเหตุผลให้เฝ้าดู แต่ยังต้องรอ Behavior"},{id:"b",text:"Buy ชนะ 100%"},{id:"c",text:"ไม่ต้องดู Structure"},{id:"d",text:"ต้องเข้าเมื่อแตะครั้งแรก"}],answer:"a",explanation:"ถูกต้อง — Confluence เพิ่มเหตุผลในการสังเกต ไม่ได้เปลี่ยน Location เป็น certainty",hint:"More reasons to watch, not guarantee"},
        {id:"loc06-q2",type:"choice",question:"ข้อใดเป็นการใช้ Confluence ที่ไม่เหมาะสม?",options:[{id:"a",text:"นับ indicator/เส้นจำนวนมากเพื่อบังคับให้ตัวเองมั่นใจ แม้ Context ขัดกัน"},{id:"b",text:"เลือก reference ที่สัมพันธ์กับ Structure"},{id:"c",text:"ใช้หลายหลักฐานเพื่อกำหนด Area of Interest"},{id:"d",text:"รอ Behavior เมื่อราคาเข้าพื้นที่"}],answer:"a",explanation:"ถูกต้อง — Confluence ที่ดีต้องมีเหตุผล ไม่ใช่สะสมสิ่งที่ซ้ำซ้อนเพื่อสร้างความมั่นใจปลอม",hint:"Quality > quantity"}
      ]},
      { id:"location-07", order:7, type:"lesson", title:"Location Reading Process", objective:"รวม Context → Structure → Location เป็นขั้นตอนเดียว และแยก Area of Interest ออกจาก Entry ก่อนเข้าสู่ Behavior", topics:["Context → Structure → Location","Area of Interest","Wait for behavior","Update"], content:[
        {type:"text",text:"กระบวนการอ่าน Location: 1) ระบุ Context และ Timeframe 2) Map Important Structure 3) หา Key Level / Supply-Demand / Liquidity ที่สัมพันธ์กับภาพนั้น 4) ถ้าใช้ Range ให้ระบุตำแหน่ง Premium/Discount 5) เลือกเฉพาะ Area of Interest ที่มีเหตุผล 6) เมื่อราคามาถึง อย่าเพิ่งเข้า — เปลี่ยนคำถามเป็น ‘ราคาแสดง Behavior อะไรที่นี่?’"},
        {type:"example",label:"ตัวอย่างการสรุป",text:"‘M5 Context ยัง directional up และ Important Structure ยังเป็น HH/HL. ราคากำลัง Pullback เข้า Demand ใกล้ Important HL และอยู่ Discount ของ defined swing range. นี่เป็น Location ที่น่าสนใจ แต่ยังไม่มี Entry — ขั้นต่อไปคือดู Behavior ที่เกิดขึ้นในพื้นที่’"}
      ], exercises:[
        {id:"loc07-q1",type:"choice",question:"ลำดับใดสอดคล้องกับ Framework มากที่สุด?",options:[{id:"a",text:"Context → Structure → Location → Behavior"},{id:"b",text:"Entry → Location → หา Context สนับสนุน"},{id:"c",text:"Indicator → Leverage → Prediction"},{id:"d",text:"Location → เข้าเทรดทันที"}],answer:"a",explanation:"ถูกต้อง — เราค่อย ๆ เพิ่มข้อมูลก่อนตัดสินใจ และ Location ทำหน้าที่พาเราไปสู่การสังเกต Behavior",hint:"Framework หลักของโปรแกรม"},
        {id:"loc07-q2",type:"choice",question:"หลังพบ Location ที่มีเหตุผลแล้ว คำถามถัดไปควรเป็นอะไร?",options:[{id:"a",text:"ราคากำลังแสดง Behavior อะไรเมื่อมาถึงพื้นที่นี้?"},{id:"b",text:"จะ All-in เท่าไร?"},{id:"c",text:"กำไรแน่นอนเท่าไร?"},{id:"d",text:"ทำไมต้องดูราคาอีก?"}],answer:"a",explanation:"ถูกต้อง — นี่คือสะพานจาก Location ไปสู่ Module ถัดไป: Behavior",hint:"Location tells where; Behavior tells what price does there"}
      ]},
      { id:"location-08", order:8, type:"assessment", title:"Module Assessment", objective:"ตรวจว่าผู้เรียนสามารถระบุ Location ที่มีเหตุผลและเข้าใจว่า Location ไม่ใช่ Entry ก่อนเข้าสู่ Behavior", topics:["10 ข้อ","ผ่านเมื่อได้ตั้งแต่ 70%"], questions:[
        {id:"loc-a01",question:"Location ตอบคำถามหลักอะไร?",options:[{id:"a",text:"ตอนนี้ราคาอยู่ตรงไหนเมื่อเทียบกับพื้นที่สำคัญ?"},{id:"b",text:"แท่งถัดไปต้องไปทางไหน?"},{id:"c",text:"กำไรแน่นอนเท่าไร?"},{id:"d",text:"ควรใช้ Leverage สูงสุดเท่าไร?"}],answer:"a",explanation:"Location คือการระบุตำแหน่งของราคาในบริบทของ reference ที่มีความหมาย"},
        {id:"loc-a02",question:"ใน Range 100–110 บริเวณใดเป็น Key Level ที่มีเหตุผลชัดกว่า?",options:[{id:"a",text:"ขอบ Range 100/110"},{id:"b",text:"ระดับสุ่มที่ไม่มี reference"},{id:"c",text:"Entry ของเราเสมอ"},{id:"d",text:"ทุกระดับเท่ากัน"}],answer:"a",explanation:"ขอบ Range สัมพันธ์โดยตรงกับ Context ที่กำลังอ่าน"},
        {id:"loc-a03",question:"Demand Area ควรถูกใช้แบบใด?",options:[{id:"a",text:"เป็น Area of Interest เพื่อเฝ้าดูเมื่อราคากลับมา"},{id:"b",text:"เป็น Buy signal อัตโนมัติ"},{id:"c",text:"เป็นระดับที่ไม่มีวันแตก"},{id:"d",text:"ใช้แทน Structure ทั้งหมด"}],answer:"a",explanation:"Demand เป็น location reference ไม่ใช่ guarantee"},

      ]},
      { id:"price-behavior-05", order:5, type:"lesson", title:"การย่อและกลับมาทดสอบ", objective:"แยก Pullback และ Retest และเข้าใจว่าการกลับมาทดสอบช่วยให้เห็นว่าระดับใหม่ยังทำงานหรือไม่", topics:["Pullback","Retest","Break → Retest","Reaction"], content:[

        {id:"pb05-q2",type:"choice",question:"Break → Retest แล้วราคาไม่สามารถรักษาอีกฝั่งของระดับได้ สิ่งใดเหมาะสมที่สุด?",options:[{id:"a",text:"ทบทวนสมมติฐาน เพราะ Break อาจล้มเหลว"},{id:"b",text:"ถือว่า Break สำเร็จแน่นอน"},{id:"c",text:"เพิ่ม Position ทันที"},{id:"d",text:"ไม่ต้องดูอะไรต่อ"}],answer:"a",explanation:"ถูกต้อง — Retest ให้ข้อมูลว่าระดับใหม่ได้รับการรักษาหรือไม่",hint:"ตลาดต้องพิสูจน์พฤติกรรมหลัง Break"}
      ]},

        {type:"text",text:"การยอมรับราคา (Acceptance) ให้คิดง่าย ๆ ว่า หลังราคาเข้าสู่หรือทะลุพื้นที่ใหม่ ราคาสามารถอยู่และทำงานต่อในฝั่งนั้นได้ ส่วน Failure คือสิ่งที่เราคาดหวังไม่สามารถรักษาไว้ เช่น Break แล้วกลับเข้ากรอบและไม่มีแรงต่อเนื่อง"},
        {type:"example",label:"ตัวอย่าง",text:"Break เหนือ High → ยืนเหนือ → Retest แล้วยัง Hold → ขยายขึ้นต่อ เป็นหลักฐานของ Acceptance มากขึ้น ในทางกลับกัน Break → กลับใต้ High → ขยายลง อาจสะท้อน Failed Break"}
      ], exercises:[
        {id:"pb06-q1",type:"choice",question:"ข้อใดแสดง Acceptance เหนือระดับได้มากกว่า?",options:[{id:"a",text:"Break เหนือระดับ ยืนได้ Retest แล้วยัง Hold และไปต่อ"},{id:"b",text:"แทงเหนือระดับแล้วกลับลงทันที"},{id:"c",text:"แตะระดับครั้งเดียว"},{id:"d",text:"ยังไม่ถึงระดับ"}],answer:"a",explanation:"ถูกต้อง — Acceptance เห็นจากความสามารถในการรักษาฝั่งใหม่และมีพฤติกรรมต่อเนื่อง",hint:"Break → Hold → Continue"},
        {id:"pb06-q2",type:"choice",question:"Follow-through หมายถึงอะไรในภาษาง่าย ๆ?",options:[{id:"a",text:"แรงต่อเนื่องหลังเหตุการณ์ที่ช่วยยืนยันว่าพฤติกรรมนั้นยังดำเนินอยู่"},{id:"b",text:"การเดาแท่งถัดไป"},{id:"c",text:"กำไรที่รับประกัน"},{id:"d",text:"จำนวน Indicator"}],answer:"a",explanation:"ถูกต้อง — เราดูว่าหลัง Event ตลาดมีแรงทำต่อหรือไม่",hint:"สิ่งที่เกิดตามหลัง Event"}
      ]},
      { id:"price-behavior-07", order:7, type:"lesson", title:"กระบวนการอ่านพฤติกรรมราคา", objective:"รวม Context → Structure → Location → พฤติกรรมราคาเป็นกระบวนการเดียว ก่อนเข้าสู่การสร้างแผน", topics:["Context → Structure → Location → พฤติกรรมราคา","Event → Reaction → Follow-through","Wait for confirmation","Update"], content:[
        {type:"text",text:"กระบวนการอ่านพฤติกรรมราคา: 1) รู้ Context 2) Map Structure 3) รู้ Location 4) รอ Event เช่น Break/Sweep/Retest 5) ดู Reaction ว่าราคาตอบสนองอย่างไร 6) ดูแรงต่อเนื่อง 7) ถ้าพฤติกรรมไม่ตรงกับสิ่งที่คาด ให้ Update มุมมองแทนการบังคับตลาด"},
        {type:"example",label:"ตัวอย่างการสรุป",text:"‘ราคา Pullback เข้า Demand ใกล้ Important HL → Sweep Low → กลับเหนือระดับ → เกิดแรงขึ้นต่อ’ นี่ให้ข้อมูลมากกว่าแค่ ‘ราคาแตะ Demand’. ขั้นถัดไปของ Framework คือเปลี่ยนข้อมูลทั้งหมดให้เป็น Plan ที่มีเงื่อนไขชัดเจน"}
      ], exercises:[
        {id:"pb07-q1",type:"choice",question:"ลำดับใดตรงกับ Framework ตอนนี้มากที่สุด?",options:[{id:"a",text:"Context → Structure → Location → พฤติกรรมราคา"},{id:"b",text:"Entry → หาเหตุผลย้อนหลัง"},{id:"c",text:"Indicator → Prediction → All-in"},{id:"d",text:"Location → Entry ทันที"}],answer:"a",explanation:"ถูกต้อง — เราสร้างความเข้าใจทีละชั้นก่อนสร้างแผน",hint:"4 ขั้นแรกของ Framework"},
        {id:"pb07-q2",type:"choice",question:"หลังพฤติกรรมราคาเริ่มยืนยันภาพที่เรารอ ขั้นถัดไปของ Framework คืออะไร?",options:[{id:"a",text:"สร้างแผน (Plan) พร้อมเงื่อนไข"},{id:"b",text:"เพิ่ม Leverage สูงสุด"},{id:"c",text:"รับประกันกำไร"},{id:"d",text:"เลิกดู Risk"}],answer:"a",explanation:"ถูกต้อง — ขั้นถัดไปคือเปลี่ยนสิ่งที่อ่านได้ให้เป็นแผนที่มีเงื่อนไข ไม่ใช่การคาดเดา",hint:"Context → Structure → Location → พฤติกรรมราคา → ?"}
      ]},
      { id:"price-behavior-08", order:8, type:"assessment", title:"แบบทดสอบท้าย Module", objective:"ตรวจว่าผู้เรียนสามารถอ่านเหตุการณ์ ปฏิกิริยา และแรงต่อเนื่องของราคาได้ โดยไม่ใช้ Event เดียวเป็น Entry", topics:["10 ข้อ","ผ่านเมื่อได้ตั้งแต่ 70%"], questions:[
        {id:"pb-a01",question:"หลังราคาเข้า Location ที่น่าสนใจ เราควรดูอะไรต่อ?",options:[{id:"a",text:"พฤติกรรมราคาที่เกิดขึ้นจริง"},{id:"b",text:"เข้าเทรดทันที"},{id:"c",text:"เพิ่ม Leverage"},{id:"d",text:"เดาแท่งหน้า"}],answer:"a",explanation:"Location บอก where; พฤติกรรมราคาบอก what happens there"},
        {id:"pb-a02",question:"Break หนึ่งครั้งเพียงพอให้สรุป continuation แน่นอนหรือไม่?",options:[{id:"a",text:"ไม่ ต้องดู Reaction และแรงต่อเนื่อง"},{id:"b",text:"ใช่เสมอ"},{id:"c",text:"ใช่เฉพาะ M1"},{id:"d",text:"ใช่เฉพาะทอง"}],answer:"a",explanation:"Event ต้องอ่านร่วมกับสิ่งที่เกิดตามมา"},
        {id:"pb-a03",question:"Rejection คืออะไรโดยพื้นฐาน?",options:[{id:"a",text:"ราคาเข้าพื้นที่แต่รักษาราคาไว้ไม่ได้และเคลื่อนกลับ"},{id:"b",text:"ราคาไปต่อแรง"},{id:"c",text:"ทุก wick คือ reversal"},{id:"d",text:"ราคาไม่เคลื่อน"}],answer:"a",explanation:"Rejection คือการไม่สามารถรักษาราคาในบริเวณนั้น"},
        {id:"pb-a04",question:"Liquidity Sweep ที่ Prior Low มีลักษณะใด?",options:[{id:"a",text:"ผ่าน Low แล้วกลับขึ้นเหนือระดับเดิม"},{id:"b",text:"ไม่แตะ Low"},{id:"c",text:"ขึ้นต่อโดยไม่ทดสอบ"},{id:"d",text:"Indicator เปลี่ยนสี"}],answer:"a",explanation:"Sweep คือการผ่าน reference แล้วกลับมาอีกฝั่ง"},
        {id:"pb-a05",question:"เห็น Sweep แล้วควรทำอย่างไร?",options:[{id:"a",text:"ดูการตอบสนองและการยืนยันต่อ"},{id:"b",text:"เข้าเทรดทันทีทุกครั้ง"},{id:"c",text:"เพิ่ม Size"},{id:"d",text:"ไม่ต้องดู Structure"}],answer:"a",explanation:"Sweep เป็น Event ไม่ใช่ Entry ด้วยตัวมันเอง"},
        {id:"pb-a06",question:"Retest คืออะไร?",options:[{id:"a",text:"การกลับมาทดสอบระดับหรือพื้นที่ที่เพิ่งมีบทบาท"},{id:"b",text:"การปิด Position"},{id:"c",text:"การเพิ่ม Margin"},{id:"d",text:"การทำนาย"}],answer:"a",explanation:"Retest ช่วยให้เราดูว่าระดับใหม่ยังถูก Hold หรือไม่"},
        {id:"pb-a07",question:"ข้อใดแสดง Acceptance เหนือระดับมากกว่า?",options:[{id:"a",text:"Break → Hold → Retest → ไปต่อ"},{id:"b",text:"แทงเหนือแล้วกลับลงทันที"},{id:"c",text:"ยังไม่ถึงระดับ"},{id:"d",text:"แตะหนึ่งครั้งแล้วหยุด"}],answer:"a",explanation:"Acceptance สะท้อนความสามารถในการรักษาฝั่งใหม่"},
        {id:"pb-a08",question:"Follow-through แปลแบบง่ายที่สุดว่าอะไร?",options:[{id:"a",text:"แรงต่อเนื่องหลังเหตุการณ์"},{id:"b",text:"จุด Entry"},{id:"c",text:"Stop Loss"},{id:"d",text:"Leverage"}],answer:"a",explanation:"Follow-through คือสิ่งที่ตลาดทำต่อหลัง Event/Reaction"},
        {id:"pb-a09",question:"หลักใดสำคัญที่สุดใน Module นี้?",options:[{id:"a",text:"Event → Reaction → Follow-through มากกว่า Event เดียว"},{id:"b",text:"เห็น Pattern แล้วเข้าเลย"},{id:"c",text:"ทุก Break ต้องตาม"},{id:"d",text:"ทุก Sweep ต้องสวน"}],answer:"a",explanation:"เราอ่านพฤติกรรมเป็นลำดับ ไม่ใช้เหตุการณ์เดียวตัดสินทั้งหมด"},
        {id:"pb-a10",question:"หลัง Context → Structure → Location → พฤติกรรมราคา ขั้นถัดไปคืออะไร?",options:[{id:"a",text:"สร้างแผน (Plan)"},{id:"b",text:"เพิ่ม Leverage"},{id:"c",text:"Prediction"},{id:"d",text:"ข้าม Risk"}],answer:"a",explanation:"เมื่ออ่านข้อมูลครบ ขั้นถัดไปคือสร้าง Plan ที่มีเงื่อนไขชัดเจน"}
      ]}
    ]
  }
