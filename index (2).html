  {
    id: "trading-plan",
    title: "การสร้างแผนเทรด",
    passingScore: 70,
    lessons: [
      { id:"trading-plan-01", order:1, type:"lesson", title:"แผนเทรดคืออะไร", objective:"เข้าใจว่าแผนเทรดคือชุดเงื่อนไขสำหรับการตัดสินใจ ไม่ใช่การทำนายว่าราคาต้องไปทางไหน", topics:["แผนแบบมีเงื่อนไข","ถ้า...จึง...","ไม่ทำนายตลาด"], content:[
        {type:"text",text:"แผนเทรดคือสิ่งที่เขียนไว้ล่วงหน้าว่า เราจะทำอะไรเมื่อสถานการณ์ที่กำหนดเกิดขึ้น หน้าที่ของแผนไม่ใช่บอกอนาคต แต่ช่วยให้เราตัดสินใจด้วยเหตุผลเดียวกันทุกครั้ง แทนการเปลี่ยนใจตามแท่งเทียนหรืออารมณ์ตรงหน้า"},{type:"text",text:"แผนที่ดีจึงใช้รูปแบบง่าย ๆ ว่า ‘ถ้า...จึง...’ เช่น ถ้าบริบทตลาดยังสนับสนุนฝั่งขึ้น ราคาเข้าพื้นที่ที่เราสนใจ และมีพฤติกรรมยืนยัน จึงค่อยพิจารณา Long แต่ถ้าเงื่อนไขไม่เกิด เราไม่ต้องทำอะไร"},{type:"example",label:"วิธีคิดทีละขั้น",text:"1) อ่านตลาดก่อน → 2) กำหนดสิ่งที่รอ → 3) รอให้ตลาดแสดง → 4) เงื่อนไขครบจึงพิจารณา → 5) ไม่ครบ = ไม่เทรด"},
        {type:"example",title:"ตัวอย่าง",text:"ไม่ใช่: ราคาจะขึ้นจากตรงนี้แน่นอน | แต่เป็น: ถ้าราคากลับเข้าพื้นที่ที่สนใจและมีการปฏิเสธพร้อมแรงต่อเนื่อง จึงพิจารณาแผน Long"}
      ], exercises:[
        {id:"tp01-q1",type:"choice",question:"ข้อใดเป็นแผนแบบมีเงื่อนไขมากกว่า?",options:[{id:"a",text:"ราคาต้องขึ้นแน่นอน"},{id:"b",text:"ถ้าราคาเข้าพื้นที่ที่สนใจและพฤติกรรมยืนยัน จึงพิจารณาแผน"},{id:"c",text:"เห็นโซนแล้ว Buy ทันที"},{id:"d",text:"เข้าออเดอร์ก่อนแล้วค่อยหาเหตุผล"}],answer:"b",explanation:"ถูกต้อง — แผนเชื่อมการตัดสินใจกับเงื่อนไขที่สังเกตได้",hint:"มองหาประโยคแบบ ถ้า...จึง..."},
        {id:"tp01-q2",type:"choice",question:"ถ้าเงื่อนไขที่รอไม่เกิด ควรทำอย่างไร?",options:[{id:"a",text:"ไม่เทรดตามแผนนั้น"},{id:"b",text:"บังคับเข้าเพราะรอมานาน"},{id:"c",text:"เพิ่มขนาด Position"},{id:"d",text:"เปลี่ยนเหตุผลหลังเข้า"}],answer:"a",explanation:"ถูกต้อง — No setup / no confirmation ก็เป็นการตัดสินใจได้",hint:"ไม่มีเงื่อนไข = ไม่มีเหตุผลให้ execute"}
      ]},
      { id:"trading-plan-02", order:2, type:"lesson", title:"ประกอบข้อมูลก่อนสร้างแผน", objective:"นำบริบทตลาด โครงสร้าง ตำแหน่งราคา และพฤติกรรมราคามาเชื่อมกันก่อนตัดสินใจ", topics:["บริบทตลาด","โครงสร้าง","ตำแหน่งราคา","พฤติกรรมราคา"], content:[
        {type:"text",text:"ก่อนคิดเรื่อง Buy หรือ Sell ให้รวบรวมข้อมูลที่เรียนมาก่อนหน้านี้ให้ครบ 4 ชั้น: บริบทตลาด, โครงสร้าง, ตำแหน่งราคา และพฤติกรรมราคา แต่ละชั้นตอบคำถามคนละอย่าง จึงไม่ควรข้ามขั้น"},{type:"text",text:"บริบทบอกว่าภาพรวมกำลังทำอะไร โครงสร้างบอกว่าราคาจัดลำดับจุดสำคัญอย่างไร ตำแหน่งบอกว่าราคาอยู่บริเวณไหน และพฤติกรรมราคาบอกว่าตลาดตอบสนองอย่างไรเมื่อมาถึงบริเวณนั้น เมื่อข้อมูลหลายชั้นสอดคล้องกัน เราจึงมีเหตุผลมากพอที่จะสร้างแผน"},{type:"example",label:"เช็ก 4 คำถาม",text:"ตอนนี้ตลาดทำอะไร? → โครงสร้างสำคัญอยู่ตรงไหน? → ราคากำลังอยู่บริเวณใด? → เมื่อมาถึงตรงนี้ ราคาแสดงอะไร?"},
        {type:"example",title:"ลำดับคิด",text:"บริบทตลาด → โครงสร้าง → ตำแหน่งราคา → พฤติกรรมราคา → แผน"}
      ], exercises:[
        {id:"tp02-q1",type:"choice",question:"ก่อนสร้างแผน สิ่งใดควรถูกอ่านร่วมกัน?",options:[{id:"a",text:"บริบทตลาด + โครงสร้าง + ตำแหน่งราคา + พฤติกรรมราคา"},{id:"b",text:"สีแท่งเทียนล่าสุดอย่างเดียว"},{id:"c",text:"กำไรที่อยากได้"},{id:"d",text:"จำนวนครั้งที่เทรดวันนี้"}],answer:"a",explanation:"ถูกต้อง — แผนเกิดจากข้อมูลหลายชั้นที่เชื่อมกัน",hint:"ทบทวน Framework ที่เรียนมา"},
        {id:"tp02-q2",type:"choice",question:"ถ้าข้อมูลแต่ละส่วนขัดกันมากและภาพยังไม่ชัด สิ่งใดสมเหตุสมผลที่สุด?",options:[{id:"a",text:"รอข้อมูลเพิ่มหรือไม่เทรด"},{id:"b",text:"เลือกข้อมูลที่ตรงกับความอยากของเรา"},{id:"c",text:"เข้าให้เร็วขึ้น"},{id:"d",text:"เพิ่ม Leverage"}],answer:"a",explanation:"ถูกต้อง — ความไม่ชัดเจนไม่จำเป็นต้องถูกเปลี่ยนเป็นออเดอร์",hint:"แผนไม่จำเป็นต้องมีทุกเวลา"}
      ]},
      { id:"trading-plan-03", order:3, type:"lesson", title:"เงื่อนไขก่อนเข้าเทรด", objective:"กำหนดสิ่งที่ต้องเกิดก่อนพิจารณาเข้าเทรด เพื่อไม่ให้การตัดสินใจเกิดจากอารมณ์หรือเหตุการณ์เดียว", topics:["เงื่อนไขก่อนเข้า","Confirmation","Checklist"], content:[
        {type:"text",text:"เงื่อนไขก่อนเข้า คือรายการสิ่งที่เราต้องเห็นบนกราฟก่อนจึงจะอนุญาตให้ตัวเองพิจารณาเข้าเทรด จุดสำคัญคือเงื่อนไขต้องตรวจสอบได้จริง ไม่ใช่ความรู้สึก เช่น ‘น่าจะขึ้น’ หรือ ‘กลัวตกรถ’"},{type:"text",text:"เราไม่จำเป็นต้องใช้เงื่อนไขจำนวนมาก แต่ต้องรู้ว่ากำลังรออะไร ตัวอย่างเช่น ราคาเข้าพื้นที่ที่กำหนด → กวาด Low → กลับขึ้นเหนือระดับ → มีแรงต่อเนื่อง หากขาดขั้นสำคัญไป แผนยังไม่พร้อม"},{type:"example",label:"จำง่าย ๆ",text:"Location บอกว่าให้เฝ้าดูตรงไหน → พฤติกรรมราคาบอกว่าเกิดอะไรขึ้น → เงื่อนไขก่อนเข้าบอกว่า ‘ครบหรือยัง’"},
        {type:"example",title:"ตัวอย่างเงื่อนไข",text:"ราคาเข้า Location → Sweep Low → กลับเหนือระดับ → มีแรงต่อเนื่องขึ้น → จึงพิจารณา Long"}
      ], exercises:[
        {id:"tp03-q1",type:"choice",question:"ข้อใดเป็นเงื่อนไขที่ตรวจบนกราฟได้ชัดกว่า?",options:[{id:"a",text:"รู้สึกว่าราคาน่าจะขึ้น"},{id:"b",text:"ราคา Sweep Low แล้วกลับเหนือระดับพร้อมแรงต่อเนื่อง"},{id:"c",text:"วันนี้อยากได้กำไร"},{id:"d",text:"กลัวตกรถ"}],answer:"b",explanation:"ถูกต้อง — เงื่อนไขควรอิงสิ่งที่ตลาดแสดงจริง",hint:"ต้องมองเห็นและตรวจได้"},
        {id:"tp03-q2",type:"choice",question:"เหตุผลหลักของการกำหนดเงื่อนไขก่อนเข้าคืออะไร?",options:[{id:"a",text:"ลดการตัดสินใจตามอารมณ์และรอสิ่งที่กำหนดไว้"},{id:"b",text:"ทำให้ชนะทุกครั้ง"},{id:"c",text:"ทำให้ไม่ต้องใช้ Stop Loss"},{id:"d",text:"ทำให้ทำนายตลาดได้แน่นอน"}],answer:"a",explanation:"ถูกต้อง — เงื่อนไขช่วยให้การตัดสินใจมีกรอบ แต่ไม่ได้รับประกันผลลัพธ์",hint:"Process มากกว่า prediction"}
      ]},
      { id:"trading-plan-04", order:4, type:"lesson", title:"จุดที่บอกว่าแผนนี้ผิด", objective:"รู้ล่วงหน้าว่าพฤติกรรมหรือระดับใดจะทำให้เหตุผลของแผนไม่ใช้ได้อีกต่อไป", topics:["แผนผิดเมื่อไร","Invalidation","ยกเลิกแผน","ไม่ฝืนตลาด"], content:[
        {type:"text",text:"ก่อนคิดว่าจะได้กำไรเท่าไร เราต้องตอบให้ได้ก่อนว่า ‘อะไรจะพิสูจน์ว่าแนวคิดนี้ไม่ถูกแล้ว’ จุดนี้คือจุดที่บอกว่าแผนผิด (Invalidation) และควรถูกกำหนดก่อนเข้า ไม่ใช่คิดขึ้นหลังจากราคาเคลื่อนสวนเรา"},{type:"text",text:"ตัวอย่างเช่น เราวางแผนจากการที่ราคากลับมายืนเหนือระดับสำคัญ หากต่อมาราคากลับลงและยอมรับใต้ระดับนั้นอีกครั้ง เหตุผลหลักของแผนอาจหายไป การกระทำที่สอดคล้องคือยกเลิกหรือประเมินใหม่ ไม่ใช่เปลี่ยนเหตุผลเพื่อรักษาออเดอร์เดิม"},{type:"example",label:"คำถามสำคัญก่อนเข้า",text:"ถ้าตลาดทำอะไรต่อจากนี้ ฉันจะยอมรับว่าแผนเดิมใช้ไม่ได้แล้ว?"},
        {type:"example",title:"หลักคิด",text:"ก่อนเข้า: รู้ว่าต้องเห็นอะไร → รู้ด้วยว่าอะไรจะทำให้แผนนี้ผิด"}
      ], exercises:[
        {id:"tp04-q1",type:"choice",question:"‘จุดที่บอกว่าแผนนี้ผิด’ มีหน้าที่อะไร?",options:[{id:"a",text:"บอกว่าเมื่อไรเหตุผลของแผนเดิมไม่ใช้ได้แล้ว"},{id:"b",text:"รับประกันจุดกลับตัว"},{id:"c",text:"บอกกำไรสูงสุด"},{id:"d",text:"เพิ่มจำนวนออเดอร์"}],answer:"a",explanation:"ถูกต้อง — เมื่อเงื่อนไขหลักถูกทำลาย เราต้องยอมรับข้อมูลใหม่",hint:"Invalidation = เหตุผลเดิมถูกลบล้าง"},
        {id:"tp04-q2",type:"choice",question:"ถ้าตลาดแสดงสิ่งที่ทำให้แผนเดิมผิด ควรทำอย่างไร?",options:[{id:"a",text:"ยกเลิกหรือประเมินแผนใหม่"},{id:"b",text:"ฝืนแผนเดิมเพราะวิเคราะห์ไว้แล้ว"},{id:"c",text:"เพิ่ม Position เพื่อเอาคืน"},{id:"d",text:"ลบเงื่อนไขที่ไม่ชอบออก"}],answer:"a",explanation:"ถูกต้อง — เราอัปเดตตามข้อมูล ไม่บังคับตลาดให้ตรงกับมุมมอง",hint:"Read and update"}
      ]},
      { id:"trading-plan-05", order:5, type:"lesson", title:"จุดเข้า จุดป้องกัน และเป้าหมาย", objective:"เข้าใจหน้าที่ของ Entry, Stop Loss และ Target ในแผน โดยยังไม่ลงรายละเอียดการคำนวณความเสี่ยง", topics:["Entry","Stop Loss","Target","เหตุผลของแต่ละจุด"], content:[
        {type:"text",text:"เมื่อเงื่อนไขของแผนครบ เราต้องแยกหน้าที่ของ 3 จุดให้ชัด: จุดเข้า (Entry) คือบริเวณหรือเหตุการณ์ที่ทำให้เราพิจารณาเปิด Position, จุดป้องกัน (Stop Loss) คือจุดจำกัดผลกระทบเมื่อแนวคิดผิด และเป้าหมาย (Target) คือพื้นที่ที่เราวางแผนรับผลลัพธ์"},{type:"text",text:"ทั้งสามจุดควรเชื่อมกับเหตุผลบนกราฟ ไม่ใช่เลือกตัวเลขเพราะอยากได้กำไรจำนวนหนึ่ง เช่น Stop ควรอยู่สัมพันธ์กับจุดที่ทำให้ไอเดียผิด ส่วน Target อาจสัมพันธ์กับ Liquidity หรือระดับสำคัญถัดไป รายละเอียดเรื่องขนาดความเสี่ยงจะเรียนใน Module ต่อไป"},{type:"example",label:"หน้าที่ของแต่ละจุด",text:"Entry = เมื่อเงื่อนไขพร้อม | Stop = เมื่อเหตุผลของแผนผิด | Target = พื้นที่ที่มีเหตุผลให้ราคาไปทดสอบ/เป็นเป้าหมายของแผน"},
        {type:"example",title:"โครงแผน",text:"Entry = หลังเงื่อนไขยืนยัน | Stop = หลังจุดที่ทำให้ไอเดียผิด | Target = พื้นที่เป้าหมายถัดไป"}
      ], exercises:[
        {id:"tp05-q1",type:"choice",question:"Stop Loss ในแผนควรสัมพันธ์กับอะไร?",options:[{id:"a",text:"จุดที่ทำให้เหตุผลของแผนผิด"},{id:"b",text:"จำนวนเงินที่อยากชนะอย่างเดียว"},{id:"c",text:"สีของกราฟ"},{id:"d",text:"เวลาที่เปิดโปรแกรม"}],answer:"a",explanation:"ถูกต้อง — Stop ควรมีเหตุผลเชิงโครงสร้าง/แผน ไม่ใช่ตัวเลขสุ่ม",hint:"ย้อนกลับไปที่ Invalidation"},
        {id:"tp05-q2",type:"choice",question:"เป้าหมายราคาในแผนควรถูกกำหนดอย่างไรในระดับพื้นฐาน?",options:[{id:"a",text:"อิงพื้นที่หรือระดับที่มีเหตุผลบนกราฟ"},{id:"b",text:"ตั้งให้ไกลที่สุดเสมอ"},{id:"c",text:"เลือกเลขสุ่ม"},{id:"d",text:"ไม่ต้องมีเป้าหมาย"}],answer:"a",explanation:"ถูกต้อง — Target ควรสัมพันธ์กับโครงสร้าง/Location/Liquidity ที่อ่านได้",hint:"เป้าหมายต้องมีเหตุผล"}
      ]},
      { id:"trading-plan-06", order:6, type:"lesson", title:"แผนที่ไม่เทรด", objective:"เข้าใจว่า No Trade เป็นส่วนหนึ่งของระบบตัดสินใจ และกำหนดสถานการณ์ที่ควรรอได้", topics:["No Trade","ความไม่ชัดเจน","เงื่อนไขไม่ครบ","ไม่ไล่ราคา"], content:[
        {type:"text",text:"การมีแผนไม่ได้หมายความว่าเราต้องหาออเดอร์ให้ได้ทุกครั้ง หนึ่งในผลลัพธ์ที่ถูกต้องของการวิเคราะห์คือ ‘ไม่เทรด’ เพราะตลาดอาจยังไม่ให้ข้อมูลที่เพียงพอ"},{type:"text",text:"สถานการณ์ที่ควรรอ เช่น บริบทไม่ชัด ราคาอยู่กลาง Range ไม่มีตำแหน่งที่น่าสนใจ พฤติกรรมราคายังไม่ยืนยัน หรือราคาวิ่งออกจากจุดที่วางแผนไว้แล้ว การไล่ราคาเพราะกลัวพลาดจะทำให้แผนที่เตรียมไว้ไม่มีความหมาย"},{type:"example",label:"No Trade ก็เป็นคำตอบ",text:"เงื่อนไขครบ → มีแผนให้พิจารณา | เงื่อนไขไม่ครบ → รอ | ราคาไม่อยู่ในจุดที่วางไว้ → ไม่ไล่"},
        {type:"example",title:"ตัวอย่าง No Trade",text:"ราคาอยู่กลาง Range + ไม่มีระดับสำคัญใกล้เคียง + พฤติกรรมสับสน → รอ ไม่ต้องสร้างออเดอร์จากความเบื่อ"}
      ], exercises:[
        {id:"tp06-q1",type:"choice",question:"ข้อใดเป็นเหตุผลที่สมเหตุสมผลสำหรับ No Trade?",options:[{id:"a",text:"เงื่อนไขสำคัญยังไม่ครบและภาพยังไม่ชัด"},{id:"b",text:"ยังไม่ได้เทรดวันนี้เลย"},{id:"c",text:"อยากได้เงินเร็ว"},{id:"d",text:"เพิ่งแพ้ออเดอร์ก่อนหน้า"}],answer:"a",explanation:"ถูกต้อง — No Trade เกิดจากคุณภาพของข้อมูล/เงื่อนไข ไม่ใช่อารมณ์",hint:"ไม่มี setup ที่ชัด = รอได้"},
        {id:"tp06-q2",type:"choice",question:"การไม่เทรดเมื่อเงื่อนไขไม่ครบหมายถึงอะไร?",options:[{id:"a",text:"กำลังทำตามแผน"},{id:"b",text:"ระบบล้มเหลว"},{id:"c",text:"ต้องหาออเดอร์ใหม่ทันที"},{id:"d",text:"ต้องลดมาตรฐาน"}],answer:"a",explanation:"ถูกต้อง — การไม่ Execute ก็เป็นส่วนหนึ่งของ Execution discipline",hint:"Plan รวมทั้งสิ่งที่ไม่ทำ"}
      ]},
      { id:"trading-plan-07", order:7, type:"lesson", title:"เขียนแผนเทรดแบบง่าย", objective:"รวมทุกองค์ประกอบเป็นแผนสั้นที่อ่านแล้วรู้ว่าจะรออะไร ทำอะไร และยกเลิกเมื่อไร", topics:["Scenario","Trigger","Invalidation","Target","No Trade"], content:[
        {type:"text",text:"เมื่อเข้าใจแต่ละส่วนแล้ว เราสามารถเขียนแผนหนึ่งชุดให้อ่านจบในไม่กี่บรรทัด เป้าหมายคือให้ตัวเราในตอนที่ตลาดเคลื่อนไหวเร็ว ยังรู้ว่ากำลังรออะไร และไม่ต้องคิดกติกาใหม่กลางทาง"},{type:"text",text:"Template: 1) บริบทตลาดตอนนี้ 2) โครงสร้างสำคัญ 3) ตำแหน่งราคาที่รอ 4) พฤติกรรมที่ต้องเห็น 5) เงื่อนไขที่จะพิจารณาเข้า 6) จุดที่บอกว่าแผนผิด 7) เป้าหมาย 8) เงื่อนไขที่เลือกไม่เทรด จากนั้น Module ถัดไปจึงค่อยกำหนดว่า หากแผนผิดเราจะยอมเสี่ยงเท่าไร"},{type:"example",label:"ตัวอย่างแผนเต็ม",text:"บริบทขาขึ้น → โครงสร้างยังรักษา Important Low → รอราคากลับเข้า Demand/Discount → ต้องเห็น Sweep Low และกลับขึ้นพร้อมแรงต่อเนื่อง → จึงพิจารณา Long → ถ้าราคากลับลงและยอมรับใต้จุดที่กำหนด แผนผิด → เป้าหมาย Liquidity ด้านบน → ถ้าไม่มีการยืนยัน ไม่เทรด"},
        {type:"example",title:"ตัวอย่างแผน",text:"Context ขาขึ้น → Structure ยังรักษา Important Low → รอ Demand/Discount → ถ้า Sweep Low แล้วกลับขึ้นพร้อมแรงต่อเนื่อง → พิจารณา Long → ถ้ากลับลงและยอมรับใต้จุดที่กำหนด แผนผิด → มองเป้าหมายที่ Liquidity ด้านบน → ถ้าไม่มี Confirmation ไม่เทรด"}
      ], exercises:[
        {id:"tp07-q1",type:"choice",question:"ลำดับใดใกล้กับกระบวนการสร้างแผนของโปรแกรมมากที่สุด?",options:[{id:"a",text:"บริบท → โครงสร้าง → ตำแหน่ง → พฤติกรรม → แผน"},{id:"b",text:"Entry → หาเหตุผล → เพิ่มความเสี่ยง"},{id:"c",text:"Prediction → Entry → Hope"},{id:"d",text:"Indicator → All-in"}],answer:"a",explanation:"ถูกต้อง — Plan เป็นผลจากการอ่านข้อมูลก่อนหน้า ไม่ใช่จุดเริ่มต้น",hint:"Framework หลักของโปรแกรม"},
        {id:"tp07-q2",type:"choice",question:"หลังสร้างแผนที่มี Entry, จุดที่แผนผิด และ Target แล้ว ขั้นถัดไปที่ต้องเรียนคืออะไร?",options:[{id:"a",text:"การจัดการความเสี่ยง"},{id:"b",text:"เพิ่ม Leverage ให้สูงสุด"},{id:"c",text:"ทำนายทุกแท่ง"},{id:"d",text:"เพิ่มจำนวนออเดอร์"}],answer:"a",explanation:"ถูกต้อง — ต่อไปต้องกำหนดว่าหากแผนผิด เราจะยอมเสียเท่าไรและจัด Position อย่างไร",hint:"Framework ขั้นสุดท้าย = Risk"}
      ]},
      { id:"trading-plan-08", order:8, type:"assessment", title:"แบบทดสอบท้าย Module", objective:"ตรวจว่าผู้เรียนสามารถสร้างแผนแบบมีเงื่อนไข รู้จุดยกเลิก และเลือก No Trade ได้", topics:["10 ข้อ","ผ่านเมื่อได้ตั้งแต่ 70%"], questions:[
        {id:"tp-a01",question:"แผนเทรดที่ดีควรมีลักษณะใด?",options:[{id:"a",text:"มีเงื่อนไข ถ้า...จึง..."},{id:"b",text:"ทำนายผลแน่นอน"},{id:"c",text:"ต้องมีออเดอร์ทุกวัน"},{id:"d",text:"เปลี่ยนเหตุผลหลังเข้า"}],answer:"a",explanation:"แผนคือกรอบตัดสินใจตามเงื่อนไข ไม่ใช่คำทำนาย"},
        {id:"tp-a02",question:"ก่อนสร้างแผนควรอ่านอะไร?",options:[{id:"a",text:"บริบท โครงสร้าง ตำแหน่ง และพฤติกรรมราคา"},{id:"b",text:"กำไรที่อยากได้อย่างเดียว"},{id:"c",text:"ข่าวลืออย่างเดียว"},{id:"d",text:"สีแท่งล่าสุดอย่างเดียว"}],answer:"a",explanation:"Framework ก่อน Plan มีข้อมูล 4 ชั้นนี้"},
        {id:"tp-a03",question:"เงื่อนไขก่อนเข้าแบบใดตรวจสอบบนกราฟได้ชัด?",options:[{id:"a",text:"Sweep Low → กลับเหนือระดับ → มีแรงต่อเนื่อง"},{id:"b",text:"รู้สึกว่าจะขึ้น"},{id:"c",text:"อยากเอาคืน"},{id:"d",text:"กลัวตกรถ"}],answer:"a",explanation:"เงื่อนไขควรอิงพฤติกรรมที่สังเกตได้"},
        {id:"tp-a04",question:"จุดที่บอกว่าแผนนี้ผิดหมายถึงอะไร?",options:[{id:"a",text:"ข้อมูลที่ทำให้เหตุผลเดิมใช้ไม่ได้"},{id:"b",text:"จุดกำไรสูงสุด"},{id:"c",text:"จุดเพิ่ม Leverage"},{id:"d",text:"สัญญาณชนะแน่นอน"}],answer:"a",explanation:"Invalidation บอกว่าเมื่อไรควรเลิกยึดแผนเดิม"},
        {id:"tp-a05",question:"เมื่อเงื่อนไขที่ทำให้แผนผิดเกิดขึ้น ควรทำอย่างไร?",options:[{id:"a",text:"ยกเลิกหรือประเมินแผนใหม่"},{id:"b",text:"ฝืนต่อ"},{id:"c",text:"เพิ่ม Position"},{id:"d",text:"ลบเงื่อนไข"}],answer:"a",explanation:"แผนต้องอัปเดตตามข้อมูลตลาด"},
        {id:"tp-a06",question:"Stop Loss ควรสัมพันธ์กับอะไร?",options:[{id:"a",text:"บริเวณที่ทำให้ไอเดียหรือแผนผิด"},{id:"b",text:"ตัวเลขสุ่ม"},{id:"c",text:"จำนวนกำไรเมื่อวาน"},{id:"d",text:"ความรู้สึก"}],answer:"a",explanation:"Stop มีหน้าที่จำกัดผลกระทบเมื่อเหตุผลของแผนไม่เป็นจริง"},
        {id:"tp-a07",question:"ข้อใดเป็นส่วนหนึ่งของแผนเทรดได้?",options:[{id:"a",text:"No Trade เมื่อเงื่อนไขไม่ครบ"},{id:"b",text:"ต้องเข้าเสมอ"},{id:"c",text:"ไล่ราคาเสมอ"},{id:"d",text:"เพิ่มความเสี่ยงหลังแพ้"}],answer:"a",explanation:"การไม่เทรดเป็นการตัดสินใจตามแผนได้"},

      { id:"risk-management-06", order:6, type:"lesson", title:"ผลลัพธ์หนึ่งครั้งไม่ควรเปลี่ยนกติกา", objective:"แยกผลลัพธ์ของออเดอร์ออกจากคุณภาพของกระบวนการ และหลีกเลี่ยงการเพิ่มความเสี่ยงตามอารมณ์", topics:["ชนะ/แพ้หนึ่งครั้ง","ไม่เพิ่ม Risk เพื่อเอาคืน","ความสม่ำเสมอ"], content:[
        {type:"text",text:"ออเดอร์ที่ทำตามแผนสามารถแพ้ได้ และออเดอร์ที่ผิดแผนอาจบังเอิญกำไรได้ ดังนั้นอย่าใช้ผลลัพธ์เพียงครั้งเดียวตัดสินว่ากระบวนการดีหรือแย่"},
        {type:"text",text:"หลังแพ้ ความคิดว่า ‘รอบหน้าต้องเพิ่ม Size เพื่อเอาคืน’ ทำให้ Risk ของระบบเปลี่ยนตามอารมณ์ ส่วนหลังชนะ การเพิ่ม Size เพราะรู้สึกมั่นใจเกินไปก็สร้างปัญหาแบบเดียวกัน"},
        {type:"example",label:"ตัวอย่าง",text:"แผนกำหนด Risk 100 บาทต่อครั้ง → แพ้ -100 บาทหนึ่งครั้ง → ออเดอร์ถัดไปที่ผ่านเงื่อนไขยังใช้ Risk ตามกติกาเดิม ไม่เปลี่ยนเป็น 300 บาทเพียงเพื่อเอาคืน"},
        {type:"example",label:"แยกให้ออก",text:"คุณภาพการตัดสินใจ = ทำตามกระบวนการหรือไม่ | ผลลัพธ์ = ตลาดให้กำไรหรือขาดทุนในครั้งนั้น"}
      ], exercises:[
        {id:"rm06-q1",type:"choice",question:"ออเดอร์ที่ทำตามแผนและคุม Risk ถูกต้องสามารถขาดทุนได้หรือไม่?",options:[{id:"a",text:"ได้ — การทำตามกระบวนการไม่ได้รับประกันผลลัพธ์รายครั้ง"},{id:"b",text:"ไม่ได้ ถ้าถูกระบบต้องชนะทุกครั้ง"},{id:"c",text:"ไม่ได้ถ้าใช้ Stop"},{id:"d",text:"ไม่ได้ถ้า RR สูง"}],answer:"a",explanation:"ถูกต้อง — Risk Management จัดการผลกระทบของความไม่แน่นอน ไม่ได้ลบความไม่แน่นอน",hint:"ระบบที่ดีไม่เท่ากับชนะทุกออเดอร์"},
        {id:"rm06-q2",type:"choice",question:"หลังแพ้หนึ่งครั้ง การเพิ่ม Risk เป็น 3 เท่าเพื่อเอาคืนมีปัญหาหลักอะไร?",options:[{id:"a",text:"ทำให้ความเสี่ยงเปลี่ยนตามอารมณ์และอาจขยายความเสียหาย"},{id:"b",text:"ทำให้ Win Rate เป็น 100%"},{id:"c",text:"ทำให้ Stop แม่นขึ้น"},{id:"d",text:"ไม่มีปัญหา"}],answer:"a",explanation:"ถูกต้อง — การไล่เอาคืนทำลายขอบเขต Risk ที่วางไว้",hint:"คิดว่ากติกาควรเปลี่ยนเพราะผลลัพธ์หนึ่งครั้งหรือไม่"}
      ]},
      { id:"risk-management-07", order:7, type:"lesson", title:"กระบวนการจัดการความเสี่ยงก่อนกดออเดอร์", objective:"รวม Plan และ Risk เป็น Checklist สั้น ๆ ที่ใช้ตรวจสอบก่อน Execute", topics:["Plan → Risk","Stop ก่อน Size","Risk Checklist","พร้อมหรือไม่พร้อม"], content:[
        {type:"text",text:"ก่อนกดออเดอร์ เราควรสามารถตอบคำถามด้าน Risk ได้ครบโดยไม่ต้องเดาระหว่างถือ Position: แผนผิดตรงไหน? Stop อยู่ตรงไหน? ยอมเสียเงินเท่าไร? ด้วย Stop นี้ควรใช้ Position Size เท่าไร? Target มีเหตุผลและคิดเป็นกี่ R? วันนี้ยังเหลือ Risk ตามขีดจำกัดหรือไม่?"},
        {type:"text",text:"ถ้าคำตอบสำคัญยังไม่ชัด แผนยังไม่พร้อม Execute การไม่เข้าออเดอร์จนกว่าจะรู้ Risk ไม่ใช่การพลาดโอกาส แต่เป็นส่วนหนึ่งของกระบวนการ"},
        {type:"example",label:"Checklist ก่อน Execute",text:"1) เหตุผลของแผนชัด → 2) จุดที่แผนผิดชัด → 3) วาง Stop ตามเหตุผล → 4) กำหนดเงินที่เสี่ยง → 5) คำนวณ Position Size → 6) กำหนด Target/Reward → 7) เช็ก Daily Risk → 8) เงื่อนไขครบจึง Execute"},
        {type:"example",label:"Framework ที่เรียนมาถึงตอนนี้",text:"บริบทตลาด → โครงสร้าง → ตำแหน่งราคา → พฤติกรรมราคา → แผน → การจัดการความเสี่ยง"}
      ], exercises:[
        {id:"rm07-q1",type:"choice",question:"ลำดับใดเหมาะสมกว่าก่อน Execute?",options:[{id:"a",text:"หาจุดที่แผนผิด → Stop → Risk Amount → Position Size → Target → เช็ก Daily Risk"},{id:"b",text:"เลือก Position ใหญ่ก่อน → ค่อยหา Stop"},{id:"c",text:"Entry ก่อน → ค่อยคิด Risk"},{id:"d",text:"Target ก่อนทุกอย่าง → ไม่ต้องมี Stop"}],answer:"a",explanation:"ถูกต้อง — Risk ถูกออกแบบก่อน Execute และ Position Size ปรับตาม Stop/เงินที่ยอมเสี่ยง",hint:"อย่าเริ่มจาก Size ที่อยากได้"},
        {id:"rm07-q2",type:"choice",question:"ถ้ายังไม่รู้ว่า Stop อยู่ตรงไหนและถ้าผิดจะเสียเท่าไร ควรทำอย่างไร?",options:[{id:"a",text:"ยังไม่ Execute จนกว่า Risk จะชัด"},{id:"b",text:"เข้าไปก่อนแล้วค่อยคิด"},{id:"c",text:"ใช้ Size สูงสุด"},{id:"d",text:"ไม่ต้องมีแผน"}],answer:"a",explanation:"ถูกต้อง — ถ้า Risk ยังไม่ชัด แผนยังไม่พร้อมสำหรับการ Execute",hint:"Risk เป็นสิ่งที่กำหนดก่อนเข้า"}
      ]},
      { id:"risk-management-08", order:8, type:"assessment", title:"แบบทดสอบท้าย Module", objective:"ตรวจว่าผู้เรียนสามารถเชื่อม Stop, Position Size, Risk/Reward และขีดจำกัดรายวันเข้ากับแผนได้", topics:["10 ข้อ","ผ่านเมื่อได้ตั้งแต่ 70%"], questions:[
        {id:"rm-a01",question:"สิ่งใดควรถูกกำหนดก่อนเข้าเทรด?",options:[{id:"a",text:"จำนวนเงินที่ยอมเสี่ยงหากแผนผิด"},{id:"b",text:"กำไรที่ตลาดต้องให้"},{id:"c",text:"Win Rate ของออเดอร์นี้"},{id:"d",text:"แท่งถัดไปต้องขึ้นหรือลง"}],answer:"a",explanation:"Risk ต่อแผนเป็นสิ่งที่เราสามารถกำหนดล่วงหน้าได้"},
        {id:"rm-a02",question:"Stop Loss ควรสัมพันธ์กับอะไรเป็นหลัก?",options:[{id:"a",text:"จุดที่ทำให้เหตุผลของแผนใช้ไม่ได้"},{id:"b",text:"Position Size ที่อยากใช้"},{id:"c",text:"กำไรเมื่อวาน"},{id:"d",text:"ตัวเลขสุ่ม"}],answer:"a",explanation:"Stop ควรอิง Invalidation ของแผน"},
        {id:"rm-a03",question:"ถ้า Stop กว้างขึ้น แต่ต้องการเสี่ยงเงินเท่าเดิม ควรทำอย่างไรโดยทั่วไป?",options:[{id:"a",text:"ลด Position Size"},{id:"b",text:"เพิ่ม Position Size"},{id:"c",text:"เอา Stop ออก"},{id:"d",text:"เพิ่ม Daily Limit"}],answer:"a",explanation:"Stop Distance มากขึ้นต้องชดเชยด้วย Size ที่เล็กลงเพื่อคุม Risk เดิม"},
        {id:"rm-a04",question:"Risk 100 บาท และ Target 200 บาท เท่ากับ Target กี่ R?",options:[{id:"a",text:"2R"},{id:"b",text:"0.5R"},{id:"c",text:"1R"},{id:"d",text:"10R"}],answer:"a",explanation:"200 ÷ 100 = 2R"},
        {id:"rm-a05",question:"RR สูงหมายความว่า Win Rate สูงเสมอหรือไม่?",options:[{id:"a",text:"ไม่ — RR ไม่ได้บอกโอกาสชนะของออเดอร์"},{id:"b",text:"ใช่เสมอ"},{id:"c",text:"ใช่เฉพาะ Futures"},{id:"d",text:"ใช่เฉพาะ M1"}],answer:"a",explanation:"RR และความน่าจะเป็นของผลลัพธ์เป็นคนละเรื่อง"},
        {id:"rm-a06",question:"Risk ต่อครั้ง 100 บาท, Daily Risk Limit 400 บาท หากแพ้เต็ม Risk ทุกครั้ง จะถึง Limit หลังแพ้กี่ครั้ง?",options:[{id:"a",text:"4 ครั้ง"},{id:"b",text:"2 ครั้ง"},{id:"c",text:"8 ครั้ง"},{id:"d",text:"10 ครั้ง"}],answer:"a",explanation:"400 ÷ 100 = 4 ครั้ง"},
        {id:"rm-a07",question:"เมื่อถึง Daily Risk Limit แล้วควรทำอย่างไร?",options:[{id:"a",text:"หยุดตามกติกาที่กำหนด"},{id:"b",text:"เพิ่ม Size เพื่อเอาคืน"},{id:"c",text:"ยกเลิก Stop"},{id:"d",text:"เทรดจนกว่าจะกลับมากำไร"}],answer:"a",explanation:"Limit มีไว้จำกัดความเสียหายสะสม"},
        {id:"rm-a08",question:"หลังแพ้หนึ่งออเดอร์ การเพิ่ม Risk หลายเท่าเพื่อเอาคืนตรงกับ Risk Management หรือไม่?",options:[{id:"a",text:"ไม่ เพราะทำให้ Risk เปลี่ยนตามอารมณ์"},{id:"b",text:"ใช่เสมอ"},{id:"c",text:"ใช่ถ้าแพ้แค่ครั้งเดียว"},{id:"d",text:"ใช่ถ้า RR สูง"}],answer:"a",explanation:"Risk ที่สม่ำเสมอไม่ควรถูกเปลี่ยนเพียงเพราะอยากเอาคืน"},
        {id:"rm-a09",question:"ข้อใดเป็นลำดับที่สมเหตุสมผลกว่า?",options:[{id:"a",text:"จุดที่แผนผิด → Stop → Risk → Position Size"},{id:"b",text:"Position Size สูงสุด → บีบ Stop"},{id:"c",text:"Entry → ค่อยหาเหตุผล"},{id:"d",text:"กำไรเป้าหมาย → ไม่ต้องคิดขาดทุน"}],answer:"a",explanation:"เริ่มจากเหตุผลของแผนและ Risk ก่อนเลือก Size"},
        {id:"rm-a10",question:"Framework ที่เรียนมาถึง Module นี้คือข้อใด?",options:[{id:"a",text:"บริบทตลาด → โครงสร้าง → ตำแหน่งราคา → พฤติกรรมราคา → แผน → การจัดการความเสี่ยง"},{id:"b",text:"Entry → เพิ่ม Size → หาเหตุผล"},{id:"c",text:"Prediction → Leverage → Hope"},{id:"d",text:"Indicator → Buy/Sell → ไม่ใช้ Stop"}],answer:"a",explanation:"นี่คือกระบวนการหลักที่โปรแกรมสร้างมาตั้งแต่ต้น"}
      ]}
    ]
  }

      { id:"strategy-framework-01", order:1, type:"lesson", title:"จากแนวคิดให้กลายเป็นระบบ", objective:"แยกให้ออกระหว่างไอเดียการเทรดกับระบบที่มีกฎชัดและทำซ้ำได้", topics:["Trading Idea","Trading System","กฎที่ทำซ้ำได้"], content:[

        {type:"text",text:"ระบบไม่จำเป็นต้องซับซ้อน แต่ต้องชัดพอที่จะใช้หลักเดียวกันกับหลายสถานการณ์ เป้าหมายไม่ใช่สร้างกฎที่ชนะทุกครั้ง แต่สร้างกระบวนการตัดสินใจที่ตรวจสอบและทำซ้ำได้"},
        {type:"example",label:"จากไอเดีย → ระบบ",text:"ไอเดีย: ซื้อเมื่อราคาย่อ | ระบบ: 1) ใช้ตลาด/TF ที่กำหนด 2) รอ Context ที่ต้องการ 3) รอ Location 4) รอ Trigger 5) กำหนด Stop/Target/Risk 6) ถ้าเงื่อนไขไม่ครบ = ไม่เทรด"},
        {type:"example",label:"คำถามตรวจระบบ",text:"ถ้าให้คนอื่นอ่านกฎของเรา เขาสามารถบอกได้หรือไม่ว่า ‘เมื่อไรควรทำ’ และ ‘เมื่อไรไม่ควรทำ’"}

        {id:"sf01-q1",type:"choice",question:"ข้อใดใกล้เคียง ‘ระบบเทรด’ มากกว่าแค่ไอเดีย?",options:[{id:"a",text:"มีกฎว่าเทรดตลาดไหน รอสภาพแบบใด เข้าเมื่อเงื่อนไขอะไร และจัดการ Risk อย่างไร"},{id:"b",text:"รู้สึกว่าราคาน่าจะขึ้น"},{id:"c",text:"ซื้อเวลาราคาดูน่าสนใจ"},{id:"d",text:"ดูกราฟแล้วตัดสินใจตามอารมณ์"}],answer:"a",explanation:"ถูกต้อง — ระบบต้องเปลี่ยนแนวคิดให้เป็นเงื่อนไขที่สังเกตและทำซ้ำได้",hint:"มองหาคำตอบที่มีเงื่อนไขและกระบวนการ"},
        {id:"sf01-q2",type:"choice",question:"ระบบที่ดีจำเป็นต้องชนะทุกออเดอร์หรือไม่?",options:[{id:"a",text:"ไม่ — หน้าที่ของระบบคือสร้างกระบวนการที่ชัดและทดสอบได้ ไม่ใช่รับประกันผลรายครั้ง"},{id:"b",text:"ใช่ ต้องชนะทุกครั้ง"},{id:"c",text:"ใช่ถ้ามีกฎเยอะพอ"},{id:"d",text:"ใช่ถ้าใช้ Indicator หลายตัว"}],answer:"a",explanation:"ถูกต้อง — ระบบช่วยให้ตัดสินใจสม่ำเสมอ แต่ตลาดยังมีความไม่แน่นอน",hint:"แยกกระบวนการออกจากผลลัพธ์หนึ่งครั้ง"}
      ]},
      { id:"strategy-framework-02", order:2, type:"lesson", title:"ขั้นที่ 1 — กำหนดสนามที่เราจะเล่น", objective:"กำหนดตลาด ช่วงเวลา และ Timeframe ให้ชัดก่อนสร้างกฎส่วนอื่น", topics:["Market","Trading Session","Timeframe","Scope"], content:[
        {type:"text",text:"ระบบควรเริ่มจากการกำหนดขอบเขตว่าเราจะใช้มันกับอะไร เพราะพฤติกรรมและรายละเอียดของแต่ละตลาดหรือ Timeframe อาจต่างกัน การบอกว่า ‘ใช้ได้ทุกตลาด ทุกเวลา’ ทำให้การทดสอบกฎคลุมเครือเกินไปสำหรับระบบแรก"},
        {type:"text",text:"อย่างน้อยให้ตอบได้ว่า: เทรดตลาดอะไร? ใช้ Timeframe ไหนในการตัดสินใจ? มีช่วงเวลาที่จะเทรดหรือไม่? ข้อกำหนดเหล่านี้ไม่ใช่สัญญาณเข้า แต่เป็นสนามที่ระบบอนุญาตให้เรามองหาโอกาส"},
        {type:"example",label:"ตัวอย่าง",text:"ตลาด: Gold | Timeframe หลัก: M5 | ช่วงเวลาที่พิจารณา: ช่วงที่ผู้เรียนกำหนดไว้ล่วงหน้า → จากนั้นจึงไปดู Context และ Setup"},
        {type:"example",label:"หลักคิด",text:"ยิ่ง Scope ชัด การเก็บข้อมูลและตรวจว่าระบบทำงานอย่างไรก็ยิ่งง่าย"}
      ], exercises:[
        {id:"sf02-q1",type:"choice",question:"เหตุใดควรกำหนดตลาดและ Timeframe ของระบบให้ชัด?",options:[{id:"a",text:"เพื่อกำหนดขอบเขตเดียวกันในการใช้และทดสอบกฎ"},{id:"b",text:"เพื่อรับประกันกำไร"},{id:"c",text:"เพื่อไม่ต้องมี Stop"},{id:"d",text:"เพื่อทำนายแท่งถัดไป"}],answer:"a",explanation:"ถูกต้อง — Scope ที่ชัดทำให้เรารู้ว่ากำลังใช้ระบบภายใต้เงื่อนไขใด",hint:"คิดถึงการทำซ้ำและการเก็บข้อมูล"},
        {id:"sf02-q2",type:"choice",question:"ข้อใดเป็นการกำหนด Scope ที่ชัดกว่า?",options:[{id:"a",text:"เทรด Gold บน M5 ในช่วงเวลาที่กำหนดไว้"},{id:"b",text:"เทรดอะไรก็ได้เมื่อรู้สึกอยากเทรด"},{id:"c",text:"เปลี่ยน Timeframe ทุกครั้งที่แพ้"},{id:"d",text:"เลือกตลาดหลังเห็นสัญญาณ"}],answer:"a",explanation:"ถูกต้อง — ระบุตลาด Timeframe และขอบเขตการใช้งานไว้ก่อน",hint:"มองหากติกาที่กำหนดล่วงหน้า"}
      ]},
      { id:"strategy-framework-03", order:3, type:"lesson", title:"ขั้นที่ 2 — กำหนดสภาพตลาดที่ระบบต้องการ", objective:"กำหนด Context ที่ระบบอนุญาตให้มองหา Setup และสภาพที่ควรงด", topics:["Context Rule","Allowed Condition","No Trade Condition"], content:[
        {type:"text",text:"ระบบไม่จำเป็นต้องเทรดทุกสภาพตลาด เราสามารถกำหนดได้ว่าระบบนี้สร้างขึ้นสำหรับตลาดแบบใด เช่น Directional, Range หรือ Transition ตามสิ่งที่เรียนใน Module 3"},
        {type:"text",text:"กฎ Context ควรบอกทั้งสิ่งที่อนุญาตและสิ่งที่ไม่อนุญาต เช่น ‘มองหา Setup เฉพาะเมื่อ Context เป็น Directional และ Structure ยังสอดคล้องกัน; ถ้า Transition/ไม่ชัด = No Trade’"},
        {type:"example",label:"ตัวอย่างกฎ",text:"ถ้า Context = Directional ขึ้น → อนุญาตให้มองหาแผนฝั่ง Long | ถ้า Context = Transition → ไม่เปิด Setup ใหม่จนกว่าจะอ่านสภาพได้ชัดขึ้น"},
        {type:"example",label:"อย่าสับสน",text:"Context ไม่ใช่ Entry — มันเพียงบอกว่าสภาพปัจจุบันตรงกับสนามที่ระบบต้องการหรือไม่"}
      ], exercises:[
        {id:"sf03-q1",type:"choice",question:"กฎ Context มีหน้าที่หลักอะไร?",options:[{id:"a",text:"กรองว่าสภาพตลาดปัจจุบันตรงกับระบบหรือควร No Trade"},{id:"b",text:"บอกจุด Entry ที่แน่นอน"},{id:"c",text:"รับประกันทิศทาง"},{id:"d",text:"กำหนดกำไรต่อวัน"}],answer:"a",explanation:"ถูกต้อง — Context เป็นตัวกรองสภาพ ไม่ใช่ Trigger เข้า",hint:"ย้อนกลับไป Framework: Context มาก่อน Location/Behavior"},
        {id:"sf03-q2",type:"choice",question:"ถ้าระบบกำหนดว่าเทรดเฉพาะ Directional Context แต่ตอนนี้ตลาดอยู่ใน Transition ควรทำอย่างไร?",options:[{id:"a",text:"No Trade ตามกฎจนกว่าสภาพจะตรงกับระบบ"},{id:"b",text:"บังคับหา Entry"},{id:"c",text:"เพิ่ม Leverage"},{id:"d",text:"เปลี่ยนกฎทันที"}],answer:"a",explanation:"ถูกต้อง — ระบบต้องบอกได้ว่าเมื่อไรไม่ควรเล่น",hint:"กฎที่ดีต้องมีเงื่อนไข No Trade"}
      ]},
      { id:"strategy-framework-04", order:4, type:"lesson", title:"ขั้นที่ 3 — กำหนด Setup และพื้นที่ที่รอ", objective:"เปลี่ยนคำว่า ‘รอโอกาส’ ให้เป็นเงื่อนไขที่ระบุ Structure และ Location ที่สนใจได้", topics:["Setup","Structure","Location","เงื่อนไขก่อน Trigger"], content:[
        {type:"text",text:"หลัง Context ผ่าน ระบบต้องบอกว่าเรากำลังรออะไร Setup คือชุดเงื่อนไขก่อนเข้า เช่น Structure แบบใดต้องยังคงอยู่ และราคาต้องเข้ามาที่ Location ประเภทใดก่อนที่เราจะเริ่มมองหา Trigger"},
        {type:"text",text:"อย่าเขียนกฎกว้างเกินไป เช่น ‘รอราคามาถึงจุดดี ๆ’ เพราะไม่สามารถตรวจย้อนหลังได้ ให้เปลี่ยนเป็นสิ่งที่สังเกตได้ เช่น ‘รอราคากลับมาบริเวณ Important Level ที่กำหนดจาก Structure’"},
        {type:"example",label:"ตัวอย่างโครง Setup",text:"Context ผ่าน → Structure ยังสนับสนุนแนวคิด → ราคากลับเข้า Location ที่ระบบกำหนด → ตอนนี้จึงเริ่มรอพฤติกรรมราคา ไม่ใช่เข้าออเดอร์ทันที"},
        {type:"example",label:"จำง่าย ๆ",text:"Setup บอกว่า ‘ฉันสนใจสถานการณ์นี้’ แต่ Trigger จะบอกว่า ‘ตอนนี้เงื่อนไขสำหรับการกระทำเกิดแล้ว’"}
      ], exercises:[
        {id:"sf04-q1",type:"choice",question:"ข้อใดเป็นกฎ Setup ที่ตรวจสอบได้ชัดกว่า?",options:[{id:"a",text:"รอ Structure ที่กำหนดและให้ราคากลับเข้า Location ที่ระบุไว้"},{id:"b",text:"รอจุดที่ดูสวย"},{id:"c",text:"เข้าเมื่อรู้สึกว่าถูก"},{id:"d",text:"เข้าเมื่อกลัวพลาด"}],answer:"a",explanation:"ถูกต้อง — Setup ควรประกอบจากเงื่อนไขที่มองเห็นและตรวจย้อนหลังได้",hint:"เลือกสิ่งที่คนอื่นอ่านแล้วตรวจบนกราฟได้"},
        {id:"sf04-q2",type:"choice",question:"เมื่อราคามาถึง Location ที่ระบบสนใจ ควรถือว่าเป็น Entry ทันทีหรือไม่?",options:[{id:"a",text:"ไม่จำเป็น — ถ้าระบบกำหนด Trigger ต้องรอพฤติกรรมที่ต้องการก่อน"},{id:"b",text:"ใช่ทุกครั้ง"},{id:"c",text:"ใช่ถ้า Location วาดสวย"},{id:"d",text:"ใช่ถ้าราคาเคลื่อนเร็ว"}],answer:"a",explanation:"ถูกต้อง — Location เป็นพื้นที่เฝ้าดู ส่วน Trigger เป็นเงื่อนไขสำหรับการกระทำ",hint:"แยก Location ออกจาก Price Behavior"}
      ]},
      { id:"strategy-framework-05", order:5, type:"lesson", title:"ขั้นที่ 4 — กำหนด Trigger ให้รู้ว่าเมื่อไรจึงลงมือ", objective:"เขียนเงื่อนไข Entry จากพฤติกรรมราคาที่สังเกตได้ แทนการใช้ความรู้สึก", topics:["Trigger","Price Behavior","Entry Rule","Confirmation"], content:[
        {type:"text",text:"Trigger คือเหตุการณ์หรือชุดพฤติกรรมที่ระบบกำหนดไว้ว่า เมื่อ Context + Setup ผ่านแล้ว เราจึงอนุญาตให้พิจารณา Entry ตัว Trigger ต้องชัดพอที่จะตอบได้ว่า ‘เกิดแล้ว’ หรือ ‘ยังไม่เกิด’"},
        {type:"text",text:"Trigger อาจใช้ Break, Rejection, Sweep, Retest หรือพฤติกรรมอื่นที่ผู้เรียนเลือก แต่ต้องกำหนดความหมายของตัวเองให้ชัด ไม่ใช่เปลี่ยนคำจำกัดความตามกราฟแต่ละครั้ง"},
        {type:"example",label:"ตัวอย่าง",text:"ราคาเข้า Location → เกิดการกวาดระดับที่กำหนด → กลับเข้าพื้นที่ → มีแรงต่อเนื่องตามเงื่อนไขของระบบ = Trigger ครบ | ถ้าขาดส่วนใดส่วนหนึ่ง = รอต่อหรือ No Trade"},
        {type:"example",label:"ทดสอบความชัด",text:"แทนคำว่า ‘ดูเหมือนจะกลับตัว’ ด้วยคำอธิบายว่าต้องเกิดอะไรบนกราฟจึงถือว่า Trigger ผ่าน"}
      ], exercises:[
        {id:"sf05-q1",type:"choice",question:"Trigger ที่ดีควรมีลักษณะอย่างไร?",options:[{id:"a",text:"เป็นเงื่อนไขที่สังเกตได้และตัดสินได้ว่าเกิดหรือยังไม่เกิด"},{id:"b",text:"เปลี่ยนความหมายตามอารมณ์"},{id:"c",text:"ใช้คำว่า ‘น่าจะ’ อย่างเดียว"},{id:"d",text:"เกิดหลังเข้าออเดอร์ก็ได้"}],answer:"a",explanation:"ถูกต้อง — Trigger ต้องลดความคลุมเครือของการตัดสินใจ",hint:"ระบบต้องสามารถตรวจย้อนหลังได้"},
        {id:"sf05-q2",type:"choice",question:"Context และ Location ผ่าน แต่ Trigger ที่ระบบกำหนดยังไม่เกิด ควรทำอย่างไร?",options:[{id:"a",text:"รอ — ยังไม่ Execute จนกว่าเงื่อนไขจะครบ"},{id:"b",text:"เข้าเพราะกลัวพลาด"},{id:"c",text:"ลบ Trigger ออกจากระบบทันที"},{id:"d",text:"เพิ่ม Size"}],answer:"a",explanation:"ถูกต้อง — ระบบมีคุณค่าเมื่อกฎมีผลต่อการตัดสินใจจริง",hint:"เงื่อนไขไม่ครบ = ยังไม่ถึงขั้น Execute"}
      ]},
      { id:"strategy-framework-06", order:6, type:"lesson", title:"กำหนด Exit และ Risk ให้เป็นส่วนหนึ่งของระบบ", objective:"ทำให้ระบบครอบคลุมสิ่งที่เกิดหลัง Entry ไม่ใช่มีเพียงสัญญาณเข้า", topics:["Invalidation","Stop","Target","Position Size","Daily Risk"], content:[
        {type:"text",text:"ระบบที่มีเพียง Entry ยังไม่สมบูรณ์ ก่อน Execute ต้องรู้ด้วยว่าอะไรทำให้แผนผิด, Stop อยู่ที่ไหน, Target อิงอะไร, ยอมเสี่ยงเท่าไร และ Position Size เท่าไรตามกฎ Risk ที่เรียนใน Module 8"},
        {type:"text",text:"Exit และ Risk ควรถูกกำหนดด้วยหลักเดียวกันทุกครั้งที่ Setup ประเภทเดียวกันเกิดขึ้น หากกฎเปลี่ยนหลังเข้าเพียงเพราะไม่อยากแพ้ เราไม่ได้กำลังใช้ระบบเดิมแล้ว"},
        {type:"example",label:"โครงกฎหลัง Trigger",text:"Trigger ผ่าน → กำหนด Entry → Stop ที่จุดซึ่งทำให้เหตุผลของแผนใช้ไม่ได้ → Target ที่ Reference/Location ตามกฎ → คำนวณ Position จาก Risk → เช็ก Daily Limit → จึง Execute"},
        {type:"example",label:"ระบบต้องตอบได้",text:"ถ้าผิด ฉันออกตรงไหน? ถ้าถูก ฉันจัดการเป้าหมายอย่างไร? ครั้งนี้ฉันยอมเสี่ยงเท่าไร?"}
      ], exercises:[
        {id:"sf06-q1",type:"choice",question:"เหตุใดระบบที่มีแต่กฎ Entry จึงยังไม่สมบูรณ์?",options:[{id:"a",text:"เพราะยังไม่กำหนดว่าเมื่อผิด/ถูกจะออกอย่างไรและจะเสี่ยงเท่าไร"},{id:"b",text:"เพราะต้องมี Indicator อย่างน้อย 5 ตัว"},{id:"c",text:"เพราะต้องเทรดทุกวัน"},{id:"d",text:"เพราะต้องมี Win Rate 100%"}],answer:"a",explanation:"ถูกต้อง — Entry, Exit และ Risk เป็นส่วนของระบบเดียวกัน",hint:"คิดถึงสิ่งที่เกิดหลังเข้า Position"},
        {id:"sf06-q2",type:"choice",question:"หลังเข้าแล้วราคาใกล้ Stop และเราเลื่อน Stop ให้ไกลขึ้นเพียงเพราะไม่อยากขาดทุน ทั้งที่กฎไม่ได้อนุญาต หมายความว่าอะไร?",options:[{id:"a",text:"เรากำลังออกนอกกฎของระบบ"},{id:"b",text:"ระบบแม่นขึ้น"},{id:"c",text:"Risk ลดลงเสมอ"},{id:"d",text:"ไม่มีผลต่อระบบ"}],answer:"a",explanation:"ถูกต้อง — กฎ Exit/Risk ต้องมีผลจริง ไม่ใช่เปลี่ยนเมื่อผลลัพธ์ไม่ถูกใจ",hint:"ถามว่าการกระทำนั้นอยู่ในกฎที่กำหนดก่อน Entry หรือไม่"}
      ]},
      { id:"strategy-framework-07", order:7, type:"lesson", title:"ประกอบระบบเป็นขั้นตอน 1 → 2 → 3 → 4", objective:"สามารถเขียนระบบเทรดของตัวเองเป็นลำดับสั้น ชัด และพร้อมนำไปทดสอบ", topics:["1 Context","2 Setup/Location","3 Trigger","4 Execute & Risk","No Trade Rule"], content:[
        {type:"text",text:"ตอนนี้เราสามารถย่อระบบให้เหลือกระบวนการ 4 ขั้นได้ โดยรายละเอียดภายในแต่ละขั้นขึ้นอยู่กับแนวทางที่ผู้เรียนเลือก แต่โครงต้องชัดและไม่เปลี่ยนไปมาตามอารมณ์"},
        {type:"example",label:"SYSTEM 1 → 2 → 3 → 4",text:"1) สภาพตลาด: ตลาด/TF และ Context ตรงกับระบบหรือไม่ → 2) Setup: Structure + Location ที่ต้องการเกิดหรือยัง → 3) Trigger: พฤติกรรมราคาที่กำหนดเกิดหรือยัง → 4) Execute: Entry + จุดที่แผนผิด/Stop + Target + Position Size + Risk Limit"},
        {type:"text",text:"เพิ่มกฎสำคัญอีกหนึ่งบรรทัด: ถ้าขั้นใดไม่ผ่าน = ไม่ไปขั้นถัดไป และถ้าเงื่อนไขไม่ครบ = No Trade นี่ทำให้ระบบกลายเป็น Decision Process แทนการหาเหตุผลเข้าตลาดย้อนหลัง"},
        {type:"example",label:"Template สำหรับเขียนระบบของตัวเอง",text:"ตลาด/TF: ___ | 1 Context: ___ | 2 Setup/Location: ___ | 3 Trigger: ___ | 4 Entry/Stop/Target/Risk: ___ | No Trade เมื่อ: ___"},
        {type:"example",label:"ตรวจครั้งสุดท้าย",text:"ตัดคำคลุมเครือ เช่น ‘ดูดี’, ‘น่าจะ’, ‘ทรงมา’, ‘รู้สึกว่า’ แล้วแทนด้วยเงื่อนไขที่สังเกตได้ ถ้ายังเขียนไม่ได้ แปลว่าส่วนนั้นยังต้องนิยามเพิ่ม"},
        {type:"text",text:"ระบบที่เขียนเสร็จในขั้นนี้ยังไม่ควรถูกสรุปว่าใช้งานได้ดีเพียงเพราะฟังดูสมเหตุสมผล ขั้นต่อไปคือเอากฎเดียวกันไปทดสอบกับข้อมูลย้อนหลัง เพื่อดูว่ามันทำงานจริงอย่างไร"}
      ], exercises:[
        {id:"sf07-q1",type:"choice",question:"ลำดับ 1 → 2 → 3 → 4 ใดตรงกับ Framework ของ Module นี้มากที่สุด?",options:[{id:"a",text:"Context → Setup/Location → Trigger → Execute & Risk"},{id:"b",text:"Entry → ความรู้สึก → เพิ่ม Size → หาเหตุผล"},{id:"c",text:"Target → Entry → Context → Stop"},{id:"d",text:"Prediction → Leverage → Hope → Revenge"}],answer:"a",explanation:"ถูกต้อง — เรากรองจากสภาพตลาด ไป Setup ไป Trigger แล้วจึง Execute พร้อม Risk",hint:"เริ่มจากภาพรวมก่อนการกระทำ"},
        {id:"sf07-q2",type:"choice",question:"ถ้า Setup อยู่ใน Location ที่ต้องการ แต่ Trigger ยังไม่เกิด ระบบควรทำอะไร?",options:[{id:"a",text:"หยุดที่ขั้นนั้นและรอ ไม่ข้ามไป Execute"},{id:"b",text:"เข้าเลยเพราะผ่านไป 2 ขั้นแล้ว"},{id:"c",text:"เพิ่ม Position เพื่อชดเชย"},{id:"d",text:"ถือว่า Trigger ผ่านอัตโนมัติ"}],answer:"a",explanation:"ถูกต้อง — แต่ละขั้นเป็นเงื่อนไข ถ้าไม่ผ่านก็ไม่ไปขั้นถัดไป",hint:"ระบบ 1→2→3→4 ไม่ใช่ Checklist ที่ข้ามข้อได้ตามใจ"}
      ]},
      { id:"strategy-framework-08", order:8, type:"assessment", title:"แบบทดสอบท้าย Module", objective:"ตรวจว่าผู้เรียนสามารถเปลี่ยนแนวคิดเป็นระบบที่มีกฎ 1 → 2 → 3 → 4 ชัดเจนได้", topics:["10 ข้อ","ผ่านเมื่อได้ตั้งแต่ 70%"], questions:[
        {id:"sf-a01",question:"อะไรคือความต่างสำคัญระหว่าง Trading Idea กับ Trading System?",options:[{id:"a",text:"System มีกฎและเงื่อนไขที่ทำซ้ำและตรวจสอบได้"},{id:"b",text:"System ต้องมี Indicator มากกว่า"},{id:"c",text:"Idea ใช้ Stop แต่ System ไม่ใช้"},{id:"d",text:"ไม่มีความต่าง"}],answer:"a",explanation:"ระบบเปลี่ยนแนวคิดให้เป็นกระบวนการตัดสินใจที่ชัด"},
        {id:"sf-a02",question:"เหตุใดต้องกำหนดตลาด/Timeframe ของระบบ?",options:[{id:"a",text:"เพื่อกำหนด Scope ที่ใช้และทดสอบกฎอย่างสม่ำเสมอ"},{id:"b",text:"เพื่อรับประกันกำไร"},{id:"c",text:"เพื่อไม่ต้องมี Risk"},{id:"d",text:"เพื่อรู้แท่งถัดไป"}],answer:"a",explanation:"Scope ช่วยให้รู้ว่ากฎถูกออกแบบสำหรับบริบทใด"},
        {id:"sf-a03",question:"Context ในระบบมีหน้าที่อะไร?",options:[{id:"a",text:"กรองว่าสภาพตลาดตรงกับสิ่งที่ระบบอนุญาตหรือไม่"},{id:"b",text:"เป็น Entry ทุกครั้ง"},{id:"c",text:"กำหนด Lot โดยตรง"},{id:"d",text:"รับประกัน Direction"}],answer:"a",explanation:"Context เป็นตัวกรองสภาพก่อนหา Setup"},
        {id:"sf-a04",question:"Setup ควรอธิบายอะไร?",options:[{id:"a",text:"เงื่อนไข Structure/Location ที่ต้องเกิดก่อนเริ่มรอ Trigger"},{id:"b",text:"กำไรที่อยากได้วันนี้"},{id:"c",text:"อารมณ์ตอนเปิดกราฟ"},{id:"d",text:"จำนวนครั้งที่ต้องชนะ"}],answer:"a",explanation:"Setup ระบุสถานการณ์ที่ระบบสนใจ"},
        {id:"sf-a05",question:"Trigger ที่ชัดควรเป็นอย่างไร?",options:[{id:"a",text:"สังเกตได้และตัดสินได้ว่าเกิดหรือยังไม่เกิด"},{id:"b",text:"ขึ้นกับความรู้สึก"},{id:"c",text:"เปลี่ยนนิยามทุกครั้ง"},{id:"d",text:"ไม่จำเป็นต้องเกิดก่อน Entry"}],answer:"a",explanation:"Trigger ต้องทำให้กฎการลงมือชัดและตรวจสอบได้"},
        {id:"sf-a06",question:"Context + Setup ผ่าน แต่ Trigger ไม่เกิด ควรทำอย่างไร?",options:[{id:"a",text:"รอหรือ No Trade ไม่ข้ามไป Execute"},{id:"b",text:"เข้าเพราะกลัวพลาด"},{id:"c",text:"เพิ่ม Risk"},{id:"d",text:"ลบ Trigger"}],answer:"a",explanation:"เงื่อนไขไม่ครบไม่ควรข้ามขั้น"},

        {id:"sf-a08",question:"ข้อใดเป็นลำดับหลักของ Module 9?",options:[{id:"a",text:"Context → Setup/Location → Trigger → Execute & Risk"},{id:"b",text:"Execute → Context → Hope → Risk"},{id:"c",text:"Risk → Revenge → Entry → Prediction"},{id:"d",text:"Indicator → Entry → เพิ่ม Size → ไม่ใช้ Stop"}],answer:"a",explanation:"นี่คือโครง 1 → 2 → 3 → 4 สำหรับสร้างระบบ"},
        {id:"sf-a09",question:"กฎ ‘ถ้าเงื่อนไขไม่ครบ = No Trade’ มีประโยชน์อย่างไร?",options:[{id:"a",text:"ป้องกันการข้ามกฎเพียงเพราะอยากมีออเดอร์"},{id:"b",text:"ทำให้ชนะทุกครั้ง"},{id:"c",text:"ทำให้ไม่ต้องใช้ Stop"},{id:"d",text:"ทำให้ตลาดเคลื่อนตามแผน"}],answer:"a",explanation:"No Trade เป็นผลลัพธ์ที่ถูกต้องเมื่อระบบยังไม่ให้สิทธิ์ Execute"},
        {id:"sf-a10",question:"หลังเขียนระบบ 1 → 2 → 3 → 4 ได้ชัดแล้ว ขั้นถัดไปที่สมเหตุสมผลคืออะไร?",options:[{id:"a",text:"นำกฎไป Backtest กับข้อมูลย้อนหลัง"},{id:"b",text:"เพิ่มเงินจริงทันทีโดยไม่ทดสอบ"},{id:"c",text:"เปลี่ยนกฎทุกวัน"},{id:"d",text:"สรุปว่าระบบกำไรแน่นอน"}],answer:"a",explanation:"กฎที่เขียนได้เป็นเพียงสมมติฐาน ขั้นต่อไปต้องทดสอบอย่างเป็นระบบ"}
      ]}
    ]
  }

  {

    lessons: [
      { id:"backtesting-01", order:1, type:"lesson", title:"Backtesting คืออะไร", objective:"เข้าใจว่า Backtesting คือการนำกฎเดิมไปทดสอบกับข้อมูลอดีตอย่างสม่ำเสมอ ไม่ใช่การหาเหตุผลย้อนหลัง", topics:["Backtesting","Historical Data","กฎเดิม","Hindsight Bias"], content:[
        {type:"text",text:"Backtesting คือการนำระบบที่เขียนไว้แล้วไปตรวจบนข้อมูลราคาในอดีต โดยใช้กฎเดียวกันกับทุกตัวอย่าง จุดประสงค์คือเก็บหลักฐานว่าระบบมีพฤติกรรมอย่างไร ไม่ใช่พิสูจน์ว่าระบบต้องกำไรแน่นอน"},
        {type:"text",text:"สิ่งที่ต้องระวังคือการเห็นอนาคตของกราฟแล้วค่อยเลือกเฉพาะจุดที่สวย หรือเปลี่ยนเหตุผลให้เข้ากับผลลัพธ์ วิธีนี้ทำให้ข้อมูลดูดีเกินจริง เพราะตอนเทรดจริงเราไม่รู้อนาคต"},
        {type:"example",label:"หลักคิด",text:"เขียนกฎก่อน → เลื่อนข้อมูลทีละช่วงโดยไม่ใช้ข้อมูลอนาคต → เมื่อเงื่อนไข 1→2→3→4 ครบจึงบันทึก Trade → ใช้กฎ Exit/Risk เดิมจนจบตัวอย่าง"},
        {type:"example",label:"Backtest ไม่ได้ตอบ",text:"มันไม่ได้บอกว่า Trade ถัดไปจะชนะ แต่ช่วยให้เราเห็นสถิติและข้อจำกัดของระบบจากตัวอย่างในอดีต"}
      ], exercises:[
        {id:"bt01-q1",type:"choice",question:"ข้อใดอธิบาย Backtesting ได้ถูกต้องที่สุด?",options:[{id:"a",text:"นำกฎที่กำหนดไว้แล้วไปใช้กับข้อมูลอดีตอย่างสม่ำเสมอและบันทึกผล"},{id:"b",text:"เปิดกราฟย้อนหลังแล้วเลือกเฉพาะจุดที่เห็นว่าชนะ"},{id:"c",text:"เปลี่ยนกฎทุกครั้งเมื่อเจอ Loss"},{id:"d",text:"ใช้ข้อมูลอนาคตช่วยตัดสิน Entry"}],answer:"a",explanation:"ถูกต้อง — Backtest ต้องทดสอบกฎเดิม ไม่ใช่เลือกผลลัพธ์ที่ชอบ",hint:"คิดว่าถ้าอยู่ ณ เวลานั้น เราควรรู้ข้อมูลได้แค่ไหน"},
        {id:"bt01-q2",type:"choice",question:"เหตุใดการเห็นกราฟอนาคตแล้วค่อยเลือก Entry จึงเป็นปัญหา?",options:[{id:"a",text:"เพราะใช้ข้อมูลที่ตอนเทรดจริงเรายังไม่สามารถรู้ได้ ทำให้ผลทดสอบลำเอียง"},{id:"b",text:"เพราะทำให้กราฟเปลี่ยนสี"},{id:"c",text:"เพราะทำให้ Spread หายไป"},{id:"d",text:"เพราะ Win Rate ต้องเป็น 50% เสมอ"}],answer:"a",explanation:"ถูกต้อง — เราต้องจำลองการตัดสินใจด้วยข้อมูลที่มีอยู่ ณ เวลานั้น",hint:"ระวัง Hindsight หรือการรู้ผลล่วงหน้า"}
      ]},
      { id:"backtesting-02", order:2, type:"lesson", title:"ล็อกกฎก่อนเริ่มทดสอบ", objective:"เตรียม Trading System ให้ชัดพอที่จะตัดสินแต่ละตัวอย่างด้วยกฎเดียวกัน", topics:["System Rules","Entry","Stop","Target","No Trade"], content:[
        {type:"text",text:"ก่อนเริ่ม Backtest ระบบจาก Module 9 ต้องเขียนให้ชัดพอว่า 1) Context แบบไหน 2) Setup/Location แบบไหน 3) Trigger คืออะไร 4) Entry, Stop, Target และ Risk ใช้กฎอะไร รวมถึง No Trade เมื่อใด"},
        {type:"text",text:"ถ้าระหว่างทดสอบพบว่ากฎคลุมเครือ ให้จดปัญหาไว้ การปรับกฎทำได้ แต่เมื่อเปลี่ยนกฎแล้วควรถือว่าเป็น Version ใหม่และเริ่มเก็บชุดข้อมูลใหม่ เพื่อไม่เอาผลจากกฎคนละแบบมาปนกัน"},
        {type:"example",label:"ตัวอย่าง Version",text:"System V1: Trigger ต้องมี A+B → ทดสอบ 50 ตัวอย่าง | ถ้าปรับเป็น A+B+C ให้เรียก V2 แล้วเริ่มชุดข้อมูล V2 ใหม่"},
        {type:"example",label:"เช็กก่อนเริ่ม",text:"ถ้าเจอกราฟหนึ่งภาพแล้วเรายังตอบไม่ได้ว่า ‘Trade / No Trade’ จากกฎ แปลว่ากฎส่วนนั้นยังต้องนิยามเพิ่ม"}
      ], exercises:[
        {id:"bt02-q1",type:"choice",question:"ก่อนเริ่ม Backtest สิ่งใดควรชัดก่อน?",options:[{id:"a",text:"Context, Setup, Trigger, Entry/Exit/Risk และ No Trade Rule"},{id:"b",text:"กำไรที่อยากได้จากผลทดสอบ"},{id:"c",text:"จำนวน Trade ที่ต้องชนะ"},{id:"d",text:"เลือกเฉพาะวันที่ตลาดวิ่งสวย"}],answer:"a",explanation:"ถูกต้อง — ต้องล็อกกฎก่อนจึงจะวัดสิ่งเดียวกันได้",hint:"ย้อนกลับไป Framework 1→2→3→4"},
        {id:"bt02-q2",type:"choice",question:"ทดสอบไป 30 Trade แล้วเปลี่ยน Trigger อย่างมีนัยสำคัญ ควรทำอย่างไรกับการเก็บข้อมูล?",options:[{id:"a",text:"ถือเป็น Version ใหม่และเริ่มชุดทดสอบใหม่ ไม่ปนผลกับกฎเดิม"},{id:"b",text:"รวมทั้งหมดทันทีเพราะชื่อระบบเหมือนเดิม"},{id:"c",text:"ลบเฉพาะ Loss ของกฎเก่า"},{id:"d",text:"แก้ผลย้อนหลังให้ตรงกฎใหม่"}],answer:"a",explanation:"ถูกต้อง — เมื่อกฎเปลี่ยน เรากำลังทดสอบระบบคนละ Version",hint:"ข้อมูลที่เปรียบเทียบกันควรมาจากกฎชุดเดียวกัน"}
      ]},
      { id:"backtesting-03", order:3, type:"lesson", title:"เก็บ Trade ให้เป็นข้อมูล", objective:"รู้ว่าควรบันทึกอะไรเพื่อให้ผล Backtest ตรวจสอบและนำมาวิเคราะห์ต่อได้", topics:["Trade Log","Screenshot","R Result","Context","Notes"], content:[
        {type:"text",text:"Backtest ที่ดีไม่ควรจบด้วยคำว่า ‘น่าจะชนะเยอะ’ แต่ต้องมี Trade Log แต่ละแถวควรบอกอย่างน้อย วันที่/ลำดับ, ตลาดและ Timeframe, Context, Setup, Trigger, Entry, Stop, Target และผลลัพธ์"},
        {type:"text",text:"การเก็บผลเป็นหน่วย R ช่วยเปรียบเทียบ Trade ที่มีขนาดเงินต่างกันได้ง่ายขึ้น เช่น -1R หมายถึงเสียเท่าความเสี่ยงที่กำหนดไว้หนึ่งหน่วย และ +2R หมายถึงได้สองเท่าของ 1R ตามกฎของ Trade นั้น"},
        {type:"example",label:"ตัวอย่าง Trade Log",text:"#12 | Context: Directional | Setup: ผ่าน | Trigger: ผ่าน | Entry: ตามกฎ | Stop: ตามจุดที่แผนผิด | Target: ตามกฎ | Result: +2R | Screenshot: ก่อน/หลัง"},
        {type:"example",label:"เก็บ No Trade ด้วยเมื่อมีประโยชน์",text:"ถ้ามี Setup เกือบครบแต่ขาด Trigger การจดว่า No Trade เพราะอะไรช่วยตรวจว่าตัวเองทำตามกฎจริงหรือไม่"}
      ], exercises:[
        {id:"bt03-q1",type:"choice",question:"ข้อใดเป็น Trade Log ที่มีประโยชน์ต่อการวิเคราะห์มากกว่า?",options:[{id:"a",text:"บันทึก Context, Setup, Trigger, Entry, Stop, Target, Result และภาพประกอบ"},{id:"b",text:"บันทึกเพียงคำว่า ชนะ/แพ้"},{id:"c",text:"จำผลไว้ในหัว"},{id:"d",text:"เก็บเฉพาะ Trade ที่ชนะ"}],answer:"a",explanation:"ถูกต้อง — รายละเอียดทำให้ตรวจได้ว่ากฎส่วนใดเกิดขึ้นและผลเป็นอย่างไร",hint:"ข้อมูลต้องช่วยย้อนตรวจการตัดสินใจได้"},
        {id:"bt03-q2",type:"choice",question:"ถ้า 1R ของ Trade หนึ่งเท่ากับเงินที่ยอมเสี่ยง และ Trade จบที่กำไรสองเท่าของความเสี่ยง ผลคือเท่าไร?",options:[{id:"a",text:"+2R"},{id:"b",text:"-2R"},{id:"c",text:"+0.5R"},{id:"d",text:"บอกไม่ได้แม้รู้ผลกำไรเทียบกับ Risk"}],answer:"a",explanation:"ถูกต้อง — กำไรสองเท่าของความเสี่ยงเริ่มต้น = +2R",hint:"1R คือหน่วยความเสี่ยงของ Trade"}
      ]},
      { id:"backtesting-04", order:4, type:"lesson", title:"อ่าน Win Rate และค่า R", objective:"คำนวณและตีความ Win Rate กับผลลัพธ์เป็น R โดยไม่สรุปจากตัวเลขเดียว", topics:["Win Rate","Average Win","Average Loss","R Multiple","Expectancy Concept"], content:[
        {type:"text",text:"Win Rate คือสัดส่วน Trade ที่ชนะ เช่น ชนะ 6 จาก 10 Trade = 60% แต่ Win Rate อย่างเดียวไม่บอกว่าระบบได้หรือเสียเท่าไร เพราะขนาดของกำไรและขาดทุนแต่ละครั้งก็สำคัญ"},
        {type:"text",text:"จึงควรดูร่วมกับ Average Win และ Average Loss เช่น ระบบหนึ่งชนะไม่บ่อย แต่เมื่อชนะได้หลาย R และเมื่อแพ้เสียประมาณ 1R อาจมีผลรวมต่างจากระบบที่ชนะบ่อยแต่กำไรต่อครั้งเล็กมาก"},
        {type:"example",label:"ตัวอย่าง",text:"10 Trades: ชนะ 4 ครั้งที่เฉลี่ย +2R และแพ้ 6 ครั้งที่เฉลี่ย -1R → ผลรวมโดยประมาณ = +8R - 6R = +2R แม้ Win Rate = 40%"},
        {type:"example",label:"อย่าดูตัวเลขเดียว",text:"Win Rate สูงไม่ได้แปลว่าระบบดีกว่าเสมอ และ RR สูงก็ไม่ได้แปลว่าระบบดีกว่าเสมอ ต้องดูข้อมูลร่วมกัน"}
      ], exercises:[
        {id:"bt04-q1",type:"number",question:"ทดสอบ 20 Trades ชนะ 8 Trades — Win Rate เท่ากับกี่เปอร์เซ็นต์?",answer:40,tolerance:0,unit:"%",explanation:"8 ÷ 20 × 100 = 40%",hint:"จำนวนชนะ ÷ จำนวน Trade ทั้งหมด × 100"},
        {id:"bt04-q2",type:"choice",question:"ระบบ A Win Rate 40% แต่ Average Win +2R และ Average Loss -1R ข้อใดถูกต้องที่สุด?",options:[{id:"a",text:"ยังสรุปไม่ได้จาก Win Rate อย่างเดียว ต้องดูผลรวมและสถิติร่วมกัน"},{id:"b",text:"ระบบแพ้แน่นอนเพราะ Win Rate ต่ำกว่า 50%"},{id:"c",text:"ระบบดีแน่นอนเพราะ Average Win 2R"},{id:"d",text:"Win Rate ไม่มีประโยชน์เลย"}],answer:"a",explanation:"ถูกต้อง — ต้องพิจารณาความถี่และขนาด Win/Loss ร่วมกัน",hint:"อย่าให้ตัวเลขเดียวตัดสินทั้งระบบ"}
      ]},
      { id:"backtesting-05", order:5, type:"lesson", title:"ดูผลรวมและช่วงขาดทุน", objective:"เข้าใจผลรวม R และ Drawdown เบื้องต้น เพื่อเห็นทั้งผลตอบแทนและความยากในการทนต่อช่วงแพ้", topics:["Net R","Drawdown","Losing Streak","Equity Path"], content:[
        {type:"text",text:"นอกจาก Win Rate ให้ดูผลรวม R ของชุดทดสอบ เช่น +12R หมายถึงผลของ Trade ทั้งหมดรวมกันได้ 12 หน่วยความเสี่ยงตามนิยามของระบบ แต่ตัวเลขนี้ควรดูพร้อมเส้นทางที่เกิดขึ้นระหว่างทาง"},
        {type:"text",text:"Drawdown แบบง่ายคือการลดลงจากจุดสูงสุดของผลสะสมไปยังจุดต่ำถัดมา เช่น ผลสะสมขึ้นถึง +10R แล้วลดลงเหลือ +6R ก่อนฟื้น เท่ากับมี Drawdown 4R ในช่วงนั้น"},
        {type:"example",label:"ทำไมต้องดู Drawdown",text:"สองระบบอาจจบที่ +10R เหมือนกัน แต่ระบบหนึ่งเคยลดลง -3R จากจุดสูงสุด ขณะที่อีกระบบเคยลดลง -12R ประสบการณ์และความเสี่ยงระหว่างทางต่างกันมาก"},
        {type:"example",label:"Losing Streak",text:"จดจำนวนแพ้ติดกันสูงสุดด้วย เพราะช่วยให้เห็นว่าช่วงแพ้ที่เกิดในตัวอย่างมีขนาดประมาณไหน โดยไม่รับประกันว่าอนาคตจะไม่ยาวกว่านั้น"}
      ], exercises:[
        {id:"bt05-q1",type:"number",question:"ผลสะสมเคยขึ้นถึง +9R แล้วลดลงเหลือ +5R ก่อนฟื้น — Drawdown จากจุดสูงสุดช่วงนั้นเท่ากับกี่ R?",answer:4,tolerance:0,unit:"R",explanation:"9R - 5R = 4R",hint:"วัดจาก Peak ลงมาถึงจุดต่ำของช่วงนั้น"},
        {id:"bt05-q2",type:"choice",question:"เหตุใดควรดู Drawdown ร่วมกับผลรวม R?",options:[{id:"a",text:"เพื่อเห็นว่าระหว่างทางระบบเคยลดลงจากจุดสูงสุดมากเพียงใด ไม่ดูเฉพาะผลปลายทาง"},{id:"b",text:"เพื่อทำนาย Loss ถัดไปได้แน่นอน"},{id:"c",text:"เพื่อทำให้ Win Rate สูงขึ้น"},{id:"d",text:"เพื่อไม่ต้องใช้ Stop"}],answer:"a",explanation:"ถูกต้อง — ผลปลายทางอย่างเดียวซ่อนความผันผวนและช่วงขาดทุนระหว่างทางได้",hint:"เปรียบเทียบปลายทางกับเส้นทางที่ใช้ไปถึงปลายทาง"}
      ]},
      { id:"backtesting-06", order:6, type:"lesson", title:"หาว่าระบบทำงานในสภาพไหน", objective:"แยกผลตามเงื่อนไขที่กำหนดไว้เพื่อค้นหารูปแบบ โดยไม่เลือกข้อมูลเฉพาะที่สนับสนุนความเชื่อ", topics:["Segmentation","Market Context","Sample Size","Pattern","Bias"], content:[
        {type:"text",text:"เมื่อมีข้อมูลมากพอ เราสามารถแยกดูตามตัวแปรที่ระบบบันทึกไว้ เช่น Context, ช่วงเวลา, Setup Type หรือเงื่อนไขอื่น เพื่อดูว่าผลแตกต่างกันหรือไม่ นี่คือการตั้งคำถามกับข้อมูล ไม่ใช่การหาเหตุผลให้ระบบดูดี"},
        {type:"text",text:"อย่ารีบสรุปจากตัวอย่างน้อยมาก เช่น ชนะ 3 ครั้งติดในเงื่อนไขหนึ่งยังไม่เพียงพอที่จะบอกว่าเงื่อนไขนั้นดีที่สุด ควรเก็บตัวอย่างเพิ่มและใช้กฎการแบ่งข้อมูลที่กำหนดอย่างมีเหตุผล"},
        {type:"example",label:"ตัวอย่างการถามข้อมูล",text:"จาก 100 Trades ระบบมีผลอย่างไรใน Directional Context เทียบกับ Range? → ถ้าเห็นความต่าง จดเป็นสมมติฐานและทดสอบต่อ แทนการลบข้อมูลที่ไม่ชอบ"},
        {type:"example",label:"ระวัง Overfitting",text:"ถ้าแก้กฎหลายจุดเพื่อให้เข้ากับ Trade ในอดีตทุกครั้ง ระบบอาจจำอดีตได้ดีแต่ไม่ได้หมายความว่าจะทำงานกับข้อมูลใหม่"}
      ], exercises:[
        {id:"bt06-q1",type:"choice",question:"หลังพบว่า 3 Trade ในช่วงหนึ่งชนะทั้งหมด ควรสรุปทันทีว่าเงื่อนไขนั้นดีที่สุดหรือไม่?",options:[{id:"a",text:"ไม่ — ตัวอย่างยังน้อย ควรเก็บและทดสอบเพิ่มก่อนสรุป"},{id:"b",text:"ใช่ เพราะ 3/3 = 100%"},{id:"c",text:"ใช่และควรเพิ่ม Risk ทันที"},{id:"d",text:"ใช่และลบ Trade อื่นออก"}],answer:"a",explanation:"ถูกต้อง — ตัวอย่างเล็กทำให้ผลผันผวนและสรุปเกินข้อมูลได้ง่าย",hint:"แยกเปอร์เซ็นต์ที่เห็นออกจากความมั่นใจในข้อสรุป"},
        {id:"bt06-q2",type:"choice",question:"การแก้กฎซ้ำ ๆ เพื่อให้เข้ากับทุก Trade ในอดีตมีความเสี่ยงอะไร?",options:[{id:"a",text:"ระบบอาจเข้ากับข้อมูลเก่ามากเกินไปและไม่สะท้อนความสามารถกับข้อมูลใหม่"},{id:"b",text:"ทำให้ตลาดหยุดเคลื่อน"},{id:"c",text:"ทำให้ Spread เป็นศูนย์"},{id:"d",text:"ทำให้ทุก Trade ในอนาคตชนะ"}],answer:"a",explanation:"ถูกต้อง — นี่คือแนวคิดของการปรับเข้ากับอดีตมากเกินไป (Overfitting)",hint:"ระบบไม่ควรถูกออกแบบเพื่ออธิบายอดีตทุกจุดให้สมบูรณ์"}
      ]},
      { id:"backtesting-07", order:7, type:"lesson", title:"สรุป Backtest และตัดสินใจขั้นถัดไป", objective:"สร้างสรุปผลที่แยกข้อมูลออกจากความคิดเห็น และเลือกขั้นตอนถัดไปอย่างมีเหตุผล", topics:["Backtest Report","Evidence","Revise","Retest","Forward Test"], content:[
        {type:"text",text:"เมื่อจบชุดทดสอบ ให้สรุปอย่างน้อย: จำนวน Trades, Win Rate, Average Win, Average Loss, ผลรวม R, Drawdown ที่พบ, Losing Streak และเงื่อนไขที่สังเกตว่าควรศึกษาต่อ พร้อมบันทึก Version ของกฎ"},
        {type:"text",text:"จากนั้นแยก ‘ข้อมูล’ ออกจาก ‘การตีความ’ เช่น ข้อมูล: 100 Trades, Win Rate 44%, Net +15R, Max Drawdown ที่พบ 7R ส่วนการตีความ: ระบบอาจมีแนวโน้มทำงานดีกว่าใน Context หนึ่ง ซึ่งยังต้องทดสอบเพิ่มเติม"},
        {type:"example",label:"3 ทางเลือกหลัง Backtest",text:"1) กฎยังคลุมเครือ/ผลไม่เป็นไปตามสมมติฐาน → ปรับอย่างมีเหตุผลแล้วเริ่ม Version ใหม่ | 2) ตัวอย่างยังน้อย → ทดสอบเพิ่ม | 3) กฎชัดและมีหลักฐานเพียงพอสำหรับขั้นเรียนรู้ → ไป Forward Test / Demo ด้วยกฎเดิม"},
        {type:"example",label:"จำไว้",text:"Backtest ที่ดูดีไม่รับประกันผลในอนาคต เป้าหมายคือสร้างหลักฐานและรู้จักพฤติกรรมของระบบก่อนเจอตลาดที่กำลังเดินจริง"},
        {type:"text",text:"Module ถัดไปคือ Forward Testing / Demo: ใช้กฎเดิมกับข้อมูลที่เกิดขึ้นใหม่ทีละเหตุการณ์ โดยไม่เสี่ยงเงินจริง เพื่อดูว่าเราสามารถ Execute ระบบได้จริงหรือไม่"}
      ], exercises:[
        {id:"bt07-q1",type:"choice",question:"ข้อใดเป็นสรุป Backtest ที่มีประโยชน์ที่สุด?",options:[{id:"a",text:"จำนวน Trade + Win Rate + Average Win/Loss + Net R + Drawdown + Losing Streak + Version ของกฎ"},{id:"b",text:"ระบบนี้สุดยอด"},{id:"c",text:"จำได้ว่าชนะบ่อย"},{id:"d",text:"เก็บเฉพาะภาพ Trade ที่กำไร"}],answer:"a",explanation:"ถูกต้อง — สรุปควรเป็นข้อมูลที่ตรวจสอบได้และเชื่อมกับกฎ Version ที่ทดสอบ",hint:"รายงานควรทำให้คนอื่นเข้าใจว่าทดสอบอะไรและได้ผลอย่างไร"},
        {id:"bt07-q2",type:"choice",question:"ระบบมีกฎชัด ทดสอบชุดย้อนหลังแล้ว และต้องการดูว่าตัวเองทำตามกฎได้กับข้อมูลใหม่โดยยังไม่เสี่ยงเงินจริง ขั้นถัดไปคืออะไร?",options:[{id:"a",text:"Forward Testing / Demo"},{id:"b",text:"เพิ่มเงินจริงทันที"},{id:"c",text:"หยุดเก็บข้อมูล"},{id:"d",text:"เปลี่ยนระบบทุกวัน"}],answer:"a",explanation:"ถูกต้อง — Forward Test เป็นสะพานจากข้อมูลย้อนหลังไปสู่การตัดสินใจเมื่อข้อมูลใหม่เกิดขึ้นจริง",hint:"ขั้นถัดไปควรลดความเสี่ยงแต่เพิ่มความสมจริง"}
      ]},
      { id:"backtesting-08", order:8, type:"assessment", title:"แบบทดสอบท้าย Module", objective:"ตรวจว่าผู้เรียนสามารถ Backtest ระบบด้วยกฎคงที่ เก็บข้อมูล และอ่านผลพื้นฐานได้", topics:["10 ข้อ","ผ่านเมื่อได้ตั้งแต่ 70%"], questions:[
        {id:"bt-a01",question:"Backtesting ที่ถูกหลักควรเริ่มจากอะไร?",options:[{id:"a",text:"กฎระบบที่กำหนดไว้ก่อน แล้วจึงนำไปใช้กับข้อมูลอดีต"},{id:"b",text:"เลือก Trade ที่ชนะก่อนแล้วค่อยเขียนกฎ"},{id:"c",text:"รู้ผลอนาคตก่อน Entry"},{id:"d",text:"เปลี่ยนกฎทุก Trade"}],answer:"a",explanation:"Backtest ต้องทดสอบกฎ ไม่ใช่สร้างกฎจากผลลัพธ์แต่ละจุด"},
        {id:"bt-a02",question:"เมื่อเปลี่ยน Trigger ของระบบอย่างมีนัยสำคัญระหว่างการทดสอบ ควรทำอย่างไร?",options:[{id:"a",text:"สร้าง Version ใหม่และเริ่มชุดข้อมูลใหม่"},{id:"b",text:"รวมผลเดิมกับใหม่โดยไม่ระบุ"},{id:"c",text:"ลบ Loss เดิม"},{id:"d",text:"แก้ผลย้อนหลัง"}],answer:"a",explanation:"กฎต่างกันคือการทดสอบคนละ Version"},
        {id:"bt-a03",question:"ข้อใดควรอยู่ใน Trade Log?",options:[{id:"a",text:"Context, Setup, Trigger, Entry, Stop, Target และ Result"},{id:"b",text:"เฉพาะกำไร"},{id:"c",text:"เฉพาะชื่อ Indicator"},{id:"d",text:"เฉพาะความรู้สึก"}],answer:"a",explanation:"Trade Log ต้องย้อนตรวจการตัดสินใจและผลลัพธ์ได้"},
        {id:"bt-a04",question:"ชนะ 12 จาก 30 Trades มี Win Rate เท่าไร?",options:[{id:"a",text:"40%"},{id:"b",text:"30%"},{id:"c",text:"60%"},{id:"d",text:"70%"}],answer:"a",explanation:"12 ÷ 30 × 100 = 40%"},
        {id:"bt-a05",question:"เหตุใด Win Rate อย่างเดียวจึงไม่พอ?",options:[{id:"a",text:"เพราะต้องดูขนาด Average Win/Loss และผลรวมร่วมด้วย"},{id:"b",text:"เพราะ Win Rate ใช้ไม่ได้กับ Trading"},{id:"c",text:"เพราะทุกระบบต้องมี 50%"},{id:"d",text:"เพราะ Win Rate บอก Drawdown ได้ครบอยู่แล้ว"}],answer:"a",explanation:"ความถี่ของ Win ต้องดูร่วมกับขนาดผลลัพธ์"},
        {id:"bt-a06",question:"ผลสะสมขึ้นถึง +15R แล้วลดลงเหลือ +9R ก่อนฟื้น Drawdown ช่วงนั้นคือเท่าไร?",options:[{id:"a",text:"6R"},{id:"b",text:"9R"},{id:"c",text:"15R"},{id:"d",text:"24R"}],answer:"a",explanation:"15R - 9R = 6R"},
        {id:"bt-a07",question:"ชนะ 3 Trade แรกในเงื่อนไขใหม่ทั้งหมด ควรทำอะไร?",options:[{id:"a",text:"เก็บตัวอย่างเพิ่มก่อนสรุปว่าเงื่อนไขนั้นดีกว่า"},{id:"b",text:"สรุปทันทีว่า Win Rate จริงคือ 100%"},{id:"c",text:"เพิ่ม Risk สูงสุด"},{id:"d",text:"หยุดทดสอบ"}],answer:"a",explanation:"ตัวอย่างน้อยยังมีความไม่แน่นอนสูง"},
        {id:"bt-a08",question:"Overfitting ในบริบทนี้ใกล้เคียงข้อใด?",options:[{id:"a",text:"ปรับกฎให้เข้ากับรายละเอียดข้อมูลอดีตมากเกินไปจนเสี่ยงใช้กับข้อมูลใหม่ไม่ได้"},{id:"b",text:"ใช้ Stop ตามกฎ"},{id:"c",text:"เก็บ Screenshot"},{id:"d",text:"คำนวณ Win Rate"}],answer:"a",explanation:"การเข้ากับอดีตมากเกินไปอาจไม่สะท้อนความสามารถกับข้อมูลใหม่"},
        {id:"bt-a09",question:"ข้อใดแยก Data กับ Interpretation ได้ถูกต้อง?",options:[{id:"a",text:"Data: 100 Trades, Net +10R | Interpretation: อาจมีเงื่อนไขบางแบบที่ควรทดสอบเพิ่ม"},{id:"b",text:"Data: ระบบนี้ดีที่สุด"},{id:"c",text:"Data: Trade ถัดไปต้องชนะ"},{id:"d",text:"Interpretation: 100 Trades"}],answer:"a",explanation:"ข้อมูลคือสิ่งที่วัดได้ ส่วนการตีความคือข้อสรุปหรือสมมติฐานจากข้อมูล"},
        {id:"bt-a10",question:"หลัง Backtest ระบบมีกฎชัดและต้องการทดสอบกับข้อมูลใหม่โดยยังไม่ใช้เงินจริง ขั้นต่อไปคืออะไร?",options:[{id:"a",text:"Forward Testing / Demo"},{id:"b",text:"Live ด้วย Risk สูงทันที"},{id:"c",text:"เลิกบันทึก Trade"},{id:"d",text:"ใช้ข้อมูลอนาคตเพิ่ม"}],answer:"a",explanation:"Forward Test คือขั้นถัดไปของ Learning Path"}
      ]}

        {type:"example",label:"เป้าหมาย",text:"ไม่ได้พิสูจน์ว่า Trade ถัดไปต้องชนะ แต่ตรวจทั้งพฤติกรรมของระบบและความสามารถของเราในการทำตามระบบ"}
      ], exercises:[
        {id:"ft01-q1",type:"choice",question:"ข้อใดอธิบาย Forward Testing ได้ถูกต้องที่สุด?",options:[{id:"a",text:"ใช้กฎเดิมกับข้อมูลใหม่ที่เกิดขึ้นทีละเหตุการณ์โดยยังไม่รู้ผลล่วงหน้า"},{id:"b",text:"เปิดกราฟย้อนหลังแล้วเลือกเฉพาะ Trade ที่ชนะ"},{id:"c",text:"ใช้เงินจริงสูงเพื่อให้ผลชัดเร็ว"},{id:"d",text:"เปลี่ยนระบบทุกครั้งที่แพ้"}],answer:"a",explanation:"ถูกต้อง — Forward Test เพิ่มความสมจริงเพราะเราต้องตัดสินใจก่อนรู้ผล",hint:"คิดถึงความต่างระหว่างอดีตที่มีข้อมูลครบกับข้อมูลที่กำลังเกิด"},
        {id:"ft01-q2",type:"choice",question:"เหตุใด Demo จึงเหมาะกับขั้นนี้?",options:[{id:"a",text:"ช่วยฝึก Execute ระบบกับตลาดที่กำลังเดินโดยยังไม่ต้องเสี่ยงเงินจริง"},{id:"b",text:"ทำให้ระบบชนะมากขึ้นโดยอัตโนมัติ"},{id:"c",text:"ทำให้ไม่ต้องใช้ Stop"},{id:"d",text:"ทำให้รู้อนาคตของราคา"}],answer:"a",explanation:"ถูกต้อง — จุดประสงค์คือเพิ่มความสมจริงโดยยังควบคุมความเสี่ยงด้านเงินจริง",hint:"ขั้นนี้เป็นสะพานระหว่างการทดสอบกับการใช้งานจริง"}
      ]},
      { id:"forward-testing-02", order:2, type:"lesson", title:"เตรียมระบบก่อนเริ่ม", objective:"กำหนด Version กฎ สภาพแวดล้อม และวิธีบันทึกให้คงที่ก่อนเริ่ม Forward Test", topics:["System Version","Market","Timeframe","Risk Simulation","Journal"], content:[
        {type:"text",text:"ก่อนเริ่ม ให้ระบุระบบ Version ที่จะทดสอบ ตลาด Timeframe ช่วงเวลาที่สังเกต กฎ Context → Setup → Trigger → Execute & Risk และรูปแบบการบันทึกให้ชัด การกำหนดสิ่งเหล่านี้ก่อนช่วยลดการเปลี่ยนเงื่อนไขตามสิ่งที่เพิ่งเกิด"},
        {type:"text",text:"ถ้าใช้ Demo ให้กำหนด Risk จำลองอย่างสม่ำเสมอเพื่อให้ผลเปรียบเทียบกันได้ จุดประสงค์ไม่ใช่ทำยอด Demo ให้สูงที่สุด แต่ทำให้กระบวนการใกล้เคียงกฎที่เราต้องการฝึก"},
        {type:"example",label:"Forward Test Plan",text:"System V1 | Market: ตลาดที่เลือก | TF: ตามระบบ | Session: ช่วงที่กำหนด | Risk: หน่วยคงที่ตามแผน | บันทึกทุก Valid Setup และ Rule Violation"},
        {type:"example",label:"ห้ามเริ่มแบบคลุมเครือ",text:"ถ้ายังตอบไม่ได้ว่าอะไรคือ Valid Setup หรือเมื่อไรต้อง No Trade ให้กลับไปแก้กฎก่อนเริ่มเก็บชุด Forward Test"}
      ], exercises:[
        {id:"ft02-q1",type:"choice",question:"ก่อนเริ่ม Forward Test ควรกำหนดอะไร?",options:[{id:"a",text:"System Version, ตลาด/TF, กฎ, Risk จำลอง และวิธีบันทึก"},{id:"b",text:"ยอดกำไรที่ต้องทำให้ได้ทุกวัน"},{id:"c",text:"จำนวน Trade ขั้นต่ำต่อวัน"},{id:"d",text:"วิธีเปลี่ยน Trigger หลังเห็นราคา"}],answer:"a",explanation:"ถูกต้อง — เราต้องรู้ว่ากำลังทดสอบอะไรภายใต้เงื่อนไขใด",hint:"ทำให้การทดสอบแต่ละวันเปรียบเทียบกันได้"},
        {id:"ft02-q2",type:"choice",question:"หากยังนิยาม Valid Setup ไม่ชัด ควรทำอย่างไรก่อนเริ่ม Forward Test?",options:[{id:"a",text:"กลับไปทำกฎให้ชัดก่อน"},{id:"b",text:"เริ่มก่อนแล้วใช้ความรู้สึกตัดสิน"},{id:"c",text:"เพิ่มจำนวน Trade"},{id:"d",text:"ใช้เงินจริงเพื่อบังคับให้ตัดสินใจ"}],answer:"a",explanation:"ถูกต้อง — Forward Test ไม่ได้แก้ปัญหากฎที่ยังนิยามไม่ได้",hint:"การทดสอบต้องมีสิ่งที่ชัดเจนให้ทดสอบ"}
      ]},
      { id:"forward-testing-03", order:3, type:"lesson", title:"รอและ Execute ตามกฎ", objective:"ฝึกทำตามลำดับระบบเมื่อข้อมูลเกิดขึ้นจริง และยอมรับ No Trade เป็นผลลัพธ์ที่ถูกต้อง", topics:["Wait","Valid Setup","Trigger","No Trade","Execution"], content:[
        {type:"text",text:"ในตลาดที่กำลังเดิน เราไม่สามารถเร่งให้ Setup เกิดได้ หน้าที่คือเดินตามลำดับเดิม: 1) Context ผ่านหรือไม่ 2) Setup/Location เกิดหรือไม่ 3) Trigger ยืนยันหรือไม่ 4) ถ้าครบจึง Execute ตาม Risk Plan"},
        {type:"text",text:"ถ้าขั้นใดไม่ผ่าน ให้หยุดที่ขั้นนั้น การไม่มี Trade ไม่ใช่ความล้มเหลวของ Forward Test เพราะหนึ่งในสิ่งที่กำลังฝึกคือความสามารถในการไม่กดออเดอร์เมื่อระบบยังไม่อนุญาต"},
        {type:"example",label:"ตัวอย่าง",text:"Context ผ่าน → Setup ผ่าน → Trigger ยังไม่เกิด → ผลลัพธ์ของกระบวนการ = WAIT / NO TRADE ไม่ใช่เดา Entry ล่วงหน้า"},
        {type:"example",label:"วัด Process",text:"Trade ที่ขาดทุนแต่ทำตามกฎครบ อาจเป็น Execution ที่ถูกต้อง ส่วน Trade ที่กำไรจากการข้ามกฎยังเป็น Rule Violation"}
      ], exercises:[
        {id:"ft03-q1",type:"choice",question:"Context และ Setup ผ่าน แต่ Trigger ยังไม่เกิด ควรทำอย่างไร?",options:[{id:"a",text:"รอหรือ No Trade"},{id:"b",text:"เข้าเลยเพราะกลัวพลาด"},{id:"c",text:"เพิ่ม Risk"},{id:"d",text:"ลบ Trigger ออกจากระบบ"}],answer:"a",explanation:"ถูกต้อง — ต้องไม่ข้ามลำดับของระบบ",hint:"เงื่อนไขไม่ครบ = ยังไม่มีสิทธิ์ Execute"},
        {id:"ft03-q2",type:"choice",question:"Trade ขาดทุน -1R แต่ทำตามกฎครบทุกขั้น ควรจัดอย่างไรในด้าน Execution?",options:[{id:"a",text:"เป็น Trade ที่ทำตามกระบวนการ แม้ผลลัพธ์เป็น Loss"},{id:"b",text:"ถือว่าทำผิดเพราะ Trade ที่ถูกต้องต้องชนะ"},{id:"c",text:"ลบออกจาก Journal"},{id:"d",text:"เปลี่ยนกฎย้อนหลังให้ Trade นี้ไม่เกิด"}],answer:"a",explanation:"ถูกต้อง — คุณภาพการ Execute กับผลของ Trade เป็นคนละเรื่อง",hint:"อย่าสับสน Outcome กับ Process"}
      ]},
      { id:"forward-testing-04", order:4, type:"lesson", title:"บันทึกผลของระบบและผลของคน", objective:"แยก System Result ออกจาก Execution Error เพื่อรู้ว่าปัญหาเกิดจากกฎหรือการทำตามกฎ", topics:["Journal","Rule Violation","Execution Error","System Result"], content:[
        {type:"text",text:"Forward Journal ควรเก็บข้อมูล Trade คล้าย Backtest แต่เพิ่มข้อมูลการ Execute เช่น Valid Setup หรือไม่, เข้าเมื่อ Trigger ครบหรือไม่, Entry/Stop/Target ตรงกฎหรือไม่ และมีการแทรกแซงแผนระหว่าง Trade หรือไม่"},
        {type:"text",text:"การแยกสองเรื่องนี้สำคัญมาก: System Result คือผลของ Trade ที่ทำตามกฎ ส่วน Execution Error คือความต่างระหว่างสิ่งที่ระบบกำหนดกับสิ่งที่เราทำจริง ถ้าปนกัน เราอาจแก้ระบบทั้งที่ปัญหาจริงคือไม่ได้ทำตามระบบ"},
        {type:"example",label:"ตัวอย่าง A",text:"Valid Setup → ทำตามกฎครบ → -1R = System Trade / Correct Execution"},
        {type:"example",label:"ตัวอย่าง B",text:"ไม่มี Trigger → เข้าเพราะกลัวพลาด → +2R = ผลเงินเป็นบวก แต่เป็น Rule Violation และไม่ควรใช้เป็นหลักฐานว่ากฎเดิมทำงาน"}
      ], exercises:[
        {id:"ft04-q1",type:"choice",question:"เข้า Trade โดยไม่มี Trigger ตามกฎ แต่สุดท้ายกำไร +2R ควรบันทึกอย่างไร?",options:[{id:"a",text:"บันทึกเป็น Rule Violation แม้ผลเงินเป็นบวก"},{id:"b",text:"บันทึกเป็น Perfect Trade เพราะกำไร"},{id:"c",text:"ไม่ต้องบันทึก"},{id:"d",text:"แก้กฎย้อนหลังให้ Entry นี้ถูก"}],answer:"a",explanation:"ถูกต้อง — Outcome ที่ดีไม่ได้ทำให้การข้ามกฎกลายเป็น Execution ที่ถูกต้อง",hint:"แยกเงินที่ได้ออกจากคุณภาพกระบวนการ"},
        {id:"ft04-q2",type:"choice",question:"เหตุใดต้องแยก System Result กับ Execution Error?",options:[{id:"a",text:"เพื่อรู้ว่าผลที่เห็นมาจากกฎของระบบหรือจากการที่เราทำต่างจากกฎ"},{id:"b",text:"เพื่อทำให้ Win Rate สูงขึ้น"},{id:"c",text:"เพื่อไม่ต้องบันทึก Loss"},{id:"d",text:"เพื่อทำนาย Trade ถัดไป"}],answer:"a",explanation:"ถูกต้อง — ถ้าไม่แยก เราอาจวินิจฉัยปัญหาผิดจุด",hint:"ระบบกับคนเป็นตัวแปรคนละส่วน"}
      ]},
      { id:"forward-testing-05", order:5, type:"lesson", title:"อย่าแก้ระบบจาก Trade เดียว", objective:"เรียนรู้การรักษา Version ของระบบและประเมินการเปลี่ยนแปลงจากชุดข้อมูล ไม่ตอบสนองต่อผลลัพธ์รายครั้ง", topics:["Sample","Version Control","Outcome Bias","Review"], content:[
        {type:"text",text:"Forward Test จะทำให้ Loss รู้สึกจริงกว่า Backtest และนี่เป็นจุดที่คนมักอยากแก้ระบบทันที แต่ Trade เดียวเป็นเพียงหนึ่งตัวอย่าง การเปลี่ยนกฎหลังทุก Win/Loss ทำให้เราไม่รู้ว่า Version เดิมมีพฤติกรรมอย่างไร"},
        {type:"text",text:"ถ้าพบปัญหาที่กฎ ให้จดเป็น Review Note แล้วประเมินเมื่อถึงรอบทบทวนหรือเมื่อได้ชุดตัวอย่างตามแผน หากตัดสินใจแก้กฎอย่างมีนัยสำคัญ ให้สร้าง Version ใหม่และทดสอบแยก"},
        {type:"example",label:"ไม่ทำ",text:"Loss 1 ครั้ง → เพิ่ม Confirmation → Win 1 ครั้ง → ลบ Confirmation → Loss → เปลี่ยน Target แบบนี้ทำให้ข้อมูลแต่ละ Tradeมาจากคนละระบบ"},
        {type:"example",label:"ทำ",text:"รักษา V1 ตามแผน → เก็บ Observation → Review เป็นชุด → ถ้าจำเป็นออกแบบ V2 → Backtest/Forward Test V2 แยกจาก V1"}
      ], exercises:[
        {id:"ft05-q1",type:"choice",question:"หลัง Forward Test แพ้ Trade แรก ควรทำอะไรเป็นหลัก?",options:[{id:"a",text:"บันทึกผลและทำตามแผนการทดสอบต่อ ไม่รีบแก้ระบบจากตัวอย่างเดียว"},{id:"b",text:"เปลี่ยน Entry ทันที"},{id:"c",text:"เพิ่ม Risk เพื่อเอาคืน"},{id:"d",text:"ลบ Trade ออกจากข้อมูล"}],answer:"a",explanation:"ถูกต้อง — หนึ่ง Trade ไม่เพียงพอให้ตัดสินระบบทั้งชุด",hint:"รักษา Version เพื่อให้ข้อมูลมีความหมาย"},
        {id:"ft05-q2",type:"choice",question:"หาก Review แล้วตัดสินใจเปลี่ยนกฎอย่างมีนัยสำคัญ ควรทำอย่างไร?",options:[{id:"a",text:"สร้าง Version ใหม่และเก็บผลแยกจาก Version เดิม"},{id:"b",text:"แก้ผล Trade เก่าให้เหมือนกฎใหม่"},{id:"c",text:"รวมทุก Version โดยไม่ระบุ"},{id:"d",text:"เก็บเฉพาะ Trade ที่สนับสนุนกฎใหม่"}],answer:"a",explanation:"ถูกต้อง — Version Control ทำให้รู้ว่าข้อมูลมาจากกฎชุดใด",hint:"กฎใหม่ = สิ่งที่ต้องทดสอบใหม่"}
      ]},
      { id:"forward-testing-06", order:6, type:"lesson", title:"ทบทวนเป็นรอบ ไม่ตัดสินจากกำไรอย่างเดียว", objective:"สร้าง Review ที่ดูทั้งสถิติระบบและความสม่ำเสมอในการ Execute", topics:["Review Cycle","Adherence","Net R","Drawdown","Mistakes"], content:[
        {type:"text",text:"เมื่อถึงรอบ Review ให้ดูสองกลุ่มข้อมูลพร้อมกัน กลุ่มแรกคือ System Metrics เช่น จำนวน Valid Trades, Win Rate, Average Win/Loss, Net R และ Drawdown ที่พบ กลุ่มที่สองคือ Execution Metrics เช่น จำนวน Rule Violations, Setup ที่พลาด และสัดส่วน Trade ที่ทำตามกฎครบ"},
        {type:"text",text:"อย่าใช้ยอดกำไรอย่างเดียวตัดสินความพร้อม ตัวอย่างเช่น Demo อาจกำไรเพราะมี Trade นอกระบบหนึ่งครั้งขนาดใหญ่ แต่กระบวนการยังไม่สม่ำเสมอ ในทางกลับกัน ชุดข้อมูลอาจติดลบช่วงสั้นแต่ผู้เรียนทำตามระบบครบ ซึ่งเป็นข้อมูลที่มีประโยชน์ต่อการประเมินระบบ"},
        {type:"example",label:"ตัวอย่าง Review",text:"20 Valid Trades | Rule Adherence 90% | Net +3R | Max DD 4R | 2 Rule Violations → แยกวิเคราะห์ว่า 2 ครั้งผิดตรงขั้นใด ไม่รวมคำว่า ‘วันนี้เทรดไม่เก่ง’ ที่วัดไม่ได้"},
        {type:"example",label:"คำถาม Review",text:"ฉันทำตามระบบหรือไม่? → ระบบให้ผลอย่างไรเมื่อทำตามกฎ? → ข้อมูลมากพอหรือยัง? → มีปัญหาที่เกิดซ้ำตรงขั้นไหน?"}
      ], exercises:[
        {id:"ft06-q1",type:"choice",question:"Forward Test ควร Review อะไรร่วมกับผลกำไร/ขาดทุน?",options:[{id:"a",text:"ความสม่ำเสมอในการทำตามกฎและ Rule Violations"},{id:"b",text:"เฉพาะจำนวนวันที่กำไร"},{id:"c",text:"เฉพาะ Trade ที่ดีที่สุด"},{id:"d",text:"เฉพาะความรู้สึกหลังปิดตลาด"}],answer:"a",explanation:"ถูกต้อง — ขั้นนี้ทดสอบทั้งระบบและความสามารถในการ Execute",hint:"ถามทั้ง ‘ระบบเป็นอย่างไร’ และ ‘เราทำตามระบบหรือไม่’"},
        {id:"ft06-q2",type:"number",question:"ทำ Forward Test 20 Valid Trades และมี 18 Trades ที่ทำตามกฎครบ — Rule Adherence เท่ากับกี่เปอร์เซ็นต์?",answer:90,tolerance:0,unit:"%",explanation:"18 ÷ 20 × 100 = 90%",hint:"จำนวนที่ทำตามกฎครบ ÷ Valid Trades ทั้งหมด × 100"}
      ]},
      { id:"forward-testing-07", order:7, type:"lesson", title:"จบ Beginner Path แล้วต้องทำอะไรต่อ", objective:"สรุปวงจรการพัฒนาระบบและกำหนดเกณฑ์ก่อนพิจารณาขยับจากการฝึกไปสู่ขั้นที่มีความเสี่ยงสูงขึ้น", topics:["Readiness","Evidence","Consistency","Iteration","Next Step"], content:[
